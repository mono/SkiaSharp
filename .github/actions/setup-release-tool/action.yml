name: Set up SkiaSharp release tool
description: Restore and build the repository-owned release CLI at the exact checked-out commit.

inputs:
  tooling-sha:
    description: Exact audited commit that must be checked out.
    required: true

runs:
  using: composite
  steps:
    - name: Verify exact tooling revision
      shell: bash
      env:
        TOOLING_SHA: ${{ inputs.tooling-sha }}
      run: |
        set -euo pipefail
        actual=$(git rev-parse HEAD)
        if [ "$actual" != "$TOOLING_SHA" ]; then
          echo "::error::Release tooling checkout is $actual, expected $TOOLING_SHA."
          exit 1
        fi

    - name: Set up pinned .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: |
          utils/SkiaSharp.ReleaseTool/packages.lock.json
          utils/SkiaSharp.ReleaseTool.Tests/packages.lock.json

    - name: Restore locked release tool
      shell: bash
      run: >-
        dotnet restore
        utils/SkiaSharp.ReleaseTool/SkiaSharp.ReleaseTool.csproj
        --locked-mode

    - name: Build release tool
      shell: bash
      run: >-
        dotnet build
        utils/SkiaSharp.ReleaseTool/SkiaSharp.ReleaseTool.csproj
        --configuration Release
        --no-restore
