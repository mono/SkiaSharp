name: Track - Artifact Sizes

# Measures the on-disk size of SkiaSharp / HarfBuzzSharp packages and their native
# binaries. ONE workflow, two modes chosen by a shared `resolve` job (mirroring the
# benchmark tracker's resolve → … → report shape):
#
#   * nightly  (schedule / manual dispatch)
#       Measures the latest nightly + released reference versions from the feeds, persists
#       the time-series to the `aw-data` branch (sizes/index.json, via persist-aw-data.yml),
#       and emits the shared interactive perf dashboard.
#
#   * pr       (the hourly sweep, or a manual dispatch naming a build id)
#       Measures the Azure DevOps job that already packed the NuGets — no rebuild here.
#       Downloads that build's `nuget` artifact, measures every .nupkg + every file inside,
#       diffs against the latest nightly baseline on `aw-data`, and posts/updates a size-diff
#       PR comment. Informational only: never blocks, never writes to `aw-data`.
#
# Both modes share the measurement primitives in scripts/infra/perf/sizes/ (track.py's
# measure_nupkg) and the render helpers in render_md.py.
#
# NOTE: PR mode is driven by an hourly *poll* of Azure DevOps. It must NEVER subscribe to
# `check_run` again. GitHub cannot filter that event by app, name, or path, so subscribing
# started a runner for EVERY completed check run on the default branch — including the ones
# our own Actions workflows publish. Since `persist-aw-data` runs on `workflow_run` of THIS
# workflow and then publishes its own check run, the two formed a self-sustaining loop: both
# reached 40,000 runs, and in a sample of 25 consecutive runs 24 did no work at all. A
# job-level `if:` cannot fix it — a *skipped* job still publishes a check run and still feeds
# the loop.
#
# The replacement is one anonymous Azure DevOps query per sweep that returns every recent
# PR build, so discovery is O(1) in the number of open pull requests rather than O(open
# PRs). Whether a build is reported is decided by a durable
# `<!-- build=<id> packaged=<time> -->` stamp in the PR comment rather than by the sweep's
# own clock: a build is measured only when its packages are NEWER than the ones already
# reported, so a duplicate sweep is a no-op, a missed one catches up, a stage re-run reports
# itself by finishing later, and a stale out-of-order result is ignored.
# See find_pr_builds.py for selection and pr_comment.py for the comment format itself.

on:
  schedule:
    - cron: "0 7 * * *"  # Nightly at 07:00 UTC (offset from the 08:00 benchmark tracker)
    - cron: "40 * * * *"  # Hourly PR sweep (looks back 2h, so a missed sweep self-heals)
  workflow_dispatch:
    inputs:
      build_id:
        description: "PR mode: AzDO build id to measure. Leave empty for a nightly run."
        required: false
        type: string
      pr_number:
        description: "PR mode: PR number to comment on (optional; resolved from the build)."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # The nightly run is a singleton (never cancel a persist). Sweeps are a singleton too, so
  # two cannot double-measure a build. A manual dispatch is keyed by its build id, so one
  # operator-requested measurement never blocks another.
  group: >-
    track-artifact-sizes-${{
      (github.event_name == 'schedule' && github.event.schedule == '0 7 * * *') && 'nightly'
      || github.event_name == 'schedule' && 'sweep'
      || github.event.inputs.build_id && format('build-{0}', github.event.inputs.build_id)
      || 'nightly' }}
  cancel-in-progress: false

env:
  DATA_BRANCH: aw-data

jobs:
  # --------------------------------------------------------------------------- #
  # Shared entrypoint: pick the mode and, for PR work, resolve the builds to measure.
  # --------------------------------------------------------------------------- #
  resolve:
    if: github.repository_owner == 'mono'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The sweep lists open PRs and reads their size-report comment. PR comments live on
      # the issues endpoint, so both scopes are needed to read the dedupe stamp.
      issues: read
      pull-requests: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      # Always a JSON array. On the nightly path the `builds` step is skipped, and an unset
      # output would be '' — `strategy.matrix` is expanded BEFORE the consuming job's `if:`,
      # so fromJSON('') would fail the whole run (and with it the nightly persist) before the
      # guard could skip the job.
      matrix: ${{ steps.builds.outputs.matrix || '[]' }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          INPUT_BUILD_ID: ${{ github.event.inputs.build_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ] && [ "$CRON" = "0 7 * * *" ]; then
            mode=nightly                       # the 07:00 feed measurement
          elif [ "$EVENT_NAME" = "schedule" ]; then
            mode=sweep                         # the hourly PR sweep
          elif [ -n "${INPUT_BUILD_ID:-}" ]; then
            mode=pr                            # manual fallback for one build
          else
            mode=nightly                       # manual nightly
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "mode=$mode"

      - name: Resolve the PR builds to measure
        id: builds
        if: steps.mode.outputs.mode != 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.mode }}
          INPUT_BUILD_ID: ${{ github.event.inputs.build_id }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "pr" ]; then
            # Manual fallback: measure exactly the build the operator named. This path
            # never consults the dedupe stamp, so it is also the deliberate retry route
            # for a build the sweep has already stamped.
            python3 - <<'PY' > matrix.json
          import datetime, json, os
          print(json.dumps([{
              "pr": (os.environ.get("INPUT_PR_NUMBER") or "").strip(),
              "build": os.environ["INPUT_BUILD_ID"].strip(),
              # A manual dispatch does not consult the stamp, so "now" is a truthful record
              # of when this report was produced and keeps the stamp strictly increasing.
              "packagedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S"),
          }]))
          PY
          else
            # Targeted poll. PR discovery and the per-PR stamp read both happen inside the
            # script so they can paginate and fail closed; the per-issue comments endpoint
            # ignores sort/direction and always returns oldest-first, so the size report
            # lives on the LAST page once a PR passes 100 comments.
            python3 scripts/infra/perf/sizes/find_pr_builds.py \
              --repo "$GITHUB_REPOSITORY" --hours 2 --output matrix.json
          fi
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          cat matrix.json

  # --------------------------------------------------------------------------- #
  # Nightly: measure feed packages, persist history, render the dashboard.
  # --------------------------------------------------------------------------- #
  nightly:
    needs: resolve
    if: needs.resolve.outputs.mode == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore size history from data branch
        # Read the existing history from the aw-data branch (public raw URL, no auth).
        # The file is persisted as sizes/index.json (see persist-aw-data.yml); it must be
        # restored under that same name or every run starts fresh and overwrites history
        # with a single day's data point. Missing (first run) is fine.
        run: |
          url="https://raw.githubusercontent.com/${{ github.repository }}/${DATA_BRANCH}/sizes/index.json"
          if curl -fsSL "$url" -o artifact-sizes.json; then
            echo "restored size history from $DATA_BRANCH/sizes/index.json"
          else
            echo "no existing sizes/index.json on $DATA_BRANCH (fresh start)"
            rm -f artifact-sizes.json
          fi

      - name: Collect artifact sizes
        run: |
          python3 scripts/infra/perf/sizes/track.py \
            --history artifact-sizes.json \
            --max-nightly 365 \
            --raw raw-sizes.json

      - name: Render Markdown summary (run summary)
        run: |
          python3 scripts/infra/perf/sizes/render_md.py \
            --history artifact-sizes.json

      - name: Fetch benchmarks from data branch (for the unified dashboard)
        run: |
          url="https://raw.githubusercontent.com/${{ github.repository }}/${DATA_BRANCH}/benchmarks/index.json"
          curl -fsSL "$url" -o branch-benchmarks.json || echo "{}" > branch-benchmarks.json

      - name: Build interactive HTML dashboard
        # Sizes embedded fresh; benchmarks come from the branch -> the same unified page.
        run: |
          mkdir -p out
          python3 scripts/infra/perf/render_html.py \
            scripts/infra/perf/templates/dashboard.html out/dashboard.html \
            branch-benchmarks.json artifact-sizes.json

      - name: Upload HTML dashboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-dashboard
          path: out/dashboard.html
          if-no-files-found: warn

      - name: Assemble data for the aw-data branch
        # Always build the payload (so dispatch/PR runs can download the exact `agent`
        # artifact and preview what would be persisted); the actual COMMIT to aw-data is
        # gated to main in persist-aw-data.yml (workflow_run head_branch == main). Writes
        # the size summary (index.json) and today's raw per-file snapshot (plain JSON,
        # additive) under agent/sizes/. The sentinel keeps the artifact's
        # least-common-ancestor at aw-upload/, preserving the required agent/ prefix.
        run: |
          mkdir -p aw-upload/agent/sizes/raw
          touch aw-upload/.artifact-root
          cp artifact-sizes.json aw-upload/agent/sizes/index.json
          [ -f raw-sizes.json ] && cp raw-sizes.json "aw-upload/agent/sizes/raw/$(date -u +%F).json" || true

      - name: Upload aw-data payload (agent)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent
          path: aw-upload
          if-no-files-found: warn

  # --------------------------------------------------------------------------- #
  # PR: measure the packages a PR build produced and post a size-diff comment.
  # --------------------------------------------------------------------------- #
  pr:
    needs: resolve
    if: needs.resolve.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Measured worst case is 7 PRs in a 2h window; each job gets its own runner, so the
      # ~1.1 GB download is not shared and disk is never contended.
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix || '[]') }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      BUILD_URL: https://dev.azure.com/dnceng-public/public/_build/results?buildId=${{ matrix.build }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Claim the build
        # Writes the dedupe stamp BEFORE the ~1 GB download. `if: failure()` cannot carry
        # this: a job hard-timeout (or a cancellation) kills the job outright, so no later
        # step runs and an unstampable build would be re-selected by every sweep forever.
        # Stamping the attempt up front makes the dedupe durable regardless of how the job
        # ends; the `workflow_dispatch` path ignores stamps and remains the retry route.
        run: |
          python3 scripts/infra/perf/sizes/pr_comment.py \
            --repo "$GITHUB_REPOSITORY" --pr "${{ matrix.pr }}" \
            --build "${{ matrix.build }}" --packaged-at "${{ matrix.packagedAt }}" \
            --status claiming --build-url "$BUILD_URL" --run-url "$RUN_URL"

      - name: Download + measure the PR's packages
        run: |
          python3 scripts/infra/perf/sizes/measure_pr.py \
            --build-id "${{ matrix.build }}" \
            ${{ matrix.pr && format('--pr-number {0}', matrix.pr) || '' }} \
            --output pr-sizes.json

      - name: Fetch the nightly baseline from the data branch
        # The nightly summary (sizes/index.json) points at the newest observation; the full
        # per-file breakdown for that day lives in sizes/raw/<date>.json. Missing baseline is
        # fine — the renderer then shows absolute sizes only.
        run: |
          base="https://raw.githubusercontent.com/${{ github.repository }}/${DATA_BRANCH}/sizes"
          date=$(curl -fsSL "$base/index.json" \
            | python3 -c "import sys,json; n=json.load(sys.stdin).get('nightly',[]); print(n[-1]['date'] if n else '')" \
            || true)
          if [ -n "$date" ] && curl -fsSL "$base/raw/$date.json" -o baseline.json; then
            echo "restored baseline for $date"
          else
            echo "no nightly baseline available (absolute-only report)"
            rm -f baseline.json
          fi

      - name: Render the size-diff comment
        # Body only: the marker and the dedupe stamp are added by pr_comment.py when it posts.
        run: |
          python3 scripts/infra/perf/sizes/render_pr_md.py \
            --pr-sizes pr-sizes.json \
            --baseline baseline.json \
            --build-url "$BUILD_URL" \
            --output comment.md

      - name: Post or update the PR comment
        # The measurement carries the PR number for the dispatch path, where the operator
        # may have supplied only a build id.
        run: |
          python3 scripts/infra/perf/sizes/pr_comment.py \
            --repo "$GITHUB_REPOSITORY" --pr "${{ matrix.pr }}" --pr-from pr-sizes.json \
            --build "${{ matrix.build }}" --packaged-at "${{ matrix.packagedAt }}" \
            --body-file comment.md

      - name: Record a failed measurement
        # The claim step already made the dedupe durable; this only replaces the
        # "measuring…" text so the PR shows why no numbers arrived.
        if: failure()
        run: |
          python3 scripts/infra/perf/sizes/pr_comment.py \
            --repo "$GITHUB_REPOSITORY" --pr "${{ matrix.pr }}" \
            --build "${{ matrix.build }}" --packaged-at "${{ matrix.packagedAt }}" \
            --status failed --build-url "$BUILD_URL" --run-url "$RUN_URL"
