name: Automation - Tooling Tests

# Runs the repository's non-release automation test suites. These all existed and passed
# locally but were wired to no workflow, so a regression in them could reach `main`
# silently:
#
#   * .agents/skills/ci-status/scripts/tests/       — the CI dashboard's workflow registry
#   * .agents/skills/update-skia/scripts/*_test.py  — Skia milestone update tooling
#   * .github/scripts/tests/skia-sync-detect.test.sh — the auto-skia-sync work detector
#
# Release publishing tooling is covered separately by release-tooling-tests.yml. Paths are
# kept tight on purpose: this must not become a catch-all that runs on every change.

on:
  pull_request:
    paths:
      - ".agents/skills/ci-status/**"
      - ".agents/skills/update-skia/**"
      - ".agents/skills/review-skia-update/**"
      - ".agents/skills/issue-bulk-process/**"
      - "documentation/dev/issue-pipeline.md"
      - ".github/scripts/**"
      - "scripts/infra/repository-identity.json"
      - "scripts/infra/repository_identity.py"
      - "scripts/infra/tests/test_repository_identity.py"
      - "source/SkiaSharp.NuGet.targets"
      - "source/SkiaSharp.NuGet.props"
      - "binding/**/PACKAGE-README.md"
      - "documentation/site/**"
      - "scripts/infra/docs/generate-ai-dashboard.py"
      - "scripts/infra/caching/repo-deps.json"
      # Any workflow edit, so the registry test re-checks its tracked list. '*.yml' already
      # covers the generated '*.lock.yml' files.
      - ".github/workflows/*.yml"
  push:
    branches: [main]
    paths:
      - ".agents/skills/ci-status/**"
      - ".agents/skills/update-skia/**"
      - ".agents/skills/review-skia-update/**"
      - ".agents/skills/issue-bulk-process/**"
      - "documentation/dev/issue-pipeline.md"
      - ".github/scripts/**"
      - "scripts/infra/repository-identity.json"
      - "scripts/infra/repository_identity.py"
      - "scripts/infra/tests/test_repository_identity.py"
      - "source/SkiaSharp.NuGet.targets"
      - "source/SkiaSharp.NuGet.props"
      - "binding/**/PACKAGE-README.md"
      - "documentation/site/**"
      - "scripts/infra/docs/generate-ai-dashboard.py"
      - "scripts/infra/caching/repo-deps.json"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-tooling-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ci-status workflow registry tests
        # Guards the CI dashboard against tracking workflows that no longer exist — a stale
        # entry does not error, it renders a GREEN row for a workflow that is not there.
        #
        # Called directly rather than behind an existence check: on the runner's Python
        # (3.12+) `unittest discover` fails loudly in both degenerate cases — exit 1
        # (ImportError) if the directory is gone, exit 5 ("NO TESTS RAN") if it is empty.
        # A guard here would only be able to turn those into a silent pass.
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --quiet --break-system-packages pyyaml
          python3 -m unittest discover -s .agents/skills/ci-status/scripts/tests -p "test_*.py" -v

      - name: Run update-skia tooling tests
        # These import their module under test by name, so they must run from their own
        # directory rather than through a repository-root discovery run.
        working-directory: .agents/skills/update-skia/scripts
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(*_test.py)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "::error::No *_test.py found — the update-skia tests moved or were renamed."
            exit 1
          fi
          for test in "${tests[@]}"; do
            echo "::group::$test"
            python3 -m unittest "${test%.py}"
            echo "::endgroup::"
          done

      - name: Run review-skia tooling tests
        working-directory: .agents/skills/review-skia-update/scripts
        run: python3 -m unittest discover -p "*_test.py" -v

      - name: Run skia-sync work detector tests
        run: bash .github/scripts/tests/skia-sync-detect.test.sh

      - name: Run repository identity tests and drift scan
        run: |
          python3 -m unittest scripts/infra/tests/test_repository_identity.py -v
          python3 scripts/infra/repository_identity.py validate
          python3 scripts/infra/repository_identity.py scan
          python3 -m py_compile \
            .agents/skills/review-skia-update/scripts/persist-skia-review.py

      - name: Validate portable package README generation
        run: |
          dotnet msbuild binding/SkiaSharp/SkiaSharp.csproj \
            -t:_GeneratePackageReadmeFile \
            -p:TargetFramework=net10.0 \
            -p:PackageDescription=Validation \
            -p:SkiaSharpRepositoryUrl=https://github.com/dotnet/SkiaSharp \
            -v:minimal
          readme=binding/SkiaSharp/obj/Debug/net10.0/README.md
          grep -Fq "https://github.com/dotnet/SkiaSharp/issues" "$readme"
          ! grep -Fq '{{RepositoryUrl}}' "$readme"

      - name: Validate portable PowerShell agent scripts
        shell: pwsh
        run: |
          $errors = @(
            foreach ($path in @(
              '.agents/skills/issue-fix/scripts/persist-fix.ps1',
              '.agents/skills/issue-repro/scripts/persist-repro.ps1',
              '.agents/skills/merge-skia-update/scripts/Prepare-SkiaReleaseBranches.ps1',
              '.agents/skills/merge-skia-update/scripts/Update-SkiaSharpSkiaCommit.ps1'
            )) {
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path $path),
                [ref] $null,
                [ref] $parseErrors) > $null
              $parseErrors
            }
          )
          if ($errors.Count) {
            $errors | Format-List
            exit 1
          }

      - name: Validate cache dependency coverage
        run: python3 scripts/infra/caching/repo-deps.py validate
