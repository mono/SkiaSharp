name: Publish validated Skia sync

on:
  workflow_run:
    workflows:
      - Sync - Skia Upstream
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Sync - Skia Upstream run to verify and publish
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: skia-sync-publish
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      has-package: ${{ steps.find-package.outputs.has-package }}
      publishable: ${{ steps.find-package.outputs.publishable }}
      source-run-id: ${{ steps.find-package.outputs.source-run-id }}
    env:
      CC: clang
      CXX: clang++
      DOTNET_CLI_UI_LANGUAGE: en-US
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_NO_REPLACE_OBJECTS: "1"
      SKIASHARP_TEST_SKIP_GPU: ganesh-gl
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
    steps:
      - name: Find validated sync package
        id: find-package
        uses: actions/github-script@v9
        with:
          script: |
            const runId = Number(process.env.SOURCE_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed(`Invalid source run id: ${process.env.SOURCE_RUN_ID}`);
              return;
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const trusted =
              run.path === '.github/workflows/auto-skia-sync.lock.yml' &&
              run.status === 'completed' &&
              run.conclusion === 'success' &&
              run.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              ['schedule', 'workflow_dispatch'].includes(run.event);
            if (!trusted) {
              core.setFailed(`Run ${runId} is not a successful trusted Skia sync workflow run.`);
              return;
            }
            const publishable = run.head_branch === context.payload.repository.default_branch;
            core.setOutput('publishable', String(publishable));
            core.setOutput('source-run-id', String(runId));

            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            });
            const names = new Set(data.artifacts.filter(a => !a.expired).map(a => a.name));
            const found = names.has('skia-sync-expected') && names.has('skia-sync-validated');
            core.setOutput('has-package', String(found));
            if (!found && context.eventName === 'workflow_dispatch') {
              core.setFailed(`Run ${runId} has no complete validated sync package.`);
            }
      - name: Check out trusted verifier
        if: steps.find-package.outputs.has-package == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download pre-agent state
        if: steps.find-package.outputs.has-package == 'true'
        uses: actions/download-artifact@v8
        with:
          name: skia-sync-expected
          path: ${{ runner.temp }}/skia-sync-input/expected
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download validated bundles
        if: steps.find-package.outputs.has-package == 'true'
        uses: actions/download-artifact@v8
        with:
          name: skia-sync-validated
          path: ${{ runner.temp }}/skia-sync-input/validated
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Materialize exact commits
        if: steps.find-package.outputs.has-package == 'true'
        env:
          SKIA_SYNC_ARTIFACT_DIR: ${{ runner.temp }}/skia-sync-evidence
          SKIA_SYNC_EXPECTED_ENV: ${{ runner.temp }}/skia-sync-input/expected/skia-sync-expected.env
          SKIA_SYNC_PACKAGE_DIR: ${{ runner.temp }}/skia-sync-input/validated
          SKIA_SYNC_TRUSTED_DIR: ${{ github.workspace }}/.github/scripts
          SKIA_SYNC_WORKSPACE: ${{ runner.temp }}/skia-sync-source
        run: bash .github/scripts/skia-sync-prepare-verification.sh
      - name: Validate fork-patch decisions before candidate execution
        if: steps.find-package.outputs.has-package == 'true'
        env:
          SKIA_SYNC_EXPECTED_ENV: ${{ runner.temp }}/skia-sync-input/expected/skia-sync-expected.env
        run: |
          source .github/scripts/skia-sync-common.sh
          load_sync_env "$SKIA_SYNC_EXPECTED_ENV"
          python3 .agents/skills/update-skia/scripts/audit_fork_patches.py \
            --skia-root "$RUNNER_TEMP/skia-sync-source/externals/skia" \
            --old-upstream "$BASE_UPSTREAM_SHA" \
            --new-upstream "$TARGET_UPSTREAM_SHA" \
            --fork-base "$SKIA_BASE_SHA" \
            --merged-head "$HEAD_BRANCH" \
            --output "$RUNNER_TEMP/skia-sync-evidence/skia-fork-patch-audit.md" \
            --validate
      - name: Install native and Vulkan dependencies
        if: steps.find-package.outputs.has-package == 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang libc++-dev libc++abi-dev fontconfig libfontconfig1-dev ninja-build fonts-dejavu-core ttf-ancient-fonts mesa-vulkan-drivers vulkan-tools
          LAVAPIPE_ICD=$(dpkg -L mesa-vulkan-drivers | grep -E '/lvp_icd(\.x86_64)?\.json$' | head -n 1)
          test -n "$LAVAPIPE_ICD"
          {
            echo "VK_ICD_FILENAMES=$LAVAPIPE_ICD"
            echo "VK_DRIVER_FILES=$LAVAPIPE_ICD"
          } >> "$GITHUB_ENV"
          fc-cache -f
          dotnet workload install android --skip-sign-check
      - name: Verify Mesa lavapipe
        if: steps.find-package.outputs.has-package == 'true'
        run: |
          set -euo pipefail
          vulkaninfo --summary | tee "$RUNNER_TEMP/vulkaninfo.txt"
          grep -Eiq '(deviceName|driverName).*(llvmpipe|lavapipe)' "$RUNNER_TEMP/vulkaninfo.txt"
      - name: Build exact native source
        if: steps.find-package.outputs.has-package == 'true'
        working-directory: ${{ runner.temp }}/skia-sync-source
        run: |
          dotnet tool restore
          dotnet cake --target=externals-linux --arch=x64
      - name: Run final full solution
        if: steps.find-package.outputs.has-package == 'true'
        working-directory: ${{ runner.temp }}/skia-sync-source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/skia-sync-fresh-tests"
          {
            echo "SKIA_SYNC_TEST_EVIDENCE full stage=final solution=tests/SkiaSharp.Tests.Console.slnx tfm=net10.0 unfiltered=true"
            dotnet test tests/SkiaSharp.Tests.Console.slnx \
              -p:TargetFramework=net10.0 \
              -p:TargetFrameworks=net10.0
          } 2>&1 | tee "$RUNNER_TEMP/skia-sync-fresh-tests/test-output.txt"
      - name: Run named Ganesh Vulkan evidence
        if: steps.find-package.outputs.has-package == 'true'
        working-directory: ${{ runner.temp }}/skia-sync-source
        run: |
          set -euo pipefail
          {
            echo "SKIA_SYNC_TEST_EVIDENCE vulkan backend=ganesh filter=*CreateVkContextIsValid*"
            dotnet test tests/SkiaSharp.Vulkan.Tests.Console/SkiaSharp.Vulkan.Tests.Console.csproj \
              -p:TargetFramework=net10.0 \
              -p:TargetFrameworks=net10.0 \
              -- --filter-method "*CreateVkContextIsValid*"
          } 2>&1 | tee "$RUNNER_TEMP/skia-sync-fresh-tests/vulkan-ganesh-evidence.txt"
      - name: Run named Graphite Vulkan evidence
        if: steps.find-package.outputs.has-package == 'true'
        working-directory: ${{ runner.temp }}/skia-sync-source
        run: |
          set -euo pipefail
          {
            echo "SKIA_SYNC_TEST_EVIDENCE vulkan backend=graphite filter=*GraphiteVkContextIsCreatedFromRawHandles*"
            dotnet test tests/SkiaSharp.Vulkan.Tests.Console/SkiaSharp.Vulkan.Tests.Console.csproj \
              -p:TargetFramework=net10.0 \
              -p:TargetFrameworks=net10.0 \
              -- --filter-method "*GraphiteVkContextIsCreatedFromRawHandles*"
          } 2>&1 | tee "$RUNNER_TEMP/skia-sync-fresh-tests/vulkan-graphite-evidence.txt"
      - name: Upload fresh test evidence
        if: steps.find-package.outputs.has-package == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: skia-sync-fresh-tests
          path: ${{ runner.temp }}/skia-sync-fresh-tests
          if-no-files-found: error
          retention-days: 7

  seal:
    needs: verify
    if: needs.verify.outputs.has-package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_NO_REPLACE_OBJECTS: "1"
      SOURCE_RUN_ID: ${{ needs.verify.outputs.source-run-id }}
    steps:
      - name: Check out trusted sealer
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download original pre-agent state
        uses: actions/download-artifact@v8
        with:
          name: skia-sync-expected
          path: ${{ runner.temp }}/skia-sync-original/expected
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download original validated bundles
        uses: actions/download-artifact@v8
        with:
          name: skia-sync-validated
          path: ${{ runner.temp }}/skia-sync-original/validated
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download fresh test evidence
        uses: actions/download-artifact@v8
        with:
          name: skia-sync-fresh-tests
          path: ${{ runner.temp }}/skia-sync-fresh-tests
      - name: Seal original bundles after successful tests
        env:
          SKIA_SYNC_AUDIT_SCRIPT: ${{ github.workspace }}/.agents/skills/update-skia/scripts/audit_fork_patches.py
          SKIA_SYNC_EXPECTED_ENV: ${{ runner.temp }}/skia-sync-original/expected/skia-sync-expected.env
          SKIA_SYNC_OUTPUT_DIR: ${{ runner.temp }}/skia-sync-publish-ready
          SKIA_SYNC_SOURCE_PACKAGE_DIR: ${{ runner.temp }}/skia-sync-original/validated
          SKIA_SYNC_STAGING_DIR: ${{ runner.temp }}/skia-sync-staging
          SKIA_SYNC_TEST_EVIDENCE_DIR: ${{ runner.temp }}/skia-sync-fresh-tests
          SKIA_SYNC_TEST_VALIDATOR: ${{ github.workspace }}/.agents/skills/update-skia/scripts/validate_test_output.py
          SKIA_SYNC_TRUSTED_DIR: ${{ github.workspace }}/.github/scripts
          SKIA_SYNC_WORKSPACE: ${{ runner.temp }}/skia-sync-seal-source
        run: bash .github/scripts/skia-sync-seal-package.sh
      - name: Upload publication package
        uses: actions/upload-artifact@v7
        with:
          name: skia-sync-publish-ready
          path: ${{ runner.temp }}/skia-sync-publish-ready
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - verify
      - seal
    if: >-
      needs.verify.outputs.has-package == 'true' &&
      needs.verify.outputs.publishable == 'true' &&
      (github.event_name == 'workflow_run' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Download original pre-agent state
        uses: actions/download-artifact@v8
        with:
          name: skia-sync-expected
          path: ${{ runner.temp }}/skia-sync-original/expected
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify.outputs.source-run-id }}
      - name: Download original validated bundles
        uses: actions/download-artifact@v8
        with:
          name: skia-sync-validated
          path: ${{ runner.temp }}/skia-sync-original/validated
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify.outputs.source-run-id }}
      - name: Download verified publication package
        uses: actions/download-artifact@v8
        with:
          name: skia-sync-publish-ready
          path: ${{ runner.temp }}/skia-sync-publish-ready
      - name: Prepare trusted publisher
        run: chmod 0555 .github/scripts/skia-sync-git-askpass.sh
      - name: Push guarded branches and create draft PRs
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_NO_REPLACE_OBJECTS: "1"
          LD_PRELOAD: ""
          PATH: /usr/bin:/bin
          PARENT_TOKEN: ${{ github.token }}
          PYTHONHOME: ""
          PYTHONPATH: ""
          SKIA_TOKEN: ${{ secrets.SKIASHARP_AUTOBUMP_TOKEN }}
          SKIA_SYNC_ARTIFACT_DIR: ${{ runner.temp }}/skia-sync-publish-output
          SKIA_SYNC_ORIGINAL_EXPECTED_ENV: ${{ runner.temp }}/skia-sync-original/expected/skia-sync-expected.env
          SKIA_SYNC_ORIGINAL_PACKAGE_DIR: ${{ runner.temp }}/skia-sync-original/validated
          SKIA_SYNC_PACKAGE_DIR: ${{ runner.temp }}/skia-sync-publish-ready
          SKIA_SYNC_TRUSTED_DIR: ${{ github.workspace }}/.github/scripts
        run: bash .github/scripts/skia-sync-push-prs.sh
