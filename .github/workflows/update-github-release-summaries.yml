name: Update GitHub Release summaries

on:
  push:
    branches: [main]
    paths:
      - "documentation/docfx/releases/_sources/*.prose.json"
      - "documentation/docfx/releases/_sources/*.data.json"
      - "scripts/infra/docs/release_notes/render.py"
      - "scripts/infra/docs/release_notes/update_github_summaries.py"
      - ".github/workflows/update-github-release-summaries.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # GitHub retains at most one pending run in a concurrency group. Every run
  # converges all reviewed summaries from current main, so a replacement run
  # subsumes any event it displaces.
  group: update-github-release-summaries
  cancel-in-progress: false

jobs:
  update:
    name: Apply reviewed summaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Push runs must use their exact after commit so queued runs cannot
          # render an older semantic diff with a newer checkout. Other events
          # deliberately converge from the currently reviewed main branch.
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Update managed GitHub Release bodies
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          args=(
            --event "$EVENT_NAME"
            --repository "$REPOSITORY"
          )
          case "$EVENT_NAME" in
            push)
              ;;
            release)
              args+=(--tag "$RELEASE_TAG")
              ;;
            workflow_dispatch)
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 2
              ;;
          esac
          python3 scripts/infra/docs/release_notes/update_github_summaries.py "${args[@]}"
