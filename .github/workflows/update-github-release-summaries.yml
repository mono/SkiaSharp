name: Update GitHub Release summaries

# A classic, deterministic workflow -- never agentic. It only selects exact
# tags, expands deterministic links, and adds or replaces the managed summary
# region of a GitHub Release body (see
# scripts/infra/docs/release_notes/update_github_summaries.py). It never
# builds/tags/publishes a release and never touches GitHub's own generated
# notes region.
on:
  push:
    branches: [main]
    paths:
      - "documentation/docfx/releases/_sources/*.prose.json"
      - "documentation/docfx/releases/_sources/*.data.json"
      - "scripts/infra/docs/release_notes/**"
      - "scripts/infra/repository-identity.json"
      - "scripts/infra/repository_identity.py"
      - ".github/workflows/update-github-release-summaries.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional exact release tag to converge (e.g. v4.151.0 or v4.151.0-preview.1). Empty converges every eligible reviewed summary on main."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  # Every run converges all reviewed summaries from current main, so a newer
  # pending run safely subsumes the event that it replaces.
  group: update-github-release-summaries
  cancel-in-progress: false

jobs:
  update:
    name: Apply reviewed summaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A "release" or "workflow_dispatch" run always converges from
          # trusted main -- the tag being released is not itself trusted
          # (the publication script already tagged it before this runs), and reviewed
          # prose lives only on main.
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Update managed GitHub Release bodies
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          documentation_base_url=$(
            python3 scripts/infra/repository_identity.py get publicSiteBaseUrl
          )
          args=(
            --event "$EVENT_NAME"
            --repository "$REPOSITORY"
            --documentation-base-url "$documentation_base_url"
          )
          if [ "$EVENT_NAME" = "release" ]; then
            args+=(--tag "$RELEASE_TAG")
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${DISPATCH_TAG:-}" ]; then
            args+=(--tag "$DISPATCH_TAG")
          fi
          python3 scripts/infra/docs/release_notes/update_github_summaries.py "${args[@]}"
