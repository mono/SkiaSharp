name: Sync - Skia Submodule

on:
  schedule:
    - cron: "30 10 * * *"  # Daily at 10:30 AM UTC
  workflow_dispatch:
    inputs:
      target_branch:
        description: "SkiaSharp branch to sync and target with the pull request"
        required: false
        default: main
        type: string
      skia_branch:
        description: "Paired Skia repository branch to sync from"
        required: false
        default: skiasharp
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-skia-submodule-sync-${{ github.event.inputs.target_branch || 'main' }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'main' }}
      SKIA_BRANCH: ${{ github.event.inputs.skia_branch || 'skiasharp' }}

    steps:
      - name: Checkout identity tooling
        uses: actions/checkout@v4
        with:
          path: .identity-source
          sparse-checkout: |
            scripts/infra/repository-identity.json
            scripts/infra/repository_identity.py

      - name: Stage identity tooling
        run: |
          IDENTITY_DIR="$RUNNER_TEMP/repository-identity"
          mkdir -p "$IDENTITY_DIR"
          cp .identity-source/scripts/infra/repository-identity.json "$IDENTITY_DIR/"
          cp .identity-source/scripts/infra/repository_identity.py "$IDENTITY_DIR/"
          echo "IDENTITY_SCRIPT=$IDENTITY_DIR/repository_identity.py" >> "$GITHUB_ENV"

      - name: Checkout SkiaSharp
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          ref: ${{ env.TARGET_BRANCH }}

      - name: Validate branches
        run: |
          IDENTITY=$(python3 "$IDENTITY_SCRIPT" --root "$GITHUB_WORKSPACE" json)
          SKIA_REPOSITORY=$(jq -r '.skiaRepository' <<<"$IDENTITY")
          SKIA_GIT_URL=$(jq -r '.skiaGitUrl' <<<"$IDENTITY")
          {
            echo "SKIA_REPOSITORY=$SKIA_REPOSITORY"
            echo "SKIA_GIT_URL=$SKIA_GIT_URL"
          } >> "$GITHUB_ENV"
          git check-ref-format --branch "$TARGET_BRANCH"
          if ! git show-ref --verify --quiet "refs/remotes/origin/$TARGET_BRANCH"; then
            echo "Target branch does not exist on origin: $TARGET_BRANCH"
            exit 1
          fi

          git check-ref-format --branch "$SKIA_BRANCH"
          if ! git ls-remote --exit-code --heads "$SKIA_GIT_URL" "refs/heads/$SKIA_BRANCH" >/dev/null; then
            echo "$SKIA_REPOSITORY branch does not exist on origin: $SKIA_BRANCH"
            exit 1
          fi

      - name: Update Skia submodule and cgmanifest
        id: update
        run: |
          git submodule update --init --depth 1 -- externals/skia
          git -C externals/skia fetch --no-tags --depth 1 origin \
            "+refs/heads/$SKIA_BRANCH:refs/remotes/origin/$SKIA_BRANCH"
          git -C externals/skia checkout --detach "refs/remotes/origin/$SKIA_BRANCH"

          SKIA_SHA=$(git -C externals/skia rev-parse HEAD)
          EXPECTED_SKIA_SHA=$(git ls-remote --exit-code --heads "$SKIA_GIT_URL" "refs/heads/$SKIA_BRANCH" | awk '{print $1}')
          if [ "$SKIA_SHA" != "$EXPECTED_SKIA_SHA" ]; then
            echo "Checked out $SKIA_SHA, but $SKIA_REPOSITORY branch $SKIA_BRANCH points to $EXPECTED_SKIA_SHA"
            exit 1
          fi

          MANIFEST_MATCHES=$(jq --arg skia_url "$SKIA_GIT_URL" '[.registrations[] | select(
            .component.type == "git"
            and .component.git.repositoryUrl == $skia_url
          )] | length' cgmanifest.json)

          if [ "$MANIFEST_MATCHES" -ne 1 ]; then
            echo "Expected exactly one $SKIA_REPOSITORY git registration in cgmanifest.json, found $MANIFEST_MATCHES"
            exit 1
          fi

          TMP=$(mktemp)
          jq --arg sha "$SKIA_SHA" --arg skia_url "$SKIA_GIT_URL" '
            (.registrations[]
              | select(
                .component.type == "git"
                and .component.git.repositoryUrl == $skia_url
              )
              | .component.git.commitHash) = $sha
          ' cgmanifest.json > "$TMP"
          mv "$TMP" cgmanifest.json

          echo "skia_sha=$SKIA_SHA" >> "$GITHUB_OUTPUT"
          echo "latest_msg=$(git -C externals/skia log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet -- externals/skia; then
            echo "submodule_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Skia submodule has changed"
            echo "submodule_changed=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet -- cgmanifest.json; then
            echo "manifest_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "cgmanifest.json has changed"
            echo "manifest_changed=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet -- externals/skia cgmanifest.json; then
            echo "Skia submodule and cgmanifest.json are up to date"
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update PR
        if: steps.check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_MSG: ${{ steps.update.outputs.latest_msg }}
          SKIA_SHA: ${{ steps.update.outputs.skia_sha }}
        run: |
          BRANCH="automation/update-skia-submodule-$TARGET_BRANCH"
          git check-ref-format --branch "$BRANCH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Always start fresh from the target branch to avoid stale commit accumulation.
          git checkout -B "$BRANCH" "origin/$TARGET_BRANCH"

          git add externals/skia cgmanifest.json
          if git diff --cached --quiet; then
            echo "No changes after staging"
            exit 0
          fi

          git commit -m "Sync Skia submodule and cgmanifest

          Latest: $LATEST_MSG
          Commit: $SKIA_SHA"

          REMOTE_BRANCH_SHA=$(git ls-remote --heads origin "refs/heads/$BRANCH" | awk '{print $1}')
          if [ -n "$REMOTE_BRANCH_SHA" ]; then
            git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_BRANCH_SHA" \
              origin "$BRANCH"
          else
            git push origin "$BRANCH"
          fi

          TITLE="Sync Skia submodule and cgmanifest into $TARGET_BRANCH"
          BODY="Automated update of the \`externals/skia/\` submodule to track \`$SKIA_REPOSITORY\`'s \`$SKIA_BRANCH\` branch.

          This pull request targets the \`$TARGET_BRANCH\` branch in \`${{ github.repository }}\`.

          The \`$SKIA_REPOSITORY\` git registration in \`cgmanifest.json\` is derived from the checked-out submodule SHA. The workflow opens a PR when either the submodule pointer or manifest hash changes, so it also repairs manifest drift.

          Created by [auto-skia-submodule-sync](https://github.com/${{ github.repository }}/actions/workflows/auto-skia-submodule-sync.yml)."

          existing=$(gh pr list --head "$BRANCH" --base "$TARGET_BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$existing" \
              -f title="$TITLE" \
              -f body="$BODY" >/dev/null
            echo "PR #$existing already exists, force-pushed update"
          else
            gh pr create --base "$TARGET_BRANCH" --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY"
          fi
