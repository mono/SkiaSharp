name: Release - Tooling Tests

on:
  pull_request:
    paths:
      - ".agents/skills/release-branch/**"
      - ".agents/skills/release-milestones/**"
      - ".agents/skills/release-notes/**"
      - ".agents/skills/release-publish/**"
      - ".agents/skills/release-testing/**"
      - "tests/SkiaSharp.Tests.Integration/**"
      - ".github/workflows/release-*.yml"
      - ".github/workflows/update-github-release-summaries.yml"
      - "scripts/infra/docs/**"
      - "scripts/infra/publishing/**"
      - "scripts/infra/caching/repo-deps.json"
  push:
    branches: [main]
    paths:
      - ".agents/skills/release-branch/**"
      - ".agents/skills/release-milestones/**"
      - ".agents/skills/release-notes/**"
      - ".agents/skills/release-publish/**"
      - ".agents/skills/release-testing/**"
      - "tests/SkiaSharp.Tests.Integration/**"
      - ".github/workflows/release-*.yml"
      - ".github/workflows/update-github-release-summaries.yml"
      - "scripts/infra/docs/**"
      - "scripts/infra/publishing/**"
      - "scripts/infra/caching/repo-deps.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-tooling-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Named so the check-run is distinguishable in the PR checks list — several workflows
    # use the job id 'test', and GitHub surfaces the job name, not the workflow name.
    name: Release tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate PowerShell release scripts
        shell: pwsh
        run: |
          $errors = @(
            $paths = @(
              Get-ChildItem scripts/infra/publishing -Filter *.ps* -Recurse
              Get-ChildItem .agents/skills/release-testing/scripts -Filter *.ps1 -Recurse
            )
            foreach ($path in $paths) {
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $path.FullName,
                [ref] $null,
                [ref] $parseErrors) > $null
              $parseErrors
            }
          )
          if ($errors.Count) {
            $errors | Format-List
            exit 1
          }
          Get-Help ./scripts/infra/publishing/prepare-release.ps1 -Full > $null
          Get-Help ./scripts/infra/publishing/finish-release.ps1 -Full > $null
          Get-Help ./scripts/infra/publishing/update-bug-template.ps1 -Full > $null
          Get-Help ./scripts/infra/publishing/reconcile-release-assignments.ps1 -Full > $null
          Get-Help ./scripts/infra/publishing/update-release-milestones.ps1 -Full > $null

      - name: Run publishing PowerShell tests
        shell: pwsh
        run: |
          ./scripts/infra/publishing/tests/Test-PublishingScripts.ps1
          ./scripts/infra/publishing/tests/Test-ReleaseMilestones.ps1

      - name: Run release-testing Python tests
        run: python3 -m unittest discover -s .agents/skills/release-testing/scripts/tests -p "test_*.py"

      - name: Run release-notes and GitHub-summary Python tests
        # Covers the release-note renderer and the GitHub Release summary mutation that
        # Finish dispatches (release_notes/tests/test_update_github_summaries.py). These
        # already existed but nothing ran them in CI.
        run: python3 -m unittest discover -s scripts/infra/docs/release_notes/tests -p "test_*.py"

      - name: Run release-testing PowerShell tests
        shell: pwsh
        run: ./.agents/skills/release-testing/scripts/tests/Test-PrepareTestRun.ps1

      - name: Validate cache dependency coverage
        run: python3 scripts/infra/caching/repo-deps.py validate
