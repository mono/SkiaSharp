name: Sync - Issue Template Versions

on:
  schedule:
    - cron: "0 9 * * *"  # Daily at 09:00 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: Update the checked-out issue template without pushing
        required: true
        default: false
        type: boolean
      push:
        description: Refresh the automation branch and pull request
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-update-issue-template-versions
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Validate request
        env:
          APPLY: ${{ inputs.apply || false }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUSH: ${{ github.event_name == 'schedule' || inputs.push }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$APPLY" != "true" || test "$PUSH" != "true"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ inputs.apply || false }}
          PUSH: ${{ github.event_name == 'schedule' || inputs.push }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $arguments = @{ Repository = $env:REPOSITORY }
          if ($env:PUSH -eq 'true') {
            $arguments.Push = $true
          } elseif ($env:APPLY -eq 'true') {
            $arguments.Apply = $true
          }
          ./scripts/infra/publishing/update-bug-template.ps1 @arguments *>&1 |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
