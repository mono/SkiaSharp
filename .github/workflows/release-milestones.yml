name: Release - Milestones

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released numeric version (required for reconciliation)
        required: false
        default: ""
        type: string
      reconcile:
        description: Reconcile shipped pull requests and linked issues
        required: true
        default: true
        type: boolean
      update:
        description: Update dates, roll open work, and close shipped milestones
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  deployments: read
  issues: write
  pull-requests: write

jobs:
  dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      issues: read
      pull-requests: read
    steps:
      - name: Validate request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RECONCILE: ${{ inputs.reconcile }}
          UPDATE: ${{ inputs.update }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$RECONCILE" = "true" || test "$UPDATE" = "true"
          test "$RECONCILE" != "true" || test -n "$VERSION"
      - name: Require protected release environment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENVIRONMENT: release-milestones
        run: |
          reviewers=$(gh api \
            "repos/$GITHUB_REPOSITORY/environments/$RELEASE_ENVIRONMENT" \
            --jq '[.protection_rules[] | select(.type == "required_reviewers")] | length')
          test "$reviewers" -gt 0 || {
            echo "::error::$RELEASE_ENVIRONMENT must require reviewers."
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preview release assignments
        if: inputs.reconcile
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          ./scripts/infra/publishing/reconcile-release-assignments.ps1 `
            -Version $env:VERSION *>&1 |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Preview release milestones
        if: inputs.update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/infra/publishing/update-release-milestones.ps1 *>&1 |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

  push:
    needs: dry-run
    runs-on: ubuntu-latest
    environment: release-milestones
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile release assignments
        if: inputs.reconcile
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          ./scripts/infra/publishing/reconcile-release-assignments.ps1 `
            -Version $env:VERSION `
            -Push *>&1 |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Update release milestones
        if: inputs.update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/infra/publishing/update-release-milestones.ps1 `
            -Push *>&1 |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
