name: Release - Finish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version or prerelease identity/exact NuGet version
        required: true
        type: string
      push:
        description: Create the tag and publish the GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Finish
        shell: pwsh
        env:
          GH_TOKEN: ${{ inputs.push && secrets.SKIASHARP_AUTOBUMP_TOKEN || github.token }}
          PUSH: ${{ inputs.push }}
          VERSION: ${{ inputs.version }}
        run: |
          $arguments = @{ Version = $env:VERSION }
          if ($env:PUSH -eq 'true') {
            $arguments.Push = $true
          }
          ./scripts/infra/publishing/finish-release.ps1 @arguments *>&1 |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
