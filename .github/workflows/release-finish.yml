name: Release - Finish

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact public SkiaSharp version already available on NuGet.org
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read
  pull-requests: read

jobs:
  plan:
    name: Verify public packages and plan release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub only returns draft releases to tokens with push access. This job
    # remains read-only, but needs contents:write to discover resumable drafts.
    permissions:
      actions: read
      contents: write
      deployments: read
      pull-requests: read
    outputs:
      tooling_sha: ${{ steps.outputs.outputs.tooling_sha }}
      plan_id: ${{ steps.outputs.outputs.plan_id }}
      release_identity: ${{ steps.outputs.outputs.release_identity }}
      next_action: ${{ steps.outputs.outputs.next_action }}
    steps:
      - name: Require the default branch workflow
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected="refs/heads/$DEFAULT_BRANCH"
          if [ "$GITHUB_REF" != "$expected" ]; then
            echo "::error::Release workflows must be dispatched from $expected, not $GITHUB_REF."
            exit 1
          fi

      - name: Checkout trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: false

      - name: Set up exact release tooling
        uses: ./.github/actions/setup-release-tool
        with:
          tooling-sha: ${{ github.sha }}

      - name: Build immutable finalization plan
        id: plan_command
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-finish"
          release_tool=(
            dotnet run --no-build --no-restore --configuration Release
            --project utils/SkiaSharp.ReleaseTool/SkiaSharp.ReleaseTool.csproj --
          )
          status=0
          "${release_tool[@]}" finish plan \
            --version "$RELEASE_VERSION" \
            --tooling-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/release-finish/plan.json" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          "${release_tool[@]}" render-plan \
            --plan "$RUNNER_TEMP/release-finish/plan.json" \
            --format markdown \
            --output "$RUNNER_TEMP/release-finish/summary.md"
          cat "$RUNNER_TEMP/release-finish/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Export immutable plan identity
        id: outputs
        if: steps.plan_command.outputs.status == '0'
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/release-finish/plan.json"
          echo "tooling_sha=$(jq -r '.toolingSha' "$plan")" >> "$GITHUB_OUTPUT"
          echo "plan_id=$(jq -r '.planId' "$plan")" >> "$GITHUB_OUTPUT"
          echo "release_identity=$(jq -r '.release.identity' "$plan")" >> "$GITHUB_OUTPUT"
          echo "next_action=$(jq -r '.nextAction' "$plan")" >> "$GITHUB_OUTPUT"

      - name: Upload finalization plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-finish-plan
          path: |
            ${{ runner.temp }}/release-finish/plan.json
            ${{ runner.temp }}/release-finish/summary.md
          if-no-files-found: error
          retention-days: 30

      - name: Stop while NuGet.org finishes indexing
        if: steps.plan_command.outputs.status == '2'
        run: |
          echo "::error::Public package indexing is incomplete. Review the uploaded plan and rerun this workflow later."
          exit 1

  create-draft:
    name: Create immutable tag and draft
    needs: plan
    if: needs.plan.outputs.next_action == 'create-draft'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-tag
    concurrency:
      group: release-${{ needs.plan.outputs.release_identity }}
      cancel-in-progress: false
    steps:
      - name: Checkout approved tooling revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tooling_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: false

      - name: Set up exact release tooling
        uses: ./.github/actions/setup-release-tool
        with:
          tooling-sha: ${{ needs.plan.outputs.tooling_sha }}

      - name: Require approved tooling to remain on main
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TOOLING_SHA: ${{ needs.plan.outputs.tooling_sha }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH" --quiet
          git merge-base --is-ancestor "$TOOLING_SHA" "origin/$DEFAULT_BRANCH" || {
            echo "::error::Approved tooling $TOOLING_SHA is no longer an ancestor of origin/$DEFAULT_BRANCH."
            exit 1
          }

      - name: Require protected release environment
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dotnet run --no-build --no-restore --configuration Release \
            --project utils/SkiaSharp.ReleaseTool/SkiaSharp.ReleaseTool.csproj -- \
            check-environment \
            --name release-tag \
            --default-branch "$DEFAULT_BRANCH" \
            --output "$RUNNER_TEMP/release-tag-environment.json"

      - name: Download approved finalization plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-finish-plan
          path: ${{ runner.temp }}/release-finish

      - name: Create or reconcile tag and draft
        env:
          GH_TOKEN: ${{ secrets.SKIASHARP_AUTOBUMP_TOKEN }}
          RELEASE_GIT_TOKEN: ${{ secrets.SKIASHARP_AUTOBUMP_TOKEN }}
          EXPECTED_PLAN_ID: ${{ needs.plan.outputs.plan_id }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$EXPECTED_PLAN_ID"
          auth_dir="$RUNNER_TEMP/release-git-auth"
          askpass="$auth_dir/askpass.sh"
          mkdir -p "$auth_dir"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$RELEASE_GIT_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          cleanup() {
            rm -f "$askpass"
            rmdir "$auth_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          release_tool=(
            dotnet run --no-build --no-restore --configuration Release
            --project utils/SkiaSharp.ReleaseTool/SkiaSharp.ReleaseTool.csproj --
          )
          "${release_tool[@]}" finish create-draft \
            --plan "$RUNNER_TEMP/release-finish/plan.json" \
            --expected-plan-id "$EXPECTED_PLAN_ID" \
            --output "$RUNNER_TEMP/release-finish/draft-result.json"
          "${release_tool[@]}" render-plan \
            --plan "$RUNNER_TEMP/release-finish/draft-result.json" \
            --format markdown \
            --output "$RUNNER_TEMP/release-finish/draft-result.md"
          cat "$RUNNER_TEMP/release-finish/draft-result.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload draft result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-draft-result
          path: |
            ${{ runner.temp }}/release-finish/plan.json
            ${{ runner.temp }}/release-finish/draft-result.json
            ${{ runner.temp }}/release-finish/draft-result.md
          if-no-files-found: error
          retention-days: 90

  plan-publication:
    name: Plan GitHub Release publication
    needs:
      - plan
      - create-draft
    if: >-
      !cancelled() &&
      needs.plan.result == 'success' &&
      (needs.create-draft.result == 'success' || needs.create-draft.result == 'skipped') &&
      (needs.plan.outputs.next_action == 'create-draft' ||
       needs.plan.outputs.next_action == 'plan-publication')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub only returns draft releases to tokens with push access. This job
    # audits the draft without mutating it.
    permissions:
      actions: read
      contents: write
      deployments: read
      pull-requests: read
    outputs:
      tooling_sha: ${{ needs.plan.outputs.tooling_sha }}
      plan_id: ${{ needs.plan.outputs.plan_id }}
      release_identity: ${{ needs.plan.outputs.release_identity }}
      next_action: ${{ steps.outputs.outputs.next_action }}
      publication_plan_id: ${{ steps.outputs.outputs.publication_plan_id }}
    steps:
      - name: Checkout approved tooling revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tooling_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: false

      - name: Set up exact release tooling
        uses: ./.github/actions/setup-release-tool
        with:
          tooling-sha: ${{ needs.plan.outputs.tooling_sha }}

      - name: Require approved tooling to remain on main
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TOOLING_SHA: ${{ needs.plan.outputs.tooling_sha }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH" --quiet
          git merge-base --is-ancestor "$TOOLING_SHA" "origin/$DEFAULT_BRANCH" || {
            echo "::error::Approved tooling $TOOLING_SHA is no longer an ancestor of origin/$DEFAULT_BRANCH."
            exit 1
          }

      - name: Download original finalization plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-finish-plan
          path: ${{ runner.temp }}/release-finish

      - name: Audit publication
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PLAN_ID: ${{ needs.plan.outputs.plan_id }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_PLAN_ID"
          release_tool=(
            dotnet run --no-build --no-restore --configuration Release
            --project utils/SkiaSharp.ReleaseTool/SkiaSharp.ReleaseTool.csproj --
          )
          "${release_tool[@]}" finish plan-publication \
            --plan "$RUNNER_TEMP/release-finish/plan.json" \
            --expected-plan-id "$EXPECTED_PLAN_ID" \
            --output "$RUNNER_TEMP/release-finish/publication-plan.json"
          "${release_tool[@]}" render-plan \
            --plan "$RUNNER_TEMP/release-finish/publication-plan.json" \
            --format markdown \
            --output "$RUNNER_TEMP/release-finish/publication-plan.md"
          cat "$RUNNER_TEMP/release-finish/publication-plan.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Export publication state
        id: outputs
        run: |
          set -euo pipefail
          next_action=$(jq -r '.nextAction' "$RUNNER_TEMP/release-finish/publication-plan.json")
          publication_plan_id=$(jq -r '.publicationPlanId' "$RUNNER_TEMP/release-finish/publication-plan.json")
          echo "next_action=$next_action" >> "$GITHUB_OUTPUT"
          echo "publication_plan_id=$publication_plan_id" >> "$GITHUB_OUTPUT"
          case "$next_action" in
            publish|closeout) ;;
            *)
              echo "::error::Publication cannot continue: next action is '$next_action'."
              exit 1
              ;;
          esac

      - name: Upload publication plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publication-plan
          path: |
            ${{ runner.temp }}/release-finish/plan.json
            ${{ runner.temp }}/release-finish/publication-plan.json
            ${{ runner.temp }}/release-finish/publication-plan.md
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs:
      - plan
      - plan-publication
    if: needs.plan-publication.outputs.next_action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-publish
    concurrency:
      group: release-${{ needs.plan-publication.outputs.release_identity }}
      cancel-in-progress: false
    steps:
      - name: Checkout approved tooling revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan-publication.outputs.tooling_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: false

      - name: Set up exact release tooling
        uses: ./.github/actions/setup-release-tool
        with:
          tooling-sha: ${{ needs.plan-publication.outputs.tooling_sha }}

      - name: Require approved tooling to remain on main
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TOOLING_SHA: ${{ needs.plan.outputs.tooling_sha }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH" --quiet
          git merge-base --is-ancestor "$TOOLING_SHA" "origin/$DEFAULT_BRANCH" || {
            echo "::error::Approved tooling $TOOLING_SHA is no longer an ancestor of origin/$DEFAULT_BRANCH."
            exit 1
          }

      - name: Download original finalization plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-finish-plan
          path: ${{ runner.temp }}/release-finish/original

      - name: Download approved publication plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-publication-plan
          path: ${{ runner.temp }}/release-finish/publication

      - name: Require protected release environment
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dotnet run --no-build --no-restore --configuration Release \
            --project utils/SkiaSharp.ReleaseTool/SkiaSharp.ReleaseTool.csproj -- \
            check-environment \
            --name release-publish \
            --default-branch "$DEFAULT_BRANCH" \
            --output "$RUNNER_TEMP/release-publish-environment.json"

      - name: Publish or reconcile GitHub Release
        env:
          GH_TOKEN: ${{ secrets.SKIASHARP_AUTOBUMP_TOKEN }}
          EXPECTED_PLAN_ID: ${{ needs.plan.outputs.plan_id }}
          EXPECTED_PUBLICATION_PLAN_ID: ${{ needs.plan-publication.outputs.publication_plan_id }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$EXPECTED_PLAN_ID"
          test -n "$EXPECTED_PUBLICATION_PLAN_ID"
          mkdir -p "$RUNNER_TEMP/release-finish/result"
          release_tool=(
            dotnet run --no-build --no-restore --configuration Release
            --project utils/SkiaSharp.ReleaseTool/SkiaSharp.ReleaseTool.csproj --
          )
          "${release_tool[@]}" finish publish \
            --plan "$RUNNER_TEMP/release-finish/original/plan.json" \
            --expected-plan-id "$EXPECTED_PLAN_ID" \
            --publication "$RUNNER_TEMP/release-finish/publication/publication-plan.json" \
            --expected-publication-plan-id "$EXPECTED_PUBLICATION_PLAN_ID" \
            --output "$RUNNER_TEMP/release-finish/result/publish-result.json"
          "${release_tool[@]}" render-plan \
            --plan "$RUNNER_TEMP/release-finish/result/publish-result.json" \
            --format markdown \
            --output "$RUNNER_TEMP/release-finish/result/publish-result.md"
          cat "$RUNNER_TEMP/release-finish/result/publish-result.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload publication result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publication-result
          path: |
            ${{ runner.temp }}/release-finish/result/publish-result.json
            ${{ runner.temp }}/release-finish/result/publish-result.md
          if-no-files-found: error
          retention-days: 90

  closeout:
    name: Close out release
    needs:
      - plan
      - plan-publication
      - publish
    if: >-
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.publish.result != 'failure' &&
      needs.publish.result != 'cancelled' &&
      (needs.plan.outputs.next_action == 'closeout' ||
       needs.plan-publication.outputs.next_action == 'closeout' ||
       needs.publish.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-${{ needs.plan.outputs.release_identity }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout approved tooling revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tooling_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: false

      - name: Set up exact release tooling
        uses: ./.github/actions/setup-release-tool
        with:
          tooling-sha: ${{ needs.plan.outputs.tooling_sha }}

      - name: Require approved tooling to remain on main
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TOOLING_SHA: ${{ needs.plan.outputs.tooling_sha }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH" --quiet
          git merge-base --is-ancestor "$TOOLING_SHA" "origin/$DEFAULT_BRANCH" || {
            echo "::error::Approved tooling $TOOLING_SHA is no longer an ancestor of origin/$DEFAULT_BRANCH."
            exit 1
          }

      - name: Download original finalization plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-finish-plan
          path: ${{ runner.temp }}/release-finish

      - name: Reconcile milestones and dispatch release notes
        env:
          GH_TOKEN: ${{ secrets.SKIASHARP_AUTOBUMP_TOKEN }}
          EXPECTED_PLAN_ID: ${{ needs.plan.outputs.plan_id }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$EXPECTED_PLAN_ID"
          release_tool=(
            dotnet run --no-build --no-restore --configuration Release
            --project utils/SkiaSharp.ReleaseTool/SkiaSharp.ReleaseTool.csproj --
          )
          "${release_tool[@]}" finish closeout \
            --plan "$RUNNER_TEMP/release-finish/plan.json" \
            --expected-plan-id "$EXPECTED_PLAN_ID" \
            --output "$RUNNER_TEMP/release-finish/closeout-result.json"
          "${release_tool[@]}" render-plan \
            --plan "$RUNNER_TEMP/release-finish/closeout-result.json" \
            --format markdown \
            --output "$RUNNER_TEMP/release-finish/closeout-result.md"
          cat "$RUNNER_TEMP/release-finish/closeout-result.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload closeout result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-closeout-result
          path: |
            ${{ runner.temp }}/release-finish/plan.json
            ${{ runner.temp }}/release-finish/closeout-result.json
            ${{ runner.temp }}/release-finish/closeout-result.md
          if-no-files-found: error
          retention-days: 90
