name: Release - Finish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version or prerelease identity/exact NuGet version
        required: true
        type: string
      push:
        description: Publish the tag, GitHub Release, support PR, and follow-up workflows
        required: true
        default: false
        type: boolean

concurrency:
  group: release-state
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  finish:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.finish.outputs.release_version }}
      release_numeric: ${{ steps.finish.outputs.release_numeric }}
      release_tag: ${{ steps.finish.outputs.release_tag }}
      source_commit: ${{ steps.finish.outputs.source_commit }}
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Finish
        id: finish
        shell: pwsh
        env:
          GH_TOKEN: ${{ inputs.push && secrets.SKIASHARP_AUTOBUMP_TOKEN || github.token }}
          MODE: ${{ inputs.push && 'Push' || 'DryRun' }}
          VERSION: ${{ inputs.version }}
        run: |
          $arguments = @{ Mode = $env:MODE; Version = $env:VERSION }
          ./scripts/infra/publishing/finish-release.ps1 @arguments *>&1 |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

  milestones:
    needs: finish
    uses: ./.github/workflows/release-milestones.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      version: ${{ needs.finish.outputs.release_numeric }}
      tag: ${{ needs.finish.outputs.release_tag }}
      source_commit: ${{ needs.finish.outputs.source_commit }}
      reconcile: true
      update: true
      push: ${{ inputs.push }}
