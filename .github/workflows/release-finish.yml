name: Release - Finish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version or prerelease identity/exact NuGet version
        required: true
        type: string
      push:
        description: Publish the tag, GitHub Release, support PR, and follow-up workflows
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  finish:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Finish
        shell: pwsh
        env:
          GH_TOKEN: ${{ inputs.push && secrets.SKIASHARP_AUTOBUMP_TOKEN || github.token }}
          MODE: ${{ inputs.push && 'Push' || 'DryRun' }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          $arguments = @{
            Mode = $env:MODE
            Repository = $env:REPOSITORY
            Version = $env:VERSION
          }
          ./scripts/infra/publishing/finish-release.ps1 @arguments *>&1 |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
