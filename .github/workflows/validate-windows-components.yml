name: Validate - Windows Components

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/validate-windows-components.yml
      - source/.vsconfig
      - source/SkiaSharpSource.slnx
      - source/SkiaSharp.Build.props
      - scripts/infra/native/windows/install-components.ps1
      - scripts/infra/native/windows/build-tools.vsconfig
      - scripts/infra/native/windows/windows-shared.cake
      - native/windows/**
      - native/winui/**
      - native/winui-angle/**

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64, arm64]
    defaults:
      run:
        shell: pwsh
    env:
      VS_INSTALL: C:\SkiaSharpVisualStudio
      WINDOWS_SDK_VERSION: 10.0.26100.0
      GIT_SYNC_DEPS_SKIP_EMSDK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Export and remove preinstalled Visual Studio
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Visual Studio removal is permitted only on a disposable GitHub-hosted runner.'
          }
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-components'
          New-Item $evidence -ItemType Directory -Force | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $instances = & $vswhere -all -prerelease -products '*' -format json
          if ($LASTEXITCODE -ne 0) { throw "vswhere exited with code $LASTEXITCODE." }
          $instances | Set-Content (Join-Path $evidence 'before.json')
          $instances = @($instances | ConvertFrom-Json)
          foreach ($instance in $instances) {
            $export = Join-Path $evidence "before-$($instance.instanceId).vsconfig"
            $process = Start-Process $installer -ArgumentList @(
              'export', '--installPath', "`"$($instance.installationPath)`"", '--config', "`"$export`"", '--quiet'
            ) -Wait -PassThru
            if ($process.ExitCode -ne 0 -or !(Test-Path $export)) {
              throw "Visual Studio configuration export failed for $($instance.installationPath) (exit code $($process.ExitCode))."
            }
          }
          foreach ($instance in $instances) {
            Write-Host "Uninstalling $($instance.installationPath)"
            $process = Start-Process $installer -ArgumentList @(
              'uninstall', '--installPath', "`"$($instance.installationPath)`"", '--quiet', '--norestart'
            ) -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Visual Studio uninstall exited with code $($process.ExitCode)."
            }
          }
          $remaining = @(& $vswhere -all -prerelease -products '*' -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $remaining.Count -ne 0) {
            throw "Visual Studio removal was incomplete: $remaining"
          }
          'No Visual Studio instances remain.' | Set-Content (Join-Path $evidence 'clean-vs.txt')

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: '10.0.111'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install configured Visual Studio 2022 Build Tools components
        run: ./scripts/infra/native/windows/install-components.ps1 -InstallationPath $env:VS_INSTALL

      - name: Record installed components and toolchain
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-components'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -all -prerelease -products '*' -format json |
            Set-Content (Join-Path $evidence 'after.json')
          if ($LASTEXITCODE -ne 0) { throw "vswhere exited with code $LASTEXITCODE." }
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $export = Join-Path $evidence 'installed.vsconfig'
          $process = Start-Process $installer -ArgumentList @(
            'export', '--installPath', "`"$env:VS_INSTALL`"", '--config', "`"$export`"", '--quiet'
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path $export)) {
            throw "Visual Studio configuration export failed (exit code $($process.ExitCode))."
          }
          Copy-Item source/.vsconfig (Join-Path $evidence 'ide.vsconfig')
          Copy-Item scripts/infra/native/windows/build-tools.vsconfig (Join-Path $evidence 'requested.vsconfig')
          Get-Content "$env:VS_INSTALL\VC\Auxiliary\Build\Microsoft.VCToolsVersion*.txt" |
            Set-Content (Join-Path $evidence 'toolset-versions.txt')
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Lib" |
            Select-Object Name | Out-File (Join-Path $evidence 'sdk-versions.txt')
          $sdkComponents = (Get-Content scripts/infra/native/windows/build-tools.vsconfig -Raw | ConvertFrom-Json).components |
            Where-Object { $_ -match '^Microsoft\.VisualStudio\.Component\.Windows(?:10|11)SDK\.\d+$' }
          $declaredSdks = @($sdkComponents | ForEach-Object { "10.0.$(($_ -split '\.')[-1]).0" })
          foreach ($directory in @('bin', 'Lib', 'Include')) {
            $latestSdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\$directory" -Directory -Filter '10.0.*' |
              Sort-Object { [Version]$_.Name } -Descending | Select-Object -First 1
            if (!$latestSdk -or $declaredSdks -notcontains $latestSdk.Name) {
              throw "ANGLE's automatic SDK selection in $directory is outside the manifest: $($latestSdk.Name). The runner is not isolated enough to validate the declared SDK requirements."
            }
          }

      - name: Prepare native source and standalone tools
        run: |
          git submodule update --init --recursive externals/skia
          if ($LASTEXITCODE -ne 0) { throw "Submodule initialization exited with code $LASTEXITCODE." }
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw "Tool restore exited with code $LASTEXITCODE." }
          ./scripts/infra/native/shared/install-ninja.ps1
          ./scripts/infra/native/windows/install-7zip.ps1
          ./scripts/infra/native/windows/install-llvm.ps1

      - name: Build native SkiaSharp and HarfBuzzSharp
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          dotnet cake native/windows/build.cake --target=Default --configuration=Release --arch="$env:BUILD_ARCH" `
            --vsinstall="$env:VS_INSTALL" --windowsSdkVersion="$env:WINDOWS_SDK_VERSION" 2>&1 |
            Tee-Object (Join-Path $env:RUNNER_TEMP 'windows-components/native-build.log')
          if ($LASTEXITCODE -ne 0) { throw "Native build exited with code $LASTEXITCODE." }

      - name: Build native WinUI and its managed projection
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          $original = Get-Content global.json -Raw
          try {
            $configuration = $original | ConvertFrom-Json -AsHashtable
            $configuration.sdk.version = '10.0.111'
            $configuration.sdk.rollForward = 'disable'
            $configuration | ConvertTo-Json -Depth 20 | Set-Content global.json
            $selected = dotnet --version
            if ($LASTEXITCODE -ne 0 -or $selected.Trim() -ne '10.0.111') {
              throw "Expected WinUI SDK 10.0.111, got '$selected'."
            }
            dotnet cake native/winui/build.cake --configuration=Release --arch="$env:BUILD_ARCH" `
              --vsinstall="$env:VS_INSTALL" --windowsSdkVersion=10.0.22621.0 2>&1 |
              Tee-Object (Join-Path $env:RUNNER_TEMP 'windows-components/winui-build.log')
            if ($LASTEXITCODE -ne 0) { throw "WinUI build exited with code $LASTEXITCODE." }
          } finally {
            Set-Content global.json $original
          }

      - name: Build ANGLE and Windows App SDK headers
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          dotnet cake native/winui-angle/build.cake --configuration=Release --arch="$env:BUILD_ARCH" `
            --vsinstall="$env:VS_INSTALL" --windowsSdkVersion="$env:WINDOWS_SDK_VERSION" 2>&1 |
            Tee-Object (Join-Path $env:RUNNER_TEMP 'windows-components/angle-build.log')
          if ($LASTEXITCODE -ne 0) { throw "ANGLE build exited with code $LASTEXITCODE." }

      - name: Build managed Windows integrations and source benchmarks
        if: matrix.arch == 'x64'
        run: |
          ./scripts/infra/managed/install-dotnet-workloads.ps1 `
            -SdkVersion '10.0.401' -WorkloadSetVersion '10.0.202' -Workloads 'maui-windows'
          $projects = @(
            'source/SkiaSharp.Views/SkiaSharp.Views.WPF/SkiaSharp.Views.WPF.csproj',
            'source/SkiaSharp.Views/SkiaSharp.Views.WindowsForms/SkiaSharp.Views.WindowsForms.csproj',
            'source/SkiaSharp.Views/SkiaSharp.Views.WinUI/SkiaSharp.Views.WinUI.csproj',
            'source/SkiaSharp.Views.Maui/SkiaSharp.Views.Maui.Controls/SkiaSharp.Views.Maui.Controls.csproj'
          )
          foreach ($project in $projects) {
            dotnet build $project -c Release -p:TargetFrameworks=net10.0-windows10.0.19041.0 -p:BuildingInsideVisualStudio=true
            if ($LASTEXITCODE -ne 0) { throw "$project build exited with code $LASTEXITCODE." }
          }
          foreach ($framework in @('net462', 'net48', 'net10.0')) {
            dotnet build binding/SkiaSharp/SkiaSharp.csproj -c Release -p:TargetFrameworks="$framework" -p:BuildingInsideVisualStudio=true
            if ($LASTEXITCODE -ne 0) { throw "$framework binding build exited with code $LASTEXITCODE." }
          }
          dotnet build benchmarks/SkiaSharp.Benchmarks.Tracking.Source -c Release
          if ($LASTEXITCODE -ne 0) { throw "Benchmark build exited with code $LASTEXITCODE." }

      - name: Upload provisioning and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-components-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/windows-components/
            ${{ runner.temp }}/dd_*.log
            ${{ runner.temp }}/dd_*.txt
          retention-days: 14
