name: Release - Prepare

on:
  workflow_dispatch:
    inputs:
      base:
        description: Branch or commit SHA from which to create the release
        required: true
        default: main
        type: string
      release:
        description: Exact identity (X.Y.Z-preview.N, X.Y.Z-rc.N, or X.Y.Z-stable)
        required: true
        type: string

permissions:
  contents: read
  deployments: read
  pull-requests: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.prepare.outputs.base_sha }}
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}"
      - name: Require protected release environment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENVIRONMENT: release-branching
        run: |
          reviewers=$(gh api \
            "repos/$GITHUB_REPOSITORY/environments/$RELEASE_ENVIRONMENT" \
            --jq '[.protection_rules[] | select(.type == "required_reviewers")] | length')
          test "$reviewers" -gt 0 || {
            echo "::error::$RELEASE_ENVIRONMENT must require reviewers."
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preview
        id: prepare
        shell: pwsh
        env:
          BASE: ${{ inputs.base }}
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          ./scripts/infra/publishing/prepare-release.ps1 `
            -Base $env:BASE `
            -Release $env:RELEASE *>&1 |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

  push:
    needs: dry-run
    runs-on: ubuntu-latest
    environment: release-branching
    concurrency:
      group: release-${{ inputs.release }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push
        shell: pwsh
        env:
          BASE_SHA: ${{ needs.dry-run.outputs.base_sha }}
          GH_TOKEN: ${{ secrets.SKIASHARP_AUTOBUMP_TOKEN }}
          RELEASE: ${{ inputs.release }}
        run: |
          ./scripts/infra/publishing/prepare-release.ps1 `
            -Base $env:BASE_SHA `
            -Release $env:RELEASE `
            -Push *>&1 |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
