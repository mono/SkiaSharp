name: Release - Prepare

on:
  workflow_dispatch:
    inputs:
      target:
        description: Integration branch (main or release/X.Y.x)
        required: true
        default: main
        type: string
      release_version:
        description: Exact release version; leave empty to detect the next preview
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  deployments: read
  pull-requests: read

jobs:
  plan:
    name: Plan release branches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tooling_sha: ${{ steps.outputs.outputs.tooling_sha }}
      release_identity: ${{ steps.outputs.outputs.release_identity }}
      next_action: ${{ steps.outputs.outputs.next_action }}
    steps:
      - name: Require the default branch workflow
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected="refs/heads/$DEFAULT_BRANCH"
          if [ "$GITHUB_REF" != "$expected" ]; then
            echo "::error::Release workflows must be dispatched from $expected, not $GITHUB_REF."
            exit 1
          fi

      - name: Checkout trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: false

      - name: Build immutable release plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ inputs.target }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-prepare"
          args=(
            prepare plan
            --integration-target "$RELEASE_TARGET"
            --tooling-sha "$GITHUB_SHA"
            --output "$RUNNER_TEMP/release-prepare/plan.json"
          )
          if [ -n "$RELEASE_VERSION" ]; then
            args+=(--version "$RELEASE_VERSION")
          fi
          python3 scripts/infra/release/release.py "${args[@]}"
          python3 scripts/infra/release/release.py render-plan \
            --plan "$RUNNER_TEMP/release-prepare/plan.json" \
            --format markdown \
            --output "$RUNNER_TEMP/release-prepare/summary.md"
          cat "$RUNNER_TEMP/release-prepare/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Export immutable plan identity
        id: outputs
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/release-prepare/plan.json"
          echo "tooling_sha=$(jq -r '.toolingSha' "$plan")" >> "$GITHUB_OUTPUT"
          echo "release_identity=$(jq -r '.release.identity' "$plan")" >> "$GITHUB_OUTPUT"
          echo "next_action=$(jq -r '.nextAction' "$plan")" >> "$GITHUB_OUTPUT"

      - name: Upload release plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-prepare-plan
          path: |
            ${{ runner.temp }}/release-prepare/plan.json
            ${{ runner.temp }}/release-prepare/summary.md
          if-no-files-found: error
          retention-days: 30

      - name: Fail blocked release plan
        if: steps.outputs.outputs.next_action == 'blocked'
        run: |
          echo "::error::The release plan is blocked. Review the plan summary and rerun after resolving it."
          exit 1

  apply:
    name: Create release branches
    needs: plan
    if: needs.plan.outputs.next_action == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-branching
    concurrency:
      group: release-${{ needs.plan.outputs.release_identity }}
      cancel-in-progress: false
    steps:
      - name: Checkout approved tooling revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tooling_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: false

      - name: Require approved tooling to remain on main
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TOOLING_SHA: ${{ needs.plan.outputs.tooling_sha }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH" --quiet
          git merge-base --is-ancestor "$TOOLING_SHA" "origin/$DEFAULT_BRANCH" || {
            echo "::error::Approved tooling $TOOLING_SHA is no longer an ancestor of origin/$DEFAULT_BRANCH."
            exit 1
          }

      - name: Require protected release environment
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/infra/release/release.py check-environment \
            --name release-branching \
            --default-branch "$DEFAULT_BRANCH" \
            --output "$RUNNER_TEMP/release-branching-environment.json"

      - name: Download approved release plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-prepare-plan
          path: ${{ runner.temp }}/release-prepare

      - name: Configure approved GitHub identity
        env:
          GH_TOKEN: ${{ secrets.SKIASHARP_AUTOBUMP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh auth setup-git
          git config user.name "SkiaSharp Release Automation"
          git config user.email "devnull@localhost"

      - name: Apply approved release plan
        env:
          GH_TOKEN: ${{ secrets.SKIASHARP_AUTOBUMP_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/infra/release/release.py prepare apply \
            --plan "$RUNNER_TEMP/release-prepare/plan.json" \
            --output "$RUNNER_TEMP/release-prepare/result.json"
          python3 scripts/infra/release/release.py render-plan \
            --plan "$RUNNER_TEMP/release-prepare/result.json" \
            --format markdown \
            --output "$RUNNER_TEMP/release-prepare/result.md"
          cat "$RUNNER_TEMP/release-prepare/result.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-prepare-result
          path: |
            ${{ runner.temp }}/release-prepare/plan.json
            ${{ runner.temp }}/release-prepare/result.json
            ${{ runner.temp }}/release-prepare/result.md
          if-no-files-found: error
          retention-days: 90
