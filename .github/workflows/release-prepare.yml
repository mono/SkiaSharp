name: Release - Prepare

on:
  workflow_dispatch:
    inputs:
      base:
        description: Branch or commit SHA from which to create the release
        required: true
        default: main
        type: string
      release:
        description: Exact identity (X.Y.Z-preview.N, X.Y.Z-rc.N, or X.Y.Z-stable)
        required: true
        type: string
      mode:
        description: Execution mode
        required: true
        default: DryRun
        type: choice
        options:
          - DryRun
          - Apply
          - Push

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ inputs.release }}
      cancel-in-progress: false
    steps:
      - name: Validate request
        run: test "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare
        shell: pwsh
        env:
          BASE: ${{ inputs.base }}
          GH_TOKEN: ${{ inputs.mode == 'Push' && secrets.SKIASHARP_AUTOBUMP_TOKEN || github.token }}
          MODE: ${{ inputs.mode }}
          RELEASE: ${{ inputs.release }}
        run: |
          $arguments = @{
            Base = $env:BASE
            Mode = $env:MODE
            Release = $env:RELEASE
          }
          ./scripts/infra/publishing/prepare-release.ps1 @arguments *>&1 |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
