  <rect width="720" height="224" rx="12" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif" fill="#172033">
    <text x="24" y="32" font-size="18" font-weight="600">Expected</text>
    <text x="376" y="32" font-size="18" font-weight="600">Actual</text>
  </g>
  <g transform="translate(24 56)">
    <rect width="320" height="144" fill="#f8fafc"/>
    <rect x="20" y="22" width="160" height="38" fill="#2563eb"/>
    <circle cx="250" cy="88" r="24" fill="#16a34a"/>
    <rect width="320" height="144" fill="none" stroke="#cbd5e1"/>
  </g>
  <g transform="translate(376 56)">
    <rect width="320" height="144" fill="#f8fafc"/>
