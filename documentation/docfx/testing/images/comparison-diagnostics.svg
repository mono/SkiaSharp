<svg xmlns="http://www.w3.org/2000/svg" width="1056" height="224" viewBox="0 0 1056 224" role="img" aria-labelledby="title description">
  <title id="title">Three diagnostic styles</title>
  <desc id="description">Illustrative diagnostics with tolerance 2. The overlay shows the panel amber and added bar red. The binary mask shows only the bar white. Raw RGB differences show a faint panel and bright cyan bar.</desc>
  <rect width="1056" height="224" rx="12" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif" fill="#172033" font-size="18" font-weight="600">
    <text x="24" y="32">Threshold overlay</text>
    <text x="368" y="32">Binary mask</text>
    <text x="712" y="32">Channel difference</text>
  </g>
  <g transform="translate(24 56)">
    <rect width="320" height="144" fill="#3e3e3f"/>
    <rect x="20" y="22" width="160" height="38" fill="#ffc800"/>
    <circle cx="250" cy="88" r="24" fill="#052812"/>
    <rect x="20" y="98" width="80" height="14" fill="#ff0000"/>
    <rect width="320" height="144" fill="none" stroke="#cbd5e1"/>
  </g>
  <g transform="translate(368 56)">
    <rect width="320" height="144" fill="#000000"/>
    <rect x="20" y="98" width="80" height="14" fill="#ffffff"/>
    <rect width="320" height="144" fill="none" stroke="#cbd5e1"/>
  </g>
  <g transform="translate(712 56)">
    <rect width="320" height="144" fill="#000000"/>
    <rect x="20" y="22" width="160" height="38" fill="#020202"/>
    <rect x="20" y="98" width="80" height="14" fill="#1cd4d6"/>
    <rect width="320" height="144" fill="none" stroke="#cbd5e1"/>
  </g>
</svg>
