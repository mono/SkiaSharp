<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368" role="img" aria-labelledby="title description">
  <title id="title">Exact comparison difference image</title>
  <desc id="description">Illustrative threshold overlay with zero tolerance. Both the two-level blue panel change and added bar are red. Matching pixels are dimmed.</desc>
  <rect width="720" height="368" rx="12" fill="#ffffff"/>
  <text x="40" y="32" font-family="system-ui, sans-serif" fill="#172033" font-size="18" font-weight="600">Exact comparison: both changes mismatch</text>
  <g transform="translate(40 56) scale(2)">
    <rect width="320" height="144" fill="#3e3e3f"/>
    <rect x="20" y="22" width="160" height="38" fill="#ff0000"/>
    <circle cx="250" cy="88" r="24" fill="#052812"/>
    <rect x="20" y="98" width="80" height="14" fill="#ff0000"/>
    <rect width="320" height="144" fill="none" stroke="#cbd5e1"/>
  </g>
</svg>
