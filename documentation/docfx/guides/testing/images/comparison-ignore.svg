<svg xmlns="http://www.w3.org/2000/svg" width="720" height="224" viewBox="0 0 720 224" role="img" aria-labelledby="title description">
  <title id="title">Explicitly ignored coverage</title>
  <desc id="description">An illustrative black ignore mask with a white bar-shaped region. The corresponding overlay marks that excluded bar gray while retaining the tolerated amber panel.</desc>
  <rect width="720" height="224" rx="12" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif" fill="#172033" font-size="18" font-weight="600">
    <text x="24" y="32">Ignore mask</text>
    <text x="376" y="32">Overlay with ignored coverage</text>
  </g>
  <g transform="translate(24 56)">
    <rect width="320" height="144" fill="#000000"/>
    <rect x="20" y="98" width="80" height="14" fill="#ffffff"/>
    <rect width="320" height="144" fill="none" stroke="#cbd5e1"/>
  </g>
  <g transform="translate(376 56)">
    <rect width="320" height="144" fill="#3e3e3f"/>
    <rect x="20" y="22" width="160" height="38" fill="#ffc800"/>
    <circle cx="250" cy="88" r="24" fill="#052812"/>
    <rect x="20" y="98" width="80" height="14" fill="#808080"/>
    <rect width="320" height="144" fill="none" stroke="#cbd5e1"/>
  </g>
</svg>
