<svg xmlns="http://www.w3.org/2000/svg" width="1056" height="244" viewBox="0 0 1056 244" role="img" aria-labelledby="title description">
  <title id="title">An alpha-only difference</title>
  <desc id="description">Illustrative blue rectangles with identical RGB and alpha 255 versus 128. A checkerboard reveals transparency. Exact RGBA comparison marks the rectangle red; the raw RGB channel-difference image stays black.</desc>
  <defs>
    <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#ffffff"/>
      <path d="M0 0h8v8H0z M8 8h8v8H8z" fill="#d1d5db"/>
    </pattern>
  </defs>
  <rect width="1056" height="244" rx="12" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif" fill="#172033" font-size="18" font-weight="600">
    <text x="24" y="32">Expected</text>
    <text x="284" y="32">Actual</text>
    <text x="544" y="32">RGBA overlay</text>
    <text x="804" y="32">RGB difference</text>
  </g>
  <g transform="translate(24 56)">
    <rect width="228" height="144" fill="url(#checker)"/>
    <rect x="30" y="30" width="120" height="60" fill="#0000ff"/>
    <rect width="228" height="144" fill="none" stroke="#cbd5e1"/>
  </g>
  <g transform="translate(284 56)">
    <rect width="228" height="144" fill="url(#checker)"/>
    <rect x="30" y="30" width="120" height="60" fill="#0000ff" fill-opacity="0.5019607843"/>
    <rect width="228" height="144" fill="none" stroke="#cbd5e1"/>
  </g>
  <g transform="translate(544 56)">
    <rect width="228" height="144" fill="#000000"/>
    <rect x="30" y="30" width="120" height="60" fill="#ff0000"/>
    <rect width="228" height="144" fill="none" stroke="#cbd5e1"/>
  </g>
  <g transform="translate(804 56)">
    <rect width="228" height="144" fill="#000000"/>
    <rect width="228" height="144" fill="none" stroke="#cbd5e1"/>
  </g>
  <g font-family="system-ui, sans-serif" fill="#172033" font-size="14">
    <text x="24" y="226">Alpha 255</text>
    <text x="284" y="226">Alpha 128</text>
    <text x="544" y="226">Alpha mismatch detected</text>
    <text x="804" y="226">RGB unchanged</text>
  </g>
</svg>
