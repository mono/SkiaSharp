<svg xmlns="http://www.w3.org/2000/svg" width="720" height="244" viewBox="0 0 720 244" role="img" aria-labelledby="title description">
  <title id="title">A regional tolerance mask</title>
  <desc id="description">An illustrative black tolerance mask with a dark gray panel whose RGB bytes are 32. With exact RGB global allowances, the overlay marks the panel's two-level differences amber and the added bar red. The panel remains included in raw measurements.</desc>
  <rect width="720" height="244" rx="12" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif" fill="#172033" font-size="18" font-weight="600">
    <text x="24" y="32">Tolerance mask</text>
    <text x="376" y="32">Overlay: panel tolerated</text>
  </g>
  <g transform="translate(24 56)">
    <rect width="320" height="144" fill="#000000"/>
    <rect x="20" y="22" width="160" height="38" fill="#202020"/>
    <rect width="320" height="144" fill="none" stroke="#cbd5e1"/>
  </g>
  <g transform="translate(376 56)">
    <rect width="320" height="144" fill="#3e3e3f"/>
    <rect x="20" y="22" width="160" height="38" fill="#ffc800"/>
    <circle cx="250" cy="88" r="24" fill="#052812"/>
    <rect x="20" y="98" width="80" height="14" fill="#ff0000"/>
    <rect width="320" height="144" fill="none" stroke="#cbd5e1"/>
  </g>
  <g font-family="system-ui, sans-serif" fill="#172033" font-size="14">
    <text x="24" y="226">Panel RGB (32, 32, 32); black = zero</text>
    <text x="376" y="226">Amber = different, but within allowance</text>
  </g>
</svg>
