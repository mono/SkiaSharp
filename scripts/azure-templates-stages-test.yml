parameters:
  - name: isSplitPipeline
    type: boolean
    default: false
  - name: buildAgentHost
    type: object
  - name: buildAgentWindows
    type: object
  - name: buildAgentMac
    type: object
  - name: buildAgentLinux
    type: object
  - name: buildAgentAndroidTests
    type: object
  - name: use1ESPipelineTemplates
    type: boolean
  - name: enableCaching
    type: boolean
    default: false

stages:

    - stage: managed
      displayName: Build Managed
      ${{ if eq(parameters.isSplitPipeline, 'true') }}:
        dependsOn: prepare
      ${{ else }}:
        dependsOn: native
      jobs:
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Validate Interop
          parameters:
            name: managed_interop_windows
            displayName: Validate Interop
            buildAgent: ${{ parameters.buildAgentWindows}}
            target: externals-interop
            additionalArgs: --skipExternals="all"
            installAndroidSdk: false
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Build Managed (Windows)
          parameters:
            name: managed_windows
            displayName: Managed (Windows)
            buildAgent: ${{ parameters.buildAgentWindows}}
            target: libs
            cacheJob: managed/libs
            enableCaching: ${{ parameters.enableCaching }}
            additionalArgs: --skipExternals="all"
            requiredArtifacts:
              - name: native
            postBuildSteps:
              - pwsh: Remove-Item ./output/native/ -Recurse -Force -ErrorAction Continue
                displayName: Delete the native folder
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Build Managed (macOS)
          parameters:
            name: managed_macos
            displayName: Managed (macOS)
            buildAgent: ${{ parameters.buildAgentMac }}
            target: libs
            cacheJob: managed/libs
            enableCaching: ${{ parameters.enableCaching }}
            additionalArgs: --skipExternals="all"
            requiredArtifacts:
              - name: native
            postBuildSteps:
              - pwsh: Remove-Item ./output/native/ -Recurse -Force -ErrorAction Continue
                displayName: Delete the native folder
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Build Managed (Linux)
          parameters:
            name: managed_linux
            displayName: Managed (Linux)
            buildAgent: ${{ parameters.buildAgentLinux }}
            packages: $(MANAGED_LINUX_PACKAGES)
            target: libs
            cacheJob: managed/libs
            enableCaching: ${{ parameters.enableCaching }}
            additionalArgs: --skipExternals="all"
            requiredArtifacts:
              - name: native
            postBuildSteps:
              - pwsh: Remove-Item ./output/native/ -Recurse -Force -ErrorAction Continue
                displayName: Delete the native folder

    - stage: tests
      displayName: Tests
      ${{ if eq(parameters.isSplitPipeline, 'true') }}:
        dependsOn: prepare
      ${{ else }}:
        dependsOn: native
      jobs:
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Tests|Windows (.NET Framework)
          parameters:
            name: tests_netfx_windows_x64
            displayName: Windows (.NET Framework, x64)
            buildAgent: ${{ parameters.buildAgentWindows}}
            target: tests-netfx
            additionalArgs: --arch=x64 --skipExternals="all" --coverage=$(ENABLE_CODE_COVERAGE)
            installAndroidSdk: false
            shouldPublish: false
            requiredArtifacts:
              - name: native
            preBuildSteps:
              # Provision a software GL driver (Mesa) and a software Vulkan ICD
              # (SwiftShader) so ganesh-gl and ganesh-vulkan render here.
              - pwsh: .\scripts\infra\native\windows\install-mesa-gl.ps1
                displayName: Provision software OpenGL (Mesa) for the GL tests
              - pwsh: .\scripts\infra\native\windows\install-vulkan-icd.ps1
                displayName: Provision software Vulkan (SwiftShader) for visual tests
            postBuildSteps:
              - pwsh: python3 scripts/infra/tests/extract-visual-goldens.py output/logs/testlogs --images-out output/logs/testlogs/visual-images
                displayName: Extract visual-regression images for triage
                condition: always()
              - task: PublishTestResults@2
                displayName: Publish the .NET Framework x64 test results
                condition: always()
                inputs:
                  testResultsFormat: VSTest
                  testResultsFiles: 'output/logs/testlogs/**/*.trx'
                  testRunTitle: 'Windows .NET Framework x64 Tests'
            publishArtifacts:
              - name: testlogs_netfx_windows_x64
                always: true
                path: 'output/logs/testlogs'
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Tests|Windows (.NET Framework, x86)
          parameters:
            name: tests_netfx_windows_x86
            displayName: Windows (.NET Framework, x86)
            buildAgent: ${{ parameters.buildAgentWindows}}
            target: tests-netfx
            additionalArgs: --arch=x86 --skipExternals="all" --coverage=$(ENABLE_CODE_COVERAGE)
            installAndroidSdk: false
            shouldPublish: false
            requiredArtifacts:
              - name: native
            # SwiftShader's LLVM JIT cannot resolve __chkstk in a 32-bit process, so
            # the software Vulkan ICD crashes the host outright ("exit code is '7'")
            # instead of failing a test. x64 runs the identical suite green, which is
            # why the two architectures are separate jobs. OpenGL and Direct3D stay
            # required on both — Mesa provisions fine in either bitness.
            env:
              SKIASHARP_TEST_SKIP_GPU: ganesh-vulkan,graphite-vulkan,ganesh-vulkan-sharpvk
            preBuildSteps:
              - pwsh: .\scripts\infra\native\windows\install-mesa-gl.ps1
                displayName: Provision software OpenGL (Mesa) for the GL tests
              - pwsh: .\scripts\infra\native\windows\install-vulkan-icd.ps1
                displayName: Provision software Vulkan (SwiftShader) for visual tests
            postBuildSteps:
              - pwsh: python3 scripts/infra/tests/extract-visual-goldens.py output/logs/testlogs --images-out output/logs/testlogs/visual-images
                displayName: Extract visual-regression images for triage
                condition: always()
              - task: PublishTestResults@2
                displayName: Publish the .NET Framework x86 test results
                condition: always()
                inputs:
                  testResultsFormat: VSTest
                  testResultsFiles: 'output/logs/testlogs/**/*.trx'
                  testRunTitle: 'Windows .NET Framework x86 Tests'
            publishArtifacts:
              - name: testlogs_netfx_windows_x86
                always: true
                path: 'output/logs/testlogs'
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Tests|Windows (.NET Core)
          parameters:
            name: tests_netcore_windows
            displayName: Windows (.NET Core)
            buildAgent: ${{ parameters.buildAgentWindows}}
            target: tests-netcore
            additionalArgs: --skipExternals="all" --coverage=$(ENABLE_CODE_COVERAGE)
            installAndroidSdk: false
            shouldPublish: false
            requiredArtifacts:
              - name: native
            preBuildSteps:
              # Provision a software GL driver (Mesa) and a software Vulkan ICD
              # (SwiftShader) so ganesh-gl and ganesh-vulkan render here.
              - pwsh: .\scripts\infra\native\windows\install-mesa-gl.ps1
                displayName: Provision software OpenGL (Mesa) for the GL tests
              - pwsh: .\scripts\infra\native\windows\install-vulkan-icd.ps1
                displayName: Provision software Vulkan (SwiftShader) for visual tests
            postBuildSteps:
              - pwsh: python3 scripts/infra/tests/extract-visual-goldens.py output/logs/testlogs --images-out output/logs/testlogs/visual-images
                displayName: Extract visual-regression images for triage
                condition: always()
              - task: PublishTestResults@2
                displayName: Publish the .NET Core test results
                condition: always()
                inputs:
                  testResultsFormat: VSTest
                  testResultsFiles: 'output/logs/testlogs/**/*.trx'
                  testRunTitle: 'Windows .NET Core Tests'
            publishArtifacts:
              - name: testlogs_netcore_windows
                always: true
                path: 'output/logs/testlogs'
              - name: coverage_netcore_windows
                path: 'output/coverage'
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Tests|macOS
          parameters:
            name: tests_netcore_macos
            displayName: macOS
            buildAgent: ${{ parameters.buildAgentMac }}
            target: tests-netcore
            additionalArgs: --skipExternals="all" --coverage=$(ENABLE_CODE_COVERAGE)
            # This pool is x64 and virtualizes Metal. Merely calling
            # MTLCreateSystemDefaultDevice + newCommandQueue on that driver leaves
            # state that never signals, so the test host hangs on shutdown until the
            # job times out at 180 min — no results, no TRX. See #4598.
            env:
              SKIASHARP_TEST_SKIP_GPU: ganesh-metal,graphite-metal
            installAndroidSdk: false
            shouldPublish: false
            requiredArtifacts:
              - name: native
            postBuildSteps:
              - pwsh: python3 scripts/infra/tests/extract-visual-goldens.py output/logs/testlogs --images-out output/logs/testlogs/visual-images
                displayName: Extract visual-regression images for triage
                condition: always()
              - task: PublishTestResults@2
                displayName: Publish the .NET Core test results
                condition: always()
                inputs:
                  testResultsFormat: VSTest
                  testResultsFiles: 'output/logs/testlogs/**/*.trx'
                  testRunTitle: 'macOS .NET Core Tests'
            publishArtifacts:
              - name: testlogs_netcore_macos
                always: true
                path: 'output/logs/testlogs'
              - name: coverage_netcore_macos
                path: 'output/coverage'
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Tests|Linux
          parameters:
            name: tests_netcore_linux
            displayName: Linux
            buildAgent: ${{ parameters.buildAgentLinux }}
            # Software Vulkan (Mesa lavapipe) plus a virtual X server give the
            # headless agent deterministic GPU output. ganesh-gl, ganesh-vulkan and
            # graphite-vulkan are required here, so missing provisioning fails.
            packages: $(MANAGED_LINUX_PACKAGES) xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers vulkan-tools
            target: tests-netcore
            additionalArgs: --skipExternals="all" --coverage=$(ENABLE_CODE_COVERAGE)
            installAndroidSdk: false
            shouldPublish: false
            requiredArtifacts:
              - name: native
            preBuildSteps:
              - bash: |
                  set -e
                  nohup Xvfb :99 -screen 0 1280x1024x24 > /tmp/xvfb.log 2>&1 &
                  sleep 3
                  echo "Started Xvfb on :99"
                  # Expose the software-GPU environment to the test step. Forcing
                  # Mesa (GL) and the lavapipe ICD (Vulkan) keeps output deterministic.
                  #
                  # softpipe rather than llvmpipe for GL: llvmpipe's LLVM shader JIT
                  # segfaults compiling the fragment shader Skia generates for a
                  # runtime blender and takes the whole test host with it, which is
                  # what made this leg lose all its results (#4590). softpipe is the
                  # non-JIT gallium rasterizer and runs the same tests green. It
                  # caps at GL 3.3, which is well past the 3.0 Ganesh needs. See
                  # #4604 to move back to llvmpipe.
                  echo "##vso[task.setvariable variable=DISPLAY]:99"
                  echo "##vso[task.setvariable variable=LIBGL_ALWAYS_SOFTWARE]1"
                  echo "##vso[task.setvariable variable=GALLIUM_DRIVER]softpipe"
                  echo "##vso[task.setvariable variable=VK_ICD_FILENAMES]/usr/share/vulkan/icd.d/lvp_icd.x86_64.json"
                  echo "##vso[task.setvariable variable=VK_DRIVER_FILES]/usr/share/vulkan/icd.d/lvp_icd.x86_64.json"
                displayName: Start Xvfb and select software GPU (visual tests)
            postBuildSteps:
              - pwsh: python3 scripts/infra/tests/extract-visual-goldens.py output/logs/testlogs --images-out output/logs/testlogs/visual-images
                displayName: Extract visual-regression images for triage
                condition: always()
              - task: PublishTestResults@2
                displayName: Publish the .NET Core test results
                condition: always()
                inputs:
                  testResultsFormat: VSTest
                  testResultsFiles: 'output/logs/testlogs/**/*.trx'
                  testRunTitle: 'Linux .NET Core Tests'
            publishArtifacts:
              - name: testlogs_netcore_linux
                always: true
                path: 'output/logs/testlogs'
              - name: coverage_netcore_linux
                path: 'output/coverage'
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Tests|Android
          parameters:
            name: tests_android_linux
            displayName: Android
            buildAgent: ${{ parameters.buildAgentAndroidTests }}
            target: tests-android
            additionalArgs: --device=android-emulator-64 --deviceVersion=$(ANDROID_TEST_DEVICE_VERSION) --skipExternals="all" --coverage=$(ENABLE_CODE_COVERAGE)
            shouldPublish: false
            installXcode: false
            dotnetWorkloads: android,maui-android
            requiredArtifacts:
              - name: native
            preBuildSteps:
              - script: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
                displayName: Enable KVM for Android emulator
              - script: |
                  mkdir -p "$HOME/.android/avd"
                  echo "##vso[task.setvariable variable=ANDROID_AVD_HOME]$HOME/.android/avd"
                  echo "##vso[task.setvariable variable=ANDROID_EMULATOR_HOME]$HOME/.android"
                displayName: Set Android AVD home (fix XDG path mismatch)
              - pwsh: .\scripts\infra\managed\install-android-package.ps1 -Package "emulator"
                displayName: Install the Android emulator
              - pwsh: .\scripts\infra\managed\install-android-package.ps1 -Package "system-images;android-$(ANDROID_TEST_DEVICE_VERSION);google_apis;x86_64"
                displayName: Install the Android API $(ANDROID_TEST_DEVICE_VERSION) emulator image
            postBuildSteps:
              - pwsh: python3 scripts/infra/tests/extract-visual-goldens.py output/logs/testlogs --images-out output/logs/testlogs/visual-images
                displayName: Extract visual-regression images for triage
                condition: always()
              - task: PublishTestResults@2
                displayName: Publish the Android test results
                condition: always()
                inputs:
                  testResultsFormat: VSTest
                  testResultsFiles: 'output/logs/testlogs/**/*.trx'
                  testRunTitle: 'Android Tests (API $(ANDROID_TEST_DEVICE_VERSION))'
            publishArtifacts:
              - name: testlogs_android_$(ANDROID_TEST_DEVICE_VERSION)
                always: true
                path: 'output/logs/testlogs'
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Tests|iOS
          parameters:
            name: tests_ios_macos
            displayName: iOS
            buildAgent: ${{ parameters.buildAgentMac }}
            target: tests-ios
            additionalArgs: --device=ios-simulator-64 --deviceVersion=$(IOS_TEST_DEVICE_VERSION) --skipExternals="all" --coverage=$(ENABLE_CODE_COVERAGE)
            shouldPublish: false
            requiredArtifacts:
              - name: native
            # The iOS *simulator* on the x64 macOS pool exposes a virtualized Metal
            # device: creating a command queue on it leaves dispatch-queue state that
            # never signals, hanging the test host's shutdown for hours. Declared here
            # rather than sniffed at runtime — this describes the pool we run on today,
            # so if the pool moves to Apple Silicon this line is what has to change.
            # Same shutdown hang as #4598; the simulator additionally cannot compile
            # Graphite's gradient pipeline (#4555). #4591 tracks the wider picture.
            env:
              SKIASHARP_TEST_SKIP_GPU: ganesh-metal,graphite-metal
            postBuildSteps:
              - pwsh: python3 scripts/infra/tests/extract-visual-goldens.py output/logs/testlogs --images-out output/logs/testlogs/visual-images
                displayName: Extract visual-regression images for triage
                condition: always()
              - task: PublishTestResults@2
                displayName: Publish the iOS test results
                condition: always()
                inputs:
                  testResultsFormat: VSTest
                  testResultsFiles: 'output/logs/testlogs/**/*.trx'
                  testRunTitle: 'iOS Tests (v$(IOS_TEST_DEVICE_VERSION))'
            publishArtifacts:
              - name: testlogs_ios_$(IOS_TEST_DEVICE_VERSION)
                always: true
                path: 'output/logs/testlogs'
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Tests|Mac Catalyst
          parameters:
            name: tests_maccatalyst_macos
            displayName: Mac Catalyst
            buildAgent: ${{ parameters.buildAgentMac }}
            target: tests-maccatalyst
            additionalArgs: --device=maccatalyst --skipExternals="all" --coverage=$(ENABLE_CODE_COVERAGE)
            # A Mac Catalyst app sees iOS-style Metal GPU families, never Mac2, so
            # the device reports none of the families Ganesh or Graphite require and
            # bring-up fails outright (#4599). macOS on this same pool is opted out
            # too, for a different reason — its virtualized Metal hangs the host on
            # shutdown (#4598). #4591 tracks the wider picture.
            env:
              SKIASHARP_TEST_SKIP_GPU: ganesh-metal,graphite-metal
            installAndroidSdk: false
            shouldPublish: false
            requiredArtifacts:
              - name: native
            postBuildSteps:
              - pwsh: python3 scripts/infra/tests/extract-visual-goldens.py output/logs/testlogs --images-out output/logs/testlogs/visual-images
                displayName: Extract visual-regression images for triage
                condition: always()
              - task: PublishTestResults@2
                displayName: Publish the Mac Catalyst test results
                condition: always()
                inputs:
                  testResultsFormat: VSTest
                  testResultsFiles: 'output/logs/testlogs/**/*.trx'
                  testRunTitle: 'Mac Catalyst Tests'
            publishArtifacts:
              - name: testlogs_maccatalyst
                always: true
                path: 'output/logs/testlogs'
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Tests|WASM
          parameters:
            name: tests_wasm_linux
            displayName: WASM
            buildAgent: ${{ parameters.buildAgentLinux }}
            packages: $(MANAGED_LINUX_PACKAGES) ninja-build
            target: tests-wasm
            additionalArgs: --skipExternals="all" --coverage=false
            # navigator.gpu.requestAdapter() returns null in the headless browser the
            # DeviceRunners CLI launches, so Dawn has no adapter to bind to. Its
            # `wasm test` command takes no browser arguments, so the WebGPU flags
            # cannot be passed through without an upstream change to that package. See #4591.
            env:
              SKIASHARP_TEST_SKIP_GPU: graphite-dawn
            installAndroidSdk: false
            shouldPublish: false
            requiredArtifacts:
              - name: native
            installEmsdk: true
            initScript: source ~/emsdk/emsdk_env.sh
            preBuildSteps:
              - bash: bash ./scripts/infra/managed/install-chrome.sh
                displayName: Install Chrome for WASM tests
            postBuildSteps:
              - pwsh: python3 scripts/infra/tests/extract-visual-goldens.py output/logs/testlogs --images-out output/logs/testlogs/visual-images
                displayName: Extract visual-regression images for triage
                condition: always()
              - task: PublishTestResults@2
                displayName: Publish the WASM test results
                condition: always()
                inputs:
                  testResultsFormat: VSTest
                  testResultsFiles: 'output/logs/testlogs/**/*.trx'
                  testRunTitle: 'Linux WASM Tests'
            publishArtifacts:
              - name: testlogs_wasm
                always: true
                path: 'output/logs/testlogs'
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Tests [WASM Preview] (Linux)
          parameters:
            # Runs the SkiaSharp.Tests.Wasm suite as the preview .NET (tests only — the rest of CI
            # stays on net10) so WASM regressions on the newer runtime, such as an exception-handling
            # mismatch in the native lib, fail CI. installPreviewSdk provisions the preview SDK +
            # wasm-tools workload (which bundles the matching emscripten) and pins global.json to it.
            name: tests_wasm_preview_linux
            displayName: WASM (.NET Preview)
            buildAgent: ${{ parameters.buildAgentLinux }}
            packages: $(MANAGED_LINUX_PACKAGES) ninja-build
            target: tests-wasm
            additionalArgs: --skipExternals="all" --coverage=false --previewtfm=true
            # See the WASM leg above: the headless browser exposes no WebGPU adapter (#4591).
            env:
              SKIASHARP_TEST_SKIP_GPU: graphite-dawn
            installAndroidSdk: false
            shouldPublish: false
            installPreviewSdk: true
            previewWorkloads: wasm-tools,android
            requiredArtifacts:
              - name: native
            preBuildSteps:
              - bash: bash ./scripts/infra/managed/install-chrome.sh
                displayName: Install Chrome for WASM tests
            postBuildSteps:
              - task: PublishTestResults@2
                displayName: Publish the WASM preview test results
                condition: always()
                inputs:
                  testResultsFormat: VSTest
                  testResultsFiles: 'output/logs/testlogs/**/*.trx'
                  testRunTitle: 'Linux WASM Preview Tests'
            publishArtifacts:
              - name: testlogs_wasm_preview
                always: true
                path: 'output/logs/testlogs'

        # Containerized test legs — see documentation/dev/containerized-testing.md
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Tests|Linux (Azure Linux)
          parameters:
            name: tests_container_linux
            # No GPU stack in these images, by design: they exist to prove SkiaSharp
            # works without those dependencies, so OpenGL genuinely cannot come up.
            # Declared here rather than inferred from the DllNotFoundException the
            # test would otherwise throw; the desktop Linux and Windows legs carry
            # the ganesh-gl coverage. Tracked by #4591.
            env:
              SKIASHARP_TEST_SKIP_GPU: ganesh-gl
            displayName: Linux (Azure Linux)
            buildAgent: ${{ parameters.buildAgentLinux }}
            use1ESPipelineTemplates: ${{ parameters.use1ESPipelineTemplates }}
            docker: scripts/infra/tests/docker/azurelinux
            target: tests-container
            additionalArgs: --nativePlatform=linux
            installAndroidSdk: false
            installXcode: false
            shouldPublish: false
            requiredArtifacts:
              - name: native
            postBuildSteps:
              - task: PublishTestResults@2
                displayName: Publish the Azure Linux container test results
                condition: always()
                inputs:
                  testResultsFormat: VSTest
                  testResultsFiles: 'output/logs/testlogs/**/*.trx'
                  testRunTitle: 'Linux (Azure Linux) Tests'
            publishArtifacts:
              - name: testlogs_container_linux
                always: true
                path: 'output/logs/testlogs'
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Tests|Linux (Azure Linux, No Dependencies)
          parameters:
            name: tests_container_linux_nodeps
            # No GPU stack in these images, by design: they exist to prove SkiaSharp
            # works without those dependencies, so OpenGL genuinely cannot come up.
            # Declared here rather than inferred from the DllNotFoundException the
            # test would otherwise throw; the desktop Linux and Windows legs carry
            # the ganesh-gl coverage. Tracked by #4591.
            env:
              SKIASHARP_TEST_SKIP_GPU: ganesh-gl
            displayName: Linux (Azure Linux, No Dependencies)
            buildAgent: ${{ parameters.buildAgentLinux }}
            use1ESPipelineTemplates: ${{ parameters.use1ESPipelineTemplates }}
            docker: scripts/infra/tests/docker/azurelinux-nodeps
            target: tests-container
            additionalArgs: --nativePlatform=linuxnodeps
            installAndroidSdk: false
            installXcode: false
            shouldPublish: false
            requiredArtifacts:
              - name: native
            postBuildSteps:
              - task: PublishTestResults@2
                displayName: Publish the Azure Linux NoDeps container test results
                condition: always()
                inputs:
                  testResultsFormat: VSTest
                  testResultsFiles: 'output/logs/testlogs/**/*.trx'
                  testRunTitle: 'Linux (Azure Linux, No Dependencies) Tests'
            publishArtifacts:
              - name: testlogs_container_linux_nodeps
                always: true
                path: 'output/logs/testlogs'
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Tests|Linux (Alpine)
          parameters:
            name: tests_container_alpine_linux
            # No GPU stack in these images, by design: they exist to prove SkiaSharp
            # works without those dependencies, so OpenGL genuinely cannot come up.
            # Declared here rather than inferred from the DllNotFoundException the
            # test would otherwise throw; the desktop Linux and Windows legs carry
            # the ganesh-gl coverage. Tracked by #4591.
            env:
              SKIASHARP_TEST_SKIP_GPU: ganesh-gl
            displayName: Linux (Alpine)
            buildAgent: ${{ parameters.buildAgentLinux }}
            use1ESPipelineTemplates: ${{ parameters.use1ESPipelineTemplates }}
            docker: scripts/infra/tests/docker/alpine
            target: tests-container
            additionalArgs: --nativePlatform=alpine
            installAndroidSdk: false
            installXcode: false
            shouldPublish: false
            requiredArtifacts:
              - name: native
            postBuildSteps:
              - task: PublishTestResults@2
                displayName: Publish the Alpine container test results
                condition: always()
                inputs:
                  testResultsFormat: VSTest
                  testResultsFiles: 'output/logs/testlogs/**/*.trx'
                  testRunTitle: 'Linux (Alpine) Tests'
            publishArtifacts:
              - name: testlogs_container_alpine
                always: true
                path: 'output/logs/testlogs'
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Tests|Linux (Alpine, No Dependencies)
          parameters:
            name: tests_container_alpine_nodeps
            # No GPU stack in these images, by design: they exist to prove SkiaSharp
            # works without those dependencies, so OpenGL genuinely cannot come up.
            # Declared here rather than inferred from the DllNotFoundException the
            # test would otherwise throw; the desktop Linux and Windows legs carry
            # the ganesh-gl coverage. Tracked by #4591.
            env:
              SKIASHARP_TEST_SKIP_GPU: ganesh-gl
            displayName: Linux (Alpine, No Dependencies)
            buildAgent: ${{ parameters.buildAgentLinux }}
            use1ESPipelineTemplates: ${{ parameters.use1ESPipelineTemplates }}
            docker: scripts/infra/tests/docker/alpine-nodeps
            target: tests-container
            additionalArgs: --nativePlatform=alpinenodeps
            installAndroidSdk: false
            installXcode: false
            shouldPublish: false
            requiredArtifacts:
              - name: native
            postBuildSteps:
              - task: PublishTestResults@2
                displayName: Publish the Alpine NoDeps container test results
                condition: always()
                inputs:
                  testResultsFormat: VSTest
                  testResultsFiles: 'output/logs/testlogs/**/*.trx'
                  testRunTitle: 'Linux (Alpine, No Dependencies) Tests'
            publishArtifacts:
              - name: testlogs_container_alpine_nodeps
                always: true
                path: 'output/logs/testlogs'
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Tests|Windows (Nano Server)
          parameters:
            name: tests_container_nanoserver_windows
            # No GPU stack in these images, by design: they exist to prove SkiaSharp
            # works without those dependencies, so OpenGL genuinely cannot come up.
            # Declared here rather than inferred from the DllNotFoundException the
            # test would otherwise throw; the desktop Linux and Windows legs carry
            # the ganesh-gl coverage. Tracked by #4591.
            env:
              SKIASHARP_TEST_SKIP_GPU: ganesh-gl
            displayName: Windows (Nano Server)
            buildAgent: ${{ parameters.buildAgentWindows }}
            use1ESPipelineTemplates: ${{ parameters.use1ESPipelineTemplates }}
            docker: scripts/infra/tests/docker/nanoserver
            target: tests-container
            additionalArgs: --nativePlatform=nanoserver
            installAndroidSdk: false
            installXcode: false
            shouldPublish: false
            requiredArtifacts:
              - name: native
            postBuildSteps:
              - task: PublishTestResults@2
                displayName: Publish the Nano Server container test results
                condition: always()
                inputs:
                  testResultsFormat: VSTest
                  testResultsFiles: 'output/logs/testlogs/**/*.trx'
                  testRunTitle: 'Nano Server Container Tests'
            publishArtifacts:
              - name: testlogs_container_nanoserver
                always: true
                path: 'output/logs/testlogs'

        - job: coverage_reports                      # Coverage Reports
          displayName: Coverage Reports
          pool: ${{ parameters.buildAgentHost.pool }}
          dependsOn:
            - tests_netcore_windows
            - tests_netcore_macos
            - tests_netcore_linux
          steps:
            - checkout: self
            - pwsh: ./scripts/infra/native/shared/set-build-variables.ps1
              displayName: Configure build variables
            - task: DownloadBuildArtifacts@1
              displayName: Download the coverage_netcore_windows artifact
              inputs:
                artifactName: coverage_netcore_windows
                downloadPath: output
            - task: DownloadBuildArtifacts@1
              displayName: Download the coverage_netcore_macos artifact
              inputs:
                artifactName: coverage_netcore_macos
                downloadPath: output
            - task: DownloadBuildArtifacts@1
              displayName: Download the coverage_netcore_linux artifact
              inputs:
                artifactName: coverage_netcore_linux
                downloadPath: output
            - task: PublishCodeCoverageResults@1
              displayName: 'Publish the code coverage results'
              inputs:
                codeCoverageTool: Cobertura
                summaryFileLocation: 'output/**/Cobertura.xml'

    - stage: samples
      displayName: Samples
      ${{ if eq(parameters.isSplitPipeline, 'true') }}:
        dependsOn: prepare
      ${{ else }}:
        dependsOn: package
      jobs:
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Build Samples (Windows)
          parameters:
            name: samples_windows
            displayName: Windows
            buildAgent: ${{ parameters.buildAgentWindows}}
            target: samples
            requiredArtifacts:
              - name: nuget
                dir: nugets
            postBuildSteps:
              - pwsh: Remove-Item ./output/nugets/ -Recurse -Force -ErrorAction Continue
                displayName: Delete the nugets folder
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Build Samples (macOS)
          parameters:
            name: samples_macos
            displayName: macOS
            buildAgent: ${{ parameters.buildAgentMac }}
            target: samples
            installNinja: true
            shouldPublish: false
            requiredArtifacts:
              - name: nuget
                dir: nugets
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Build Samples (Linux)
          parameters:
            name: samples_linux
            displayName: Linux
            buildAgent: ${{ parameters.buildAgentLinux }}
            packages: $(MANAGED_LINUX_PACKAGES)
            target: samples
            shouldPublish: false
            requiredArtifacts:
              - name: nuget
                dir: nugets
            installEmsdk: true
            initScript: source ~/emsdk/emsdk_env.sh
