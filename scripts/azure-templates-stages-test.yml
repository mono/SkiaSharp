parameters:
  - name: buildPipelineType
    type: string
  - name: buildAgentHost
    type: object
  - name: buildAgentWindows
    type: object
  - name: buildAgentMac
    type: object
  - name: buildAgentLinux
    type: object
  - name: buildAgentAndroidTests
    type: object
  - name: enableCaching
    type: boolean
    default: false

stages:

  - template: /scripts/azure-templates-stages-managed.yml@self
    parameters:
      buildPipelineType: ${{ parameters.buildPipelineType }}
      buildAgentWindows: ${{ parameters.buildAgentWindows }}
      buildAgentMac: ${{ parameters.buildAgentMac }}
      buildAgentLinux: ${{ parameters.buildAgentLinux }}
      enableCaching: ${{ parameters.enableCaching }}

  - template: /scripts/azure-templates-stages-samples.yml@self
    parameters:
      buildPipelineType: ${{ parameters.buildPipelineType }}
      buildAgentWindows: ${{ parameters.buildAgentWindows }}
      buildAgentMac: ${{ parameters.buildAgentMac }}
      buildAgentLinux: ${{ parameters.buildAgentLinux }}
      buildAgentAndroidTests: ${{ parameters.buildAgentAndroidTests }}

  - template: /scripts/azure-templates-stages-tests.yml@self
    parameters:
      buildPipelineType: ${{ parameters.buildPipelineType }}
      buildAgentHost: ${{ parameters.buildAgentHost }}
      buildAgentWindows: ${{ parameters.buildAgentWindows }}
      buildAgentMac: ${{ parameters.buildAgentMac }}
      buildAgentLinux: ${{ parameters.buildAgentLinux }}
      buildAgentAndroidTests: ${{ parameters.buildAgentAndroidTests }}

  - stage: native_tests
    displayName: Native Tests
    ${{ if eq(parameters.buildPipelineType, 'test') }}:
      dependsOn: prepare
    ${{ else }}:
      dependsOn: native
    jobs:
      - template: /scripts/azure-templates-jobs-tests-native.yml@self
        parameters:
          buildAgent: ${{ parameters.buildAgentLinux }}
