parameters:
  - name: buildPipelineType
    type: string
  - name: buildAgentHost
    type: object
  - name: buildAgentWindows
    type: object
  - name: buildAgentMac
    type: object
  - name: buildAgentLinux
    type: object
  - name: buildAgentAndroidTests
    type: object
  - name: enableCaching
    type: boolean
    default: false

stages:

    - stage: managed
      displayName: Build Managed
      ${{ if eq(parameters.buildPipelineType, 'test') }}:
        dependsOn: prepare
      ${{ else }}:
        dependsOn: native
      jobs:
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Validate Interop
          parameters:
            name: managed_interop_windows
            displayName: Validate Interop
            buildAgent: ${{ parameters.buildAgentWindows}}
            target: externals-interop
            additionalArgs: --skipExternals="all"
            installAndroidSdk: false
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Build Managed (Windows)
          parameters:
            name: managed_windows
            dotnetSdks:
              - sdkVersion: $(DOTNET_VERSION)
                workloadSetVersion: $(DOTNET_WORKLOAD_VERSION)
                tizen:
                  manifestBand: $(DOTNET_TIZEN_MANIFEST_BAND)
                  manifestVersion: $(DOTNET_TIZEN_MANIFEST_VERSION)
            displayName: Managed (Windows)
            buildAgent: ${{ parameters.buildAgentWindows}}
            target: libs
            cacheJob: managed/libs
            enableCaching: ${{ parameters.enableCaching }}
            additionalArgs: --skipExternals="all"
            requiredArtifacts:
              - name: native
            postBuildSteps:
              - pwsh: Remove-Item ./output/native/ -Recurse -Force -ErrorAction Continue
                displayName: Delete the native folder
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Build Managed (macOS)
          parameters:
            name: managed_macos
            dotnetSdks:
              - sdkVersion: $(DOTNET_VERSION)
                workloadSetVersion: $(DOTNET_WORKLOAD_VERSION)
                tizen:
                  manifestBand: $(DOTNET_TIZEN_MANIFEST_BAND)
                  manifestVersion: $(DOTNET_TIZEN_MANIFEST_VERSION)
            displayName: Managed (macOS)
            buildAgent: ${{ parameters.buildAgentMac }}
            target: libs
            cacheJob: managed/libs
            enableCaching: ${{ parameters.enableCaching }}
            additionalArgs: --skipExternals="all"
            requiredArtifacts:
              - name: native
            postBuildSteps:
              - pwsh: Remove-Item ./output/native/ -Recurse -Force -ErrorAction Continue
                displayName: Delete the native folder
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Build Managed (Linux)
          parameters:
            name: managed_linux
            dotnetSdks:
              - sdkVersion: $(DOTNET_VERSION)
                workloadSetVersion: $(DOTNET_WORKLOAD_VERSION)
                tizen:
                  manifestBand: $(DOTNET_TIZEN_MANIFEST_BAND)
                  manifestVersion: $(DOTNET_TIZEN_MANIFEST_VERSION)
            displayName: Managed (Linux)
            buildAgent: ${{ parameters.buildAgentLinux }}
            packages: $(MANAGED_LINUX_PACKAGES)
            target: libs
            cacheJob: managed/libs
            enableCaching: ${{ parameters.enableCaching }}
            additionalArgs: --skipExternals="all"
            requiredArtifacts:
              - name: native
            postBuildSteps:
              - pwsh: Remove-Item ./output/native/ -Recurse -Force -ErrorAction Continue
                displayName: Delete the native folder

    - stage: tests
      displayName: Tests
      ${{ if eq(parameters.buildPipelineType, 'test') }}:
        dependsOn: prepare
      ${{ else }}:
        dependsOn: native
      jobs:
        - template: /scripts/azure-templates-jobs-tests.yml@self
          parameters:
            platform: windows
            buildAgent: ${{ parameters.buildAgentWindows }}
        - template: /scripts/azure-templates-jobs-tests.yml@self
          parameters:
            platform: macos
            buildAgent: ${{ parameters.buildAgentMac }}
        - template: /scripts/azure-templates-jobs-tests.yml@self
          parameters:
            platform: linux
            buildAgent: ${{ parameters.buildAgentLinux }}
        - template: /scripts/azure-templates-jobs-tests-device.yml@self
          parameters:
            target: android
            buildAgent: ${{ parameters.buildAgentAndroidTests }}
        - template: /scripts/azure-templates-jobs-tests-device.yml@self
          parameters:
            target: ios
            buildAgent: ${{ parameters.buildAgentMac }}
        - template: /scripts/azure-templates-jobs-tests-device.yml@self
          parameters:
            target: maccatalyst
            buildAgent: ${{ parameters.buildAgentMac }}
        - template: /scripts/azure-templates-jobs-tests-device.yml@self
          parameters:
            target: wasm
            buildAgent: ${{ parameters.buildAgentLinux }}
        - template: /scripts/azure-templates-jobs-tests-device.yml@self
          parameters:
            target: wasm-preview
            buildAgent: ${{ parameters.buildAgentLinux }}
        - template: /scripts/azure-templates-jobs-tests-container.yml@self
          parameters:
            platform: linux
            buildAgent: ${{ parameters.buildAgentLinux }}
        - template: /scripts/azure-templates-jobs-tests-container.yml@self
          parameters:
            platform: windows
            buildAgent: ${{ parameters.buildAgentWindows }}

        - job: coverage_reports                      # Coverage Reports
          displayName: Coverage Reports
          pool: ${{ parameters.buildAgentHost.pool }}
          dependsOn:
            - tests_netcore_windows
            - tests_netcore_macos
            - tests_netcore_linux
          steps:
            - checkout: self
            - pwsh: ./scripts/infra/shared/set-build-variables.ps1
              displayName: Configure build variables
            - task: DownloadBuildArtifacts@1
              displayName: Download the coverage_netcore_windows artifact
              inputs:
                artifactName: coverage_netcore_windows
                downloadPath: output
            - task: DownloadBuildArtifacts@1
              displayName: Download the coverage_netcore_macos artifact
              inputs:
                artifactName: coverage_netcore_macos
                downloadPath: output
            - task: DownloadBuildArtifacts@1
              displayName: Download the coverage_netcore_linux artifact
              inputs:
                artifactName: coverage_netcore_linux
                downloadPath: output
            - task: PublishCodeCoverageResults@1
              displayName: 'Publish the code coverage results'
              inputs:
                codeCoverageTool: Cobertura
                summaryFileLocation: 'output/**/Cobertura.xml'

    - stage: samples
      displayName: Samples
      ${{ if eq(parameters.buildPipelineType, 'test') }}:
        dependsOn: prepare
      ${{ else }}:
        dependsOn: package
      jobs:
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Build Samples (Windows)
          parameters:
            name: samples_windows
            dotnetSdks:
              - sdkVersion: $(DOTNET_VERSION)
                workloadSetVersion: $(DOTNET_WORKLOAD_VERSION)
                tizen:
                  manifestBand: $(DOTNET_TIZEN_MANIFEST_BAND)
                  manifestVersion: $(DOTNET_TIZEN_MANIFEST_VERSION)
            displayName: Windows
            buildAgent: ${{ parameters.buildAgentWindows}}
            target: samples
            requiredArtifacts:
              - name: native
              - name: nuget
                dir: nugets
            postBuildSteps:
              - task: PublishTestResults@2
                condition: always()
                inputs:
                  testResultsFormat: VSTest
                  testResultsFiles: output/logs/testlogs/samples/**/*.trx
                  testRunTitle: Samples (Windows)
              - task: PublishPipelineArtifact@1
                condition: always()
                inputs:
                  targetPath: output/logs
                  artifact: sample_logs_windows
              - pwsh: Remove-Item ./output/nugets/ -Recurse -Force -ErrorAction Continue
                displayName: Delete the nugets folder
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Build Samples (macOS)
          parameters:
            name: samples_macos
            dotnetSdks:
              - sdkVersion: $(DOTNET_VERSION)
                workloadSetVersion: $(DOTNET_WORKLOAD_VERSION)
                tizen:
                  manifestBand: $(DOTNET_TIZEN_MANIFEST_BAND)
                  manifestVersion: $(DOTNET_TIZEN_MANIFEST_VERSION)
            displayName: macOS
            buildAgent: ${{ parameters.buildAgentMac }}
            target: samples
            installNinja: true
            shouldPublish: false
            requiredArtifacts:
              - name: native
              - name: nuget
                dir: nugets
            postBuildSteps:
              - task: PublishTestResults@2
                condition: always()
                inputs:
                  testResultsFormat: VSTest
                  testResultsFiles: output/logs/testlogs/samples/**/*.trx
                  testRunTitle: Samples (macOS)
              - task: PublishPipelineArtifact@1
                condition: always()
                inputs:
                  targetPath: output/logs
                  artifact: sample_logs_macos
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self # Build Samples (Linux)
          parameters:
            name: samples_linux
            dotnetSdks:
              - sdkVersion: $(DOTNET_VERSION)
                workloadSetVersion: $(DOTNET_WORKLOAD_VERSION)
                tizen:
                  manifestBand: $(DOTNET_TIZEN_MANIFEST_BAND)
                  manifestVersion: $(DOTNET_TIZEN_MANIFEST_VERSION)
            displayName: Linux
            buildAgent: ${{ parameters.buildAgentLinux }}
            packages: $(MANAGED_LINUX_PACKAGES)
            target: samples
            shouldPublish: false
            requiredArtifacts:
              - name: native
              - name: nuget
                dir: nugets
            installEmsdk: true
            initScript: source ~/emsdk/emsdk_env.sh
            postBuildSteps:
              - task: PublishTestResults@2
                condition: always()
                inputs:
                  testResultsFormat: VSTest
                  testResultsFiles: output/logs/testlogs/samples/**/*.trx
                  testRunTitle: Samples (Linux)
              - task: PublishPipelineArtifact@1
                condition: always()
                inputs:
                  targetPath: output/logs
                  artifact: sample_logs_linux
