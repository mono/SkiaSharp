parameters:
  - name: buildPipelineType
    type: string
  - name: buildAgentHost
    type: object
  - name: buildAgentWindows
    type: object
    default: ''
  - name: buildAgentWindowsNative
    type: object
    default: ''
  - name: buildAgentMac
    type: object
    default: ''
  - name: buildAgentMacNative
    type: object
    default: ''
  - name: buildAgentLinux
    type: object
    default: ''
  - name: buildAgentLinuxNative
    type: object
    default: ''
  - name: buildAgentAndroidTests
    type: object
    default: ''
  - name: use1ESPipelineTemplates
    type: boolean
    default: false
  - name: enableCaching
    type: boolean
    default: false
  - name: forceRealSigning
    type: boolean
    default: false
  - name: runApiScan
    type: boolean
    default: false

stages:

  - template: /scripts/azure-templates-stages-prepare.yml@self
    parameters:
      buildAgentHost: ${{ parameters.buildAgentHost }}

  - ${{ if in(parameters.buildPipelineType, 'build', 'complete') }}:
    - template: /scripts/azure-templates-stages-native.yml@self
      parameters:
        buildAgentHost: ${{ parameters.buildAgentHost }}
        buildAgentWindowsNative: ${{ parameters.buildAgentWindowsNative }}
        buildAgentMacNative: ${{ parameters.buildAgentMacNative }}
        buildAgentLinuxNative: ${{ parameters.buildAgentLinuxNative }}
        use1ESPipelineTemplates: ${{ parameters.use1ESPipelineTemplates }}
        enableCaching: ${{ parameters.enableCaching }}

  - ${{ if in(parameters.buildPipelineType, 'build', 'complete') }}:
    - template: /scripts/azure-templates-stages-package.yml@self
      parameters:
        buildAgentWindows: ${{ parameters.buildAgentWindows }}
        enableCaching: ${{ parameters.enableCaching }}

  # Build.Reason covers policy-triggered PRs; refs/pull covers manually queued
  # or resource-triggered PR merge refs.
  - ${{ if and(eq(parameters.buildPipelineType, 'build'), eq(variables['System.TeamProject'], 'internal'), ne(variables['Build.Reason'], 'PullRequest'), not(startsWith(variables['Build.SourceBranch'], 'refs/pull/'))) }}:
    - template: /scripts/azure-templates-stages-signing.yml@self
      parameters:
        buildAgent: ${{ parameters.buildAgentWindows }}
        ${{ if or(eq(parameters.forceRealSigning, 'true'), eq(lower(trim(variables['PREVIEW_LABEL'])), 'stable'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')) }}:
          useRealSigning: true
        ${{ else }}:
          useRealSigning: false

  - ${{ if and(eq(parameters.buildPipelineType, 'build'), or(eq(parameters.runApiScan, 'true'), eq(lower(trim(variables['PREVIEW_LABEL'])), 'stable'), and(eq(variables['System.TeamProject'], 'internal'), eq(variables['Build.Reason'], 'Schedule')))) }}:
    - template: /scripts/azure-templates-stages-apiscan.yml@self
      parameters:
        buildAgentWindows: ${{ parameters.buildAgentWindows }}

  - ${{ if and(eq(parameters.buildPipelineType, 'build'), eq(variables['System.TeamProject'], 'internal'), ne(variables['Build.Reason'], 'PullRequest'), not(startsWith(variables['Build.SourceBranch'], 'refs/pull/')), or(eq(parameters.forceRealSigning, 'true'), eq(lower(trim(variables['PREVIEW_LABEL'])), 'stable'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))) }}:
    - template: /scripts/azure-templates-stages-publish.yml@self
      parameters:
        includeApiScan: ${{ or(eq(parameters.runApiScan, 'true'), eq(lower(trim(variables['PREVIEW_LABEL'])), 'stable'), and(eq(variables['System.TeamProject'], 'internal'), eq(variables['Build.Reason'], 'Schedule'))) }}

  - ${{ if in(parameters.buildPipelineType, 'test', 'complete') }}:
    - template: /scripts/azure-templates-stages-test.yml@self
      parameters:
        buildPipelineType: ${{ parameters.buildPipelineType }}
        buildAgentHost: ${{ parameters.buildAgentHost }}
        buildAgentWindows: ${{ parameters.buildAgentWindows }}
        buildAgentMac: ${{ parameters.buildAgentMac }}
        buildAgentLinux: ${{ parameters.buildAgentLinux }}
        buildAgentAndroidTests: ${{ parameters.buildAgentAndroidTests }}
        enableCaching: ${{ parameters.enableCaching }}
