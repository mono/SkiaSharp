      - stage: ApproveAssignments
        displayName: Approve release assignment reconciliation
        dependsOn: PlanAssignments
        condition: >
          and(succeeded(),
          eq(dependencies.PlanAssignments.outputs['Plan.state.needsApproval'], 'true'))
        jobs:
          - job: Approval
            pool: server
            timeoutInMinutes: 1440
            steps:
              - task: ManualValidation@1
                timeoutInMinutes: 720
                inputs:
                  notifyUsers: ''
                  instructions: >
                    Review every shipped PR and linked-issue assignment on the
                    Extensions tab. Resume to apply exactly those assignments.
                  onTimeout: reject

      - stage: ReconcileAssignments
        displayName: Reconcile release assignments
        dependsOn:
          - PlanAssignments
          - ApproveAssignments
        condition: >
          and(eq(dependencies.PlanAssignments.result, 'Succeeded'),
          not(failed()), not(canceled()))
        jobs:
          - job: Reconcile
            pool:
              vmImage: ubuntu-24.04
            steps:
              - checkout: self
                fetchDepth: 0
                fetchTags: true
              - task: DownloadPipelineArtifact@2
                inputs:
                  artifact: release-assignment-plan
                  path: $(Pipeline.Workspace)/release-assignment-plan
              - bash: |
                  set -euo pipefail
                  test -n "${GH_TOKEN:-}" || exit 1
                  python3 - <<'PY'
                  import json
                  import shlex
                  import subprocess
                  from pathlib import Path

                  root = Path(
                      "$(Pipeline.Workspace)/release-assignment-plan"
                  )
                  plan = json.loads(
                      (root / "assignments-plan.json").read_text()
                  )
                  current = json.loads(
                      subprocess.run(
                          shlex.split(plan["reconcileDryRunCommand"]),
                          check=True,
                          capture_output=True,
                          text=True,
                      ).stdout
                  )
                  approved = plan["reconcile"]
                  compared_fields = (
                      "version",
                      "tags",
                      "branches",
                      "previousBoundary",
                      "operations",
                      "warnings",
                      "nextAction",
                  )
                  if any(
                      current[field] != approved[field]
                      for field in compared_fields
                  ):
                      raise SystemExit(
                          "Release assignments changed after approval; rerun "
                          "complete to review the current reconciliation plan"
                      )
                  command = current.get("executionCommand")
                  if command:
                      result = json.loads(
                          subprocess.run(
                              shlex.split(command),
                              check=True,
                              capture_output=True,
                              text=True,
                          ).stdout
                      )
                  else:
                      result = current
                  if result["nextAction"] != "complete":
                      raise SystemExit(
                          "Assignment reconciliation ended at "
                          f"{result['nextAction']}"
                      )
                  (root / "assignments-result.json").write_text(
                      json.dumps(result, indent=2) + "\n"
                  )
                  PY
                  echo "##vso[task.uploadfile]$(Pipeline.Workspace)/release-assignment-plan/assignments-result.json"
                displayName: Apply approved release assignments
