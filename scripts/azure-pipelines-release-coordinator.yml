trigger: none
pr: none

# Manual release coordinator.
#
# Pipeline configuration prerequisites:
# - Authorize variable group "Xamarin-Secrets".
# - Grant the pipeline build identity permission to queue pipeline 25298.
# - Authorize the mono/SkiaSharp GitHub service connection.

parameters:
  - name: operation
    displayName: Release operation
    type: string
    default: start
    values:
      - start
      - complete
  - name: target
    displayName: >
      Start: main or release/X.Y.x. Complete: exact release branch or tested SHA.
    type: string
    default: main
  - name: releaseVersion
    displayName: Exact release version for start (empty detects next preview)
    type: string
    default: ''
  - name: overrideReleaseTesting
    displayName: Explicitly override the external release-testing gate
    type: boolean
    default: false
variables:
  - group: Xamarin-Secrets

stages:
  - ${{ if eq(parameters.operation, 'start') }}:
      - stage: PlanStart
        displayName: Plan release branch
        jobs:
          - job: Plan
            displayName: Audit release branch creation
            pool:
              vmImage: ubuntu-24.04
            steps:
              - checkout: self
                fetchDepth: 0
                fetchTags: true
                submodules: recursive
                persistCredentials: false
              - bash: |
                  set -euo pipefail
                  test -n "${GH_TOKEN:-}" || {
                    echo "GitHub release token is not configured." >&2
                    exit 1
                  }
                  gh auth setup-git
                  git config user.name "xamarin-release-manager"
                  git config user.email "xamarin-release-manager@users.noreply.github.com"
                displayName: Configure GitHub authentication
                env:
                  GH_TOKEN: $(github--pat--xamarinreleasemanager)
              - bash: |
                  set -euo pipefail
                  mkdir -p "$(Build.ArtifactStagingDirectory)/release-start"

                  version="$RELEASE_VERSION"
                  if [ -z "$version" ]; then
                    python3 .agents/skills/release-branch/scripts/detect-release-version.py \
                      "$TARGET" \
                      > "$(Build.ArtifactStagingDirectory)/release-start/detect.json"
                    version="$(jq -r '.releaseVersion' \
                      "$(Build.ArtifactStagingDirectory)/release-start/detect.json")"
                  fi

                  python3 .agents/skills/release-branch/scripts/create-release-branches.py \
                    "$version" \
                    --dry-run \
                    > "$(Build.ArtifactStagingDirectory)/release-start/plan.json"

                  python3 - <<'PY'
                  import json
                  import os
                  from pathlib import Path

                  root = Path(os.environ["ARTIFACT_DIR"])
                  plan = json.loads((root / "plan.json").read_text())
                  lines = [
                      "# Release branch audit",
                      "",
                      f"**Release:** `{plan['version']}` ({plan['type']})",
                      f"**Base:** `{plan['baseRef']}` at `{plan['baseSha']}`",
                      f"**Skia:** `{plan['skiaSha']}`",
                      "",
                      "| Operation | Status | Detail |",
                      "|-----------|--------|--------|",
                  ]
                  for item in plan["operations"]:
                      lines.append(
                          f"| {item['id']} | {item['status']} | {item['detail']} |"
                      )
                  warnings = plan.get("warnings") or []
                  if warnings:
                      lines += ["", "## Warnings", *[f"- {item}" for item in warnings]]
                  (root / "summary.md").write_text("\n".join(lines) + "\n")
                  PY
                  echo "##vso[task.uploadsummary]$(Build.ArtifactStagingDirectory)/release-start/summary.md"
                  echo "##vso[task.uploadfile]$(Build.ArtifactStagingDirectory)/release-start/plan.json"
                  if [ -f "$(Build.ArtifactStagingDirectory)/release-start/detect.json" ]; then
                    echo "##vso[task.uploadfile]$(Build.ArtifactStagingDirectory)/release-start/detect.json"
                  fi
                displayName: Build immutable start plan
                env:
                  TARGET: ${{ parameters.target }}
                  RELEASE_VERSION: ${{ parameters.releaseVersion }}
                  ARTIFACT_DIR: $(Build.ArtifactStagingDirectory)/release-start
              - task: PublishPipelineArtifact@1
                displayName: Publish start plan
                inputs:
                  targetPath: $(Build.ArtifactStagingDirectory)/release-start
                  artifact: release-start-plan

      - stage: ApproveStart
        displayName: Approve release branch
        dependsOn: PlanStart
        jobs:
          - job: Approval
            displayName: Review release branch audit
            pool: server
            timeoutInMinutes: 1440
            steps:
              - task: ManualValidation@1
                timeoutInMinutes: 720
                inputs:
                  notifyUsers: ''
                  instructions: >
                    Review the Release branch audit on the Extensions tab and
                    the raw JSON attached to the planning task logs. Resume only
                    if the exact version, base SHA, Skia SHA, and pending remote
                    operations are correct.
                  onTimeout: reject

      - stage: ExecuteStart
        displayName: Create release branch
        dependsOn: ApproveStart
        jobs:
          - job: Execute
            displayName: Execute approved release branch plan
            pool:
              vmImage: ubuntu-24.04
            steps:
              - checkout: self
                fetchDepth: 0
                fetchTags: true
                submodules: recursive
                persistCredentials: false
              - task: DownloadPipelineArtifact@2
                inputs:
                  artifact: release-start-plan
                  path: $(Pipeline.Workspace)/release-start-plan
              - bash: |
                  set -euo pipefail
                  test -n "${GH_TOKEN:-}" || exit 1
                  gh auth setup-git
                  git config user.name "xamarin-release-manager"
                  git config user.email "xamarin-release-manager@users.noreply.github.com"
                  python3 - <<'PY'
                  import json
                  import shlex
                  import subprocess
                  from pathlib import Path

                  plan = json.loads(
                      Path("$(Pipeline.Workspace)/release-start-plan/plan.json").read_text()
                  )
                  command = plan.get("executionCommand")
                  if command:
                      subprocess.run(shlex.split(command), check=True)
                  PY
                displayName: Execute release branch creation
                env:
                  GH_TOKEN: $(github--pat--xamarinreleasemanager)

  - ${{ if eq(parameters.operation, 'complete') }}:
      - stage: PlanComplete
        displayName: Plan package publication
        jobs:
          - job: Plan
            displayName: Detect tested release and audit package push
            pool:
              vmImage: ubuntu-24.04
            steps:
              - checkout: self
                fetchDepth: 0
                fetchTags: true
                persistCredentials: false
              - bash: |
                  set -euo pipefail
                  test -n "${AZURE_DEVOPS_EXT_PAT:-}" || {
                    echo "System.AccessToken is unavailable to the coordinator." >&2
                    exit 1
                  }
                  az extension add --name azure-devops --only-show-errors 2>/dev/null || \
                    az extension update --name azure-devops --only-show-errors
                  mkdir -p "$(Build.ArtifactStagingDirectory)/release-complete"

                  python3 .agents/skills/release-publish/scripts/detect-release-publish.py \
                    "$TARGET" \
                    > "$(Build.ArtifactStagingDirectory)/release-complete/context.json"

                  python3 - <<'PY'
                  import json
                  import shlex
                  import subprocess
                  from pathlib import Path

                  root = Path("$(Build.ArtifactStagingDirectory)/release-complete")
                  context = json.loads((root / "context.json").read_text())
                  command = shlex.split(context["pushAuditCommand"])
                  command.extend(["--verification", "azure"])
                  with (root / "push-plan.json").open("w") as output:
                      subprocess.run(command, check=True, stdout=output, text=True)

                  plan = json.loads((root / "push-plan.json").read_text())
                  allowed = {
                      "confirm-publish-packages",
                      "approve-publish-run",
                      "wait-for-nuget",
                      "start-release-draft",
                  }
                  if plan["nextAction"] not in allowed:
                      raise SystemExit(
                          f"Package publication needs recovery: "
                          f"{plan['nextAction']}"
                      )
                  needs = str(
                      plan["nextAction"] == "confirm-publish-packages"
                  ).lower()
                  print(
                      f"##vso[task.setvariable variable=needsApproval;"
                      f"isOutput=true]{needs}"
                  )
                  lines = [
                      "# Package publication audit",
                      "",
                      f"**Release:** `{plan['release']['version']}`",
                      f"**Commit:** `{plan['release']['sourceSha']}`",
                      f"**Managed run:** `{plan['release']['managedRunId']}`",
                      "",
                      "| Operation | Status | Detail |",
                      "|-----------|--------|--------|",
                  ]
                  for item in plan["operations"]:
                      lines.append(
                          f"| {item['id']} | {item['status']} | {item['detail']} |"
                      )
                  warnings = plan.get("warnings") or []
                  if warnings:
                      lines.extend(
                          ["", "## Warnings", *[f"- {item}" for item in warnings]]
                      )
                  (root / "summary.md").write_text("\n".join(lines) + "\n")
                  PY
                  echo "##vso[task.uploadsummary]$(Build.ArtifactStagingDirectory)/release-complete/summary.md"
                  echo "##vso[task.uploadfile]$(Build.ArtifactStagingDirectory)/release-complete/context.json"
                  echo "##vso[task.uploadfile]$(Build.ArtifactStagingDirectory)/release-complete/push-plan.json"
                name: state
                displayName: Build exact package plan
                env:
                  TARGET: ${{ parameters.target }}
                  AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
              - task: PublishPipelineArtifact@1
                inputs:
                  targetPath: $(Build.ArtifactStagingDirectory)/release-complete
                  artifact: release-complete-plan

      - ${{ if eq(parameters.overrideReleaseTesting, false) }}:
          - stage: ConfirmTesting
            displayName: Confirm external release testing
            dependsOn: PlanComplete
            jobs:
              - job: Approval
                pool: server
                timeoutInMinutes: 1440
                steps:
                  - task: ManualValidation@1
                    timeoutInMinutes: 720
                    inputs:
                      notifyUsers: ''
                      instructions: >
                        Confirm the approved release-testing device/host matrix
                        passed against the exact packages shown in the package
                        publication audit on the Extensions tab. CI tests remain
                        mandatory regardless.
                      onTimeout: reject

      - stage: ApprovePackages
        displayName: Approve NuGet.org publication
        dependsOn:
          - PlanComplete
          - ${{ if eq(parameters.overrideReleaseTesting, false) }}:
            - ConfirmTesting
        condition: >
          and(not(failed()), not(canceled()),
          eq(dependencies.PlanComplete.outputs['Plan.state.needsApproval'], 'true'))
        jobs:
          - job: Approval
            pool: server
            timeoutInMinutes: 1440
            steps:
              - task: ManualValidation@1
                timeoutInMinutes: 720
                inputs:
                  notifyUsers: ''
                  instructions: >
                    Review the exact package plan on the Extensions tab and its
                    raw JSON task attachments. Resume only to queue the selected
                    managed run. A human must separately review versions and
                    destination in the protected NuGet.org pipeline stage.
                  onTimeout: reject

      - stage: PushPackages
        displayName: Wait for human-approved package push
        dependsOn:
          - PlanComplete
          - ApprovePackages
          - ${{ if eq(parameters.overrideReleaseTesting, false) }}:
            - ConfirmTesting
        condition: and(not(failed()), not(canceled()))
        jobs:
          - job: Push
            timeoutInMinutes: 120
            pool:
              vmImage: ubuntu-24.04
            steps:
              - checkout: self
                fetchDepth: 0
                fetchTags: true
              - task: DownloadPipelineArtifact@2
                inputs:
                  artifact: release-complete-plan
                  path: $(Pipeline.Workspace)/release-complete-plan
              - bash: |
                  set -euo pipefail
                  test -n "${AZURE_DEVOPS_EXT_PAT:-}" || {
                    echo "System.AccessToken is unavailable to the coordinator." >&2
                    exit 1
                  }
                  az extension add --name azure-devops --only-show-errors 2>/dev/null || \
                    az extension update --name azure-devops --only-show-errors
                  python3 - <<'PY'
                  import json
                  import shlex
                  import subprocess
                  from pathlib import Path

                  plan = json.loads(
                      Path("$(Pipeline.Workspace)/release-complete-plan/push-plan.json").read_text()
                  )
                  command_text = (
                      plan.get("executionCommand")
                      or plan.get("resumeCommand")
                  )
                  if command_text:
                      command = shlex.split(command_text)
                      if "--wait" not in command:
                          command.append("--wait")
                      result = json.loads(
                          subprocess.run(
                              command,
                              check=True,
                              capture_output=True,
                              text=True,
                          ).stdout
                      )
                  else:
                      result = plan
                  if result["nextAction"] != "start-release-draft":
                      raise SystemExit(
                          f"Package publication ended at "
                          f"{result['nextAction']}; rerun complete to resume"
                      )
                  root = Path(
                      "$(Pipeline.Workspace)/release-complete-plan"
                  )
                  (root / "push-result.json").write_text(
                      json.dumps(result, indent=2) + "\n"
                  )
                  PY
                  echo "##vso[task.uploadfile]$(Pipeline.Workspace)/release-complete-plan/push-result.json"
                displayName: Queue and wait for protected Azure publication
                env:
                  AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
              - task: PublishPipelineArtifact@1
                inputs:
                  targetPath: $(Pipeline.Workspace)/release-complete-plan
                  artifact: release-package-result

      - stage: PlanDraft
        displayName: Plan release tag and draft
        dependsOn: PushPackages
        jobs:
          - job: Plan
            timeoutInMinutes: 20
            pool:
              vmImage: ubuntu-24.04
            steps:
              - checkout: self
                fetchDepth: 0
                fetchTags: true
                persistCredentials: false
              - task: DownloadPipelineArtifact@2
                inputs:
                  artifact: release-package-result
                  path: $(Pipeline.Workspace)/release-package-result
              - bash: |
                  set -euo pipefail
                  test -n "${GH_TOKEN:-}" || exit 1
                  gh auth setup-git
                  mkdir -p "$(Build.ArtifactStagingDirectory)/release-draft"

                  python3 - <<'PY'
                  import json
                  import shlex
                  import shutil
                  import subprocess
                  from pathlib import Path

                  source = Path("$(Pipeline.Workspace)/release-package-result/context.json")
                  root = Path("$(Build.ArtifactStagingDirectory)/release-draft")
                  context = json.loads(source.read_text())
                  command = shlex.split(context["draftAuditCommand"])
                  initial = json.loads(
                      subprocess.run(
                          command,
                          check=True,
                          capture_output=True,
                          text=True,
                      ).stdout
                  )
                  plan = initial
                  if plan["nextAction"] not in {
                      "confirm-create-release-draft",
                      "confirm-publish-release",
                      "audit-release-publication",
                  }:
                      raise SystemExit(
                          f"Draft is not ready: {plan['nextAction']}"
                      )
                  (root / "draft-plan.json").write_text(
                      json.dumps(plan, indent=2) + "\n"
                  )
                  needs = str(
                      plan["nextAction"] == "confirm-create-release-draft"
                  ).lower()
                  print(
                      f"##vso[task.setvariable variable=needsApproval;"
                      f"isOutput=true]{needs}"
                  )
                  lines = [
                      "# Release tag and draft audit",
                      "",
                      f"**Release:** `{plan['release']['version']}`",
                      f"**Tag:** `{plan['release']['tag']}`",
                      f"**Commit:** `{plan['release']['sourceSha']}`",
                      f"**Previous tag:** `{plan['release'].get('previousTag')}`",
                      "",
                      "| Operation | Status | Detail |",
                      "|-----------|--------|--------|",
                  ]
                  for item in plan["operations"]:
                      lines.append(
                          f"| {item['id']} | {item['status']} | {item['detail']} |"
                      )
                  (root / "summary.md").write_text("\n".join(lines) + "\n")
                  if Path("output").exists():
                      shutil.copytree(
                          Path("output"),
                          root / "output",
                          dirs_exist_ok=True,
                      )
                  PY
                  echo "##vso[task.uploadsummary]$(Build.ArtifactStagingDirectory)/release-draft/summary.md"
                  echo "##vso[task.uploadfile]$(Build.ArtifactStagingDirectory)/release-draft/draft-plan.json"
                name: state
                displayName: Build tag and draft plan
                env:
                  GH_TOKEN: $(github--pat--xamarinreleasemanager)
              - task: PublishPipelineArtifact@1
                inputs:
                  targetPath: $(Build.ArtifactStagingDirectory)/release-draft
                  artifact: release-draft-plan

      - stage: ApproveDraft
        displayName: Approve tag and GitHub draft
        dependsOn: PlanDraft
        condition: >
          and(succeeded(),
          eq(dependencies.PlanDraft.outputs['Plan.state.needsApproval'], 'true'))
        jobs:
          - job: Approval
            pool: server
            timeoutInMinutes: 1440
            steps:
              - task: ManualValidation@1
                timeoutInMinutes: 720
                inputs:
                  notifyUsers: ''
                  instructions: >
                    Review the exact tag, commit, previous tag, and draft
                    operation table. Resume to push the tag and create the
                    generated-notes GitHub draft.
                  onTimeout: reject

      - stage: CreateDraft
        displayName: Create tag and GitHub draft
        dependsOn:
          - PlanDraft
          - ApproveDraft
        condition: >
          and(eq(dependencies.PlanDraft.result, 'Succeeded'),
          not(failed()), not(canceled()))
        jobs:
          - job: Create
            timeoutInMinutes: 20
            pool:
              vmImage: ubuntu-24.04
            steps:
              - checkout: self
                fetchDepth: 0
                fetchTags: true
                persistCredentials: false
              - task: DownloadPipelineArtifact@2
                inputs:
                  artifact: release-draft-plan
                  path: $(Pipeline.Workspace)/release-draft-plan
              - bash: |
                  set -euo pipefail
                  test -n "${GH_TOKEN:-}" || exit 1
                  gh auth setup-git
                  python3 - <<'PY'
                  import json
                  import shlex
                  import shutil
                  import subprocess
                  from pathlib import Path

                  root = Path("$(Pipeline.Workspace)/release-draft-plan")
                  plan = json.loads((root / "draft-plan.json").read_text())
                  command_text = plan.get("executionCommand")
                  if command_text:
                      result = json.loads(
                          subprocess.run(
                              shlex.split(command_text),
                              check=True,
                              capture_output=True,
                              text=True,
                          ).stdout
                      )
                  else:
                      result = plan
                  if result["nextAction"] not in {
                      "confirm-publish-release",
                      "audit-release-publication",
                  }:
                      raise SystemExit(
                          f"Draft creation ended at {result['nextAction']}"
                      )
                  (root / "draft-result.json").write_text(
                      json.dumps(result, indent=2) + "\n"
                  )
                  output = Path("output")
                  if output.exists():
                      shutil.copytree(
                          output,
                          root / "output",
                          dirs_exist_ok=True,
                      )
                  PY
                  echo "##vso[task.uploadfile]$(Pipeline.Workspace)/release-draft-plan/draft-result.json"
                displayName: Create release tag and draft
                env:
                  GH_TOKEN: $(github--pat--xamarinreleasemanager)
              - task: PublishPipelineArtifact@1
                inputs:
                  targetPath: $(Pipeline.Workspace)/release-draft-plan
                  artifact: release-draft-result

      - stage: PlanPublication
        displayName: Plan GitHub Release publication
        dependsOn: CreateDraft
        jobs:
          - job: Plan
            timeoutInMinutes: 20
            pool:
              vmImage: ubuntu-24.04
            steps:
              - checkout: self
                fetchDepth: 0
                fetchTags: true
                persistCredentials: false
              - task: DownloadPipelineArtifact@2
                inputs:
                  artifact: release-draft-result
                  path: $(Pipeline.Workspace)/release-draft-result
              - bash: |
                  set -euo pipefail
                  test -n "${GH_TOKEN:-}" || exit 1
                  gh auth setup-git
                  if [ -d "$(Pipeline.Workspace)/release-draft-result/output" ]; then
                    mkdir -p output
                    cp -R "$(Pipeline.Workspace)/release-draft-result/output/." output/
                  fi
                  python3 - <<'PY'
                  import json
                  import shlex
                  import shutil
                  import subprocess
                  from pathlib import Path

                  source = Path("$(Pipeline.Workspace)/release-draft-result")
                  root = Path("$(Build.ArtifactStagingDirectory)/release-publication")
                  root.mkdir(parents=True, exist_ok=True)
                  draft = json.loads((source / "draft-result.json").read_text())
                  command = shlex.split(draft["publishAuditCommand"])
                  plan = json.loads(
                      subprocess.run(
                          command,
                          check=True,
                          capture_output=True,
                          text=True,
                      ).stdout
                  )
                  if plan["nextAction"] not in {
                      "confirm-publish-release",
                      "dispatch-release-notes",
                      "start-release-milestones",
                  }:
                      raise SystemExit(
                          f"Publication is not ready: {plan['nextAction']}"
                      )
                  (root / "publication-plan.json").write_text(
                      json.dumps(plan, indent=2) + "\n"
                  )
                  needs = str(
                      plan["nextAction"] == "confirm-publish-release"
                  ).lower()
                  print(
                      f"##vso[task.setvariable variable=needsApproval;"
                      f"isOutput=true]{needs}"
                  )
                  lines = [
                      "# GitHub Release publication audit",
                      "",
                      f"**Release:** `{plan['release']['version']}`",
                      f"**Tag:** `{plan['release']['tag']}`",
                      "",
                      "| Operation | Status | Detail |",
                      "|-----------|--------|--------|",
                  ]
                  for item in plan["operations"]:
                      lines.append(
                          f"| {item['id']} | {item['status']} | {item['detail']} |"
                      )
                  (root / "summary.md").write_text("\n".join(lines) + "\n")
                  if Path("output").exists():
                      shutil.copytree(
                          Path("output"),
                          root / "output",
                          dirs_exist_ok=True,
                      )
                  PY
                  echo "##vso[task.uploadsummary]$(Build.ArtifactStagingDirectory)/release-publication/summary.md"
                  echo "##vso[task.uploadfile]$(Build.ArtifactStagingDirectory)/release-publication/publication-plan.json"
                name: state
                displayName: Build publication and docs dispatch plan
                env:
                  GH_TOKEN: $(github--pat--xamarinreleasemanager)
              - task: PublishPipelineArtifact@1
                inputs:
                  targetPath: $(Build.ArtifactStagingDirectory)/release-publication
                  artifact: release-publication-plan

      - stage: ApprovePublication
        displayName: Approve GitHub Release publication
        dependsOn: PlanPublication
        condition: >
          and(succeeded(),
          eq(dependencies.PlanPublication.outputs['Plan.state.needsApproval'], 'true'))
        jobs:
          - job: Approval
            pool: server
            timeoutInMinutes: 1440
            steps:
              - task: ManualValidation@1
                timeoutInMinutes: 720
                inputs:
                  notifyUsers: ''
                  instructions: >
                    Review the marked generated-notes draft URL and publication
                    operations. Resume to publish the GitHub Release and dispatch
                    the targeted release-notes workflow.
                  onTimeout: reject

      - stage: PublishRelease
        displayName: Publish GitHub Release
        dependsOn:
          - PlanPublication
          - ApprovePublication
        condition: >
          and(eq(dependencies.PlanPublication.result, 'Succeeded'),
          not(failed()), not(canceled()))
        jobs:
          - job: Publish
            timeoutInMinutes: 45
            pool:
              vmImage: ubuntu-24.04
            steps:
              - checkout: self
                fetchDepth: 0
                fetchTags: true
                persistCredentials: false
              - task: DownloadPipelineArtifact@2
                inputs:
                  artifact: release-publication-plan
                  path: $(Pipeline.Workspace)/release-publication-plan
              - bash: |
                  set -euo pipefail
                  test -n "${GH_TOKEN:-}" || exit 1
                  gh auth setup-git
                  python3 - <<'PY'
                  import json
                  import shlex
                  import shutil
                  import subprocess
                  from pathlib import Path

                  root = Path("$(Pipeline.Workspace)/release-publication-plan")
                  if (root / "output").exists():
                      shutil.copytree(
                          root / "output",
                          Path("output"),
                          dirs_exist_ok=True,
                      )
                  plan = json.loads(
                      (root / "publication-plan.json").read_text()
                  )
                  command = plan.get("executionCommand")
                  if command:
                      result = json.loads(
                          subprocess.run(
                              shlex.split(command),
                              check=True,
                              capture_output=True,
                              text=True,
                          ).stdout
                      )
                  else:
                      result = plan
                  if result["nextAction"] != "start-release-milestones":
                      raise SystemExit(
                          f"Publication ended at {result['nextAction']}"
                      )
                  (root / "final-result.json").write_text(
                      json.dumps(result, indent=2) + "\n"
                  )
                  PY
                  echo "##vso[task.uploadfile]$(Pipeline.Workspace)/release-publication-plan/final-result.json"
                displayName: Publish approved GitHub Release
                env:
                  GH_TOKEN: $(github--pat--xamarinreleasemanager)
              - task: PublishPipelineArtifact@1
                inputs:
                  targetPath: $(Pipeline.Workspace)/release-publication-plan
                  artifact: release-final-result

      - stage: PlanAssignments
        displayName: Plan release assignment reconciliation
        dependsOn: PublishRelease
        jobs:
          - job: Plan
            pool:
              vmImage: ubuntu-24.04
            steps:
              - checkout: self
                fetchDepth: 0
                fetchTags: true
              - task: DownloadPipelineArtifact@2
                inputs:
                  artifact: release-final-result
                  path: $(Pipeline.Workspace)/release-final-result
              - bash: |
                  set -euo pipefail
                  test -n "${GH_TOKEN:-}" || exit 1
                  python3 - <<'PY'
                  import json
                  import shlex
                  import subprocess
                  from pathlib import Path

                  root = Path("$(Pipeline.Workspace)/release-final-result")
                  final = json.loads((root / "final-result.json").read_text())
                  command = shlex.split(final["milestonesCommand"])
                  reconcile = json.loads(
                      subprocess.run(
                          command,
                          check=True,
                          capture_output=True,
                          text=True,
                      ).stdout
                  )
                  if reconcile["nextAction"] not in {
