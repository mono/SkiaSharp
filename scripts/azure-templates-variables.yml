variables:
  # NOTE: Update this value when bumping the SkiaSharp version. It must match
  # the SkiaSharp NuGet version in scripts/VERSIONS.txt.
  SKIASHARP_VERSION: 4.152.0
  VERBOSITY: normal
  GIT_SHA: $(Build.SourceVersion)
  GIT_BRANCH_NAME: $(Build.SourceBranch)
  GIT_URL: $(Build.Repository.Uri)
  PREVIEW_LABEL: 'preview.0'
  DOTNET_FINAL_VERSION_KIND: ''
  # Arcade OfficialBuildId uses yyyyMMdd.revision. The product/package build
  # number is derived from this as short-date.revision by set-build-variables.ps1.
  ARCADE_OFFICIAL_BUILD_ID: $[format('{0}.{1}', format('{0:yyyyMMdd}', pipeline.startTime), counter(format('arcade_{0}', format('{0:yyyyMMdd}', pipeline.startTime)), 1))]
  BUILD_NUMBER: ''
  BUILD_COUNTER: $[counter('global_counter', 1)]
  MANAGED_LINUX_PACKAGES: ttf-ancient-fonts ninja-build libgtk-4-1
  XCODE_VERSION: '26.3'
  XCODE_VERSION_NATIVE: '16.2'
  VISUAL_STUDIO_VERSION: ''
  DOTNET_VERSION: '10.0.204'
  # The WinUI C++/WinRT projection uses VS MSBuild 17.x, which cannot load
  # .NET SDK 10.0.2xx+. Install the final 1xx SDK side-by-side for those jobs.
  DOTNET_VERSION_WINUI: '10.0.108'
  # Preview .NET SDK version + its workload set, used by jobs that run tests against a preview
  # runtime. Bump both to the next preview .NET as it moves forward.
  DOTNET_VERSION_PREVIEW: '11.0.100-preview.6.26359.118'
  DOTNET_WORKLOAD_VERSION_PREVIEW: '11.0.100-preview.6.26364.2'
  DOTNET_WORKLOAD_TIZEN: '10.0.100/10.0.123'
  # Keep the last Apple workload set supported by Xcode 26.3 on macOS 15.
  DOTNET_WORKLOAD_VERSION: '10.0.202'
  CONFIGURATION: 'Release'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_DIFF_PRERELEASE: false
  ENABLE_CODE_COVERAGE: true
  EMSCRIPTEN_VERSION: 3.1.56
  Codeql.Enabled: true
  IOS_TEST_DEVICE_VERSION: 26.2
  ANDROID_TEST_DEVICE_VERSION: 36
  ANDROID_PLATFORM_VERSIONS: 21,35,36
  TeamName: .NET MAUI
