parameters:
  - name: buildAgentLinux
    type: object
  # Each entry submits tests/SkiaSharp.Fuzzing/OneFuzzConfig.<config>.json to the OneFuzz pool for <os>.
  - name: submissions
    type: object
    default:
      windows:
        config: windows
        os: Windows
      ubuntu:
        config: ubuntu
        os: ubuntu
      azurelinux:
        config: azurelinux
        os: azurelinux3

stages:
  - stage: fuzzing
    displayName: OneFuzz
    dependsOn: native
    jobs:
      - job: fuzzing
        displayName: OneFuzz
        timeoutInMinutes: 120
        pool: ${{ parameters.buildAgentLinux.pool }}
        workspace:
          clean: all
        steps:
          - checkout: self
            submodules: false
            fetchDepth: 1

          # Linux avoids the macOS-only target frameworks that CI otherwise enables, which need a workload.
          # The harness smoke run loads the Linux native library, which needs fontconfig.
          - bash: |
              sudo apt update
              sudo apt install -y libfontconfig1
            displayName: Install additional package dependencies
            retryCountOnTaskFailure: 3

          - template: /scripts/azure-templates-steps-dotnet.yml@self
            parameters:
              platform: ${{ parameters.buildAgentLinux.pool.os }}
              sdks:
                - sdkVersion: $(DOTNET_VERSION)

          - pwsh: ./scripts/infra/native/shared/patch-dotnet.ps1 -InstallDir "$env:AGENT_TOOLSDIRECTORY/dotnet"
            displayName: Fix the Microsoft.WinFX.* file

          - template: /scripts/azure-templates-steps-download-artifacts.yml@self
            parameters:
              artifacts:
                - name: native

          # Only scheduled builds of main use the production target names.
          - pwsh: ./scripts/infra/security/prepare-onefuzz-drop.ps1
            displayName: Prepare the OneFuzz drop
            ${{ if not(and(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'Schedule'))) }}:
              env:
                ONEFUZZ_VALIDATION_BUILD_ID: $(Build.BuildId)

          # The drop is shared; each submission only differs by its config and OS.
          - ${{ each submission in parameters.submissions }}:
            - pwsh: Copy-Item ./output/onefuzz/OneFuzzConfig.${{ submission.value.config }}.json ./output/onefuzz/OneFuzzConfig.json -Force
              displayName: Select the ${{ submission.key }} OneFuzz config

            - task: onefuzz-task@0
              displayName: Submit the ${{ submission.key }} targets to OneFuzz
              inputs:
                onefuzzOSes: ${{ submission.value.os }}
              env:
                onefuzzDropDirectory: $(Build.SourcesDirectory)/output/onefuzz
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)
