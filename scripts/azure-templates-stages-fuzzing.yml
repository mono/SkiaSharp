parameters:
  - name: buildAgentWindows
    type: object
  - name: buildAgentLinux
    type: object

stages:
  - stage: fuzzing
    displayName: OneFuzz
    dependsOn: package
    jobs:
      - job: fuzzing_windows
        displayName: OneFuzz Windows x64
        timeoutInMinutes: 120
        pool: ${{ parameters.buildAgentWindows.pool }}
        workspace:
          clean: all
        steps:
          - checkout: self
            submodules: false
            fetchDepth: 1

          - task: UseDotNet@2
            displayName: Install .NET $(DOTNET_VERSION)
            inputs:
              packageType: sdk
              version: $(DOTNET_VERSION)

          - task: DownloadPipelineArtifact@2
            displayName: Download native artifacts
            inputs:
              buildType: current
              artifactName: native
              targetPath: $(Build.SourcesDirectory)\output

          - pwsh: |
              $toolDirectory = Join-Path $env:AGENT_TEMPDIRECTORY 'sharpfuzz'
              dotnet tool install --tool-path $toolDirectory SharpFuzz.CommandLine --version 2.3.0
              if ($LASTEXITCODE -ne 0) { throw "Installing SharpFuzz failed with exit code $LASTEXITCODE." }

              $arguments = @{
                Platform = 'windows'
                OutputDirectory = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'OneFuzz'
                SharpFuzzPath = Join-Path $toolDirectory 'sharpfuzz.exe'
              }
              if ($env:BUILD_SOURCEBRANCH -ne 'refs/heads/main' -or $env:BUILD_REASON -ne 'Schedule') {
                $arguments.ValidationBuildId = $env:BUILD_BUILDID
              }

              ./scripts/infra/security/prepare-onefuzz-drop.ps1 @arguments
            displayName: Prepare Windows OneFuzz drop

          - task: onefuzz-task@0
            displayName: Submit Windows targets to OneFuzz
            inputs:
              onefuzzOSes: Windows
            env:
              onefuzzDropDirectory: $(Build.ArtifactStagingDirectory)\OneFuzz
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

          - task: PublishPipelineArtifact@1
            displayName: Retain Windows OneFuzz drop
            condition: succeededOrFailed()
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)\OneFuzz
              artifact: onefuzz_windows

      - job: fuzzing_ubuntu
        displayName: OneFuzz Ubuntu x64
        timeoutInMinutes: 120
        pool: ${{ parameters.buildAgentLinux.pool }}
        workspace:
          clean: all
        steps:
          - checkout: self
            submodules: false
            fetchDepth: 1

          - task: UseDotNet@2
            displayName: Install .NET $(DOTNET_VERSION)
            inputs:
              packageType: sdk
              version: $(DOTNET_VERSION)

          - task: DownloadPipelineArtifact@2
            displayName: Download native artifacts
            inputs:
              buildType: current
              artifactName: native
              targetPath: $(Build.SourcesDirectory)/output

          - bash: |
              sudo apt-get update
              sudo apt-get install -y libfontconfig1
            displayName: Install Linux runtime dependencies

          - pwsh: |
              $toolDirectory = Join-Path $env:AGENT_TEMPDIRECTORY 'sharpfuzz'
              dotnet tool install --tool-path $toolDirectory SharpFuzz.CommandLine --version 2.3.0
              if ($LASTEXITCODE -ne 0) { throw "Installing SharpFuzz failed with exit code $LASTEXITCODE." }

              $arguments = @{
                Platform = 'ubuntu'
                OutputDirectory = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'OneFuzz'
                SharpFuzzPath = Join-Path $toolDirectory 'sharpfuzz'
              }
              if ($env:BUILD_SOURCEBRANCH -ne 'refs/heads/main' -or $env:BUILD_REASON -ne 'Schedule') {
                $arguments.ValidationBuildId = $env:BUILD_BUILDID
              }

              ./scripts/infra/security/prepare-onefuzz-drop.ps1 @arguments
            displayName: Prepare Ubuntu OneFuzz drop

          - task: onefuzz-task@0
            displayName: Submit Ubuntu targets to OneFuzz
            inputs:
              onefuzzOSes: azurelinux3
            env:
              onefuzzDropDirectory: $(Build.ArtifactStagingDirectory)/OneFuzz
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

          - task: PublishPipelineArtifact@1
            displayName: Retain Ubuntu OneFuzz drop
            condition: succeededOrFailed()
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/OneFuzz
              artifact: onefuzz_ubuntu
