parameters:
  - name: buildAgentLinux
    type: object
  # Each entry submits tests/SkiaSharp.Fuzzing/OneFuzzConfig.<config>.json to the OneFuzz pool for <os>.
  - name: submissions
    type: object
    default:
      windows:
        config: windows
        os: Windows
      ubuntu:
        config: ubuntu
        os: ubuntu
      azurelinux:
        config: azurelinux
        os: azurelinux3

stages:
  - stage: fuzzing
    displayName: OneFuzz
    dependsOn: native
    jobs:
      # Builds, instruments and publishes the drop. Nothing here talks to OneFuzz.
      - template: /scripts/azure-templates-jobs-bootstrapper.yml@self
        parameters:
          name: onefuzz_prepare
          displayName: Prepare the OneFuzz drop
          buildAgent: ${{ parameters.buildAgentLinux }}
          target: onefuzz-prepare
          # Only scheduled builds of main use the production target names.
          ${{ if not(and(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'Schedule'))) }}:
            additionalArgs: --validationBuildId=$(Build.BuildId)
          # The Linux native library needs fontconfig for the harness smoke run.
          packages: libfontconfig1
          checkoutSubmodules: false
          installAndroidSdk: false
          installXcode: false
          installNode: false
          shouldPublish: false
          requiredArtifacts:
            - name: native
          publishArtifacts:
            - name: onefuzz
              path: output/onefuzz

      # Runs on a fresh agent: it never builds anything, it only submits the published drop.
      - job: onefuzz_submit
        displayName: Submit to OneFuzz
        dependsOn: onefuzz_prepare
        timeoutInMinutes: 120
        pool: ${{ parameters.buildAgentLinux.pool }}
        workspace:
          clean: all
        steps:
          - checkout: none

          - download: current
            artifact: onefuzz
            displayName: Download the OneFuzz drop

          # Every submission gets its own copy so one submission can never change what another uploads.
          - ${{ each submission in parameters.submissions }}:
            - pwsh: |
                $drop = Join-Path $env:PIPELINE_WORKSPACE 'submit/${{ submission.key }}'
                New-Item -ItemType Directory -Force -Path $drop | Out-Null
                Copy-Item (Join-Path $env:PIPELINE_WORKSPACE 'onefuzz/*') $drop -Recurse -Force
                Copy-Item (Join-Path $drop 'OneFuzzConfig.${{ submission.value.config }}.json') (Join-Path $drop 'OneFuzzConfig.json') -Force
              displayName: Stage the ${{ submission.key }} drop

            - task: onefuzz-task@0
              displayName: Submit the ${{ submission.key }} targets to OneFuzz
              inputs:
                onefuzzOSes: ${{ submission.value.os }}
              env:
                onefuzzDropDirectory: $(Pipeline.Workspace)/submit/${{ submission.key }}
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)
