parameters:
  - name: buildAgentWindows
    type: object
  - name: buildAgentLinux
    type: object
  - name: runFuzzing
    type: boolean
    default: false

stages:
  - stage: fuzzing
    displayName: OneFuzz
    ${{ if and(eq(parameters.runFuzzing, true), ne(variables['Build.SourceBranch'], 'refs/heads/main')) }}:
      dependsOn: native_windows
    ${{ else }}:
      dependsOn: package
    jobs:
      - job: fuzzing_windows
        displayName: OneFuzz Windows x64
        timeoutInMinutes: 120
        pool: ${{ parameters.buildAgentWindows.pool }}
        workspace:
          clean: all
        steps:
          - checkout: self
            submodules: false
            fetchDepth: 1

          - task: UseDotNet@2
            displayName: Install .NET $(DOTNET_VERSION)
            inputs:
              packageType: sdk
              version: $(DOTNET_VERSION)

          - ${{ if and(eq(parameters.runFuzzing, true), ne(variables['Build.SourceBranch'], 'refs/heads/main')) }}:
            - task: DownloadPipelineArtifact@2
              displayName: Download native_win32_x64_windows artifacts
              inputs:
                buildType: current
                artifactName: native_win32_x64_windows
                targetPath: $(Build.SourcesDirectory)\output
          - ${{ else }}:
            - task: DownloadPipelineArtifact@2
              displayName: Download native artifacts
              inputs:
                buildType: current
                artifactName: native
                targetPath: $(Build.SourcesDirectory)\output

          - pwsh: |
              $toolDirectory = Join-Path $env:AGENT_TEMPDIRECTORY 'sharpfuzz'
              dotnet tool install --tool-path $toolDirectory SharpFuzz.CommandLine --version 2.3.0
              if ($LASTEXITCODE -ne 0) { throw "Installing SharpFuzz failed with exit code $LASTEXITCODE." }

              dotnet tool restore
              if ($LASTEXITCODE -ne 0) { throw "Restoring local .NET tools failed with exit code $LASTEXITCODE." }

              $cakeArguments = @(
                '--target=onefuzz-prepare',
                '--platform=windows',
                "--outputDirectory=$([IO.Path]::Combine($env:BUILD_ARTIFACTSTAGINGDIRECTORY, 'OneFuzz'))",
                "--sharpFuzzPath=$([IO.Path]::Combine($toolDirectory, 'sharpfuzz.exe'))"
              )
              if ($env:BUILD_SOURCEBRANCH -ne 'refs/heads/main' -or $env:BUILD_REASON -ne 'Schedule') {
                $cakeArguments += "--validationBuildId=$($env:BUILD_BUILDID)"
              }

              dotnet cake @cakeArguments
              if ($LASTEXITCODE -ne 0) { throw "Preparing the OneFuzz drop via Cake failed with exit code $LASTEXITCODE." }
            displayName: Prepare Windows OneFuzz drop

          - task: onefuzz-task@0
            displayName: Submit Windows targets to OneFuzz
            inputs:
              onefuzzOSes: Windows
            env:
              onefuzzDropDirectory: $(Build.ArtifactStagingDirectory)\OneFuzz
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      - ${{ if not(and(eq(parameters.runFuzzing, true), ne(variables['Build.SourceBranch'], 'refs/heads/main'))) }}:
        - job: fuzzing_ubuntu
          displayName: OneFuzz Ubuntu x64
          timeoutInMinutes: 120
          pool: ${{ parameters.buildAgentLinux.pool }}
          workspace:
            clean: all
          steps:
            - checkout: self
              submodules: false
              fetchDepth: 1

            - task: UseDotNet@2
              displayName: Install .NET $(DOTNET_VERSION)
              inputs:
                packageType: sdk
                version: $(DOTNET_VERSION)

            - task: DownloadPipelineArtifact@2
              displayName: Download native artifacts
              inputs:
                buildType: current
                artifactName: native
                targetPath: $(Build.SourcesDirectory)/output

            - bash: |
                sudo apt-get update
                sudo apt-get install -y libfontconfig1
              displayName: Install Linux runtime dependencies

            - pwsh: |
                $toolDirectory = Join-Path $env:AGENT_TEMPDIRECTORY 'sharpfuzz'
                dotnet tool install --tool-path $toolDirectory SharpFuzz.CommandLine --version 2.3.0
                if ($LASTEXITCODE -ne 0) { throw "Installing SharpFuzz failed with exit code $LASTEXITCODE." }

                dotnet tool restore
                if ($LASTEXITCODE -ne 0) { throw "Restoring local .NET tools failed with exit code $LASTEXITCODE." }

                $cakeArguments = @(
                  '--target=onefuzz-prepare',
                  '--platform=ubuntu',
                  "--outputDirectory=$([IO.Path]::Combine($env:BUILD_ARTIFACTSTAGINGDIRECTORY, 'OneFuzz'))",
                  "--sharpFuzzPath=$([IO.Path]::Combine($toolDirectory, 'sharpfuzz'))"
                )
                if ($env:BUILD_SOURCEBRANCH -ne 'refs/heads/main' -or $env:BUILD_REASON -ne 'Schedule') {
                  $cakeArguments += "--validationBuildId=$($env:BUILD_BUILDID)"
                }

                dotnet cake @cakeArguments
                if ($LASTEXITCODE -ne 0) { throw "Preparing the OneFuzz drop via Cake failed with exit code $LASTEXITCODE." }
              displayName: Prepare Ubuntu OneFuzz drop

            - task: onefuzz-task@0
              displayName: Submit Ubuntu targets to OneFuzz
              inputs:
                onefuzzOSes: azurelinux3
              env:
                onefuzzDropDirectory: $(Build.ArtifactStagingDirectory)/OneFuzz
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)
