parameters:
  - name: skiaOnly
    type: boolean
    default: false
  - name: useInternalMirror
    type: boolean
    default: false

steps:
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      if ($env:USE_INTERNAL_SKIA_MIRROR -eq 'true') {
          if ([string]::IsNullOrWhiteSpace($env:SYSTEM_ACCESSTOKEN)) {
              throw 'System.AccessToken is required to read the internal Skia mirror.'
          }

          # Append to inherited process config; nothing is written to a gitconfig.
          $count = 0
          if ($env:GIT_CONFIG_COUNT) {
              $count = [int]$env:GIT_CONFIG_COUNT
              if ($count -lt 0) {
                  throw 'GIT_CONFIG_COUNT must not be negative.'
              }
          }
          $mirrorUrl = 'https://dev.azure.com/dnceng/internal/_git/mono-skia'
          Set-Item "Env:GIT_CONFIG_KEY_$count" "url.$mirrorUrl.insteadOf"
          Set-Item "Env:GIT_CONFIG_VALUE_$count" 'https://github.com/mono/skia.git'
          $count++
          Set-Item "Env:GIT_CONFIG_KEY_$count" "http.$mirrorUrl.extraheader"
          Set-Item "Env:GIT_CONFIG_VALUE_$count" "AUTHORIZATION: bearer $env:SYSTEM_ACCESSTOKEN"
          $count++
          $env:GIT_CONFIG_COUNT = "$count"
      }

      if ($env:SKIA_ONLY -eq 'true') {
          git submodule update --init --recursive externals/skia
      } else {
          git submodule update --init --recursive
      }
      if ($LASTEXITCODE -ne 0) {
          throw "Submodule checkout failed with exit code $LASTEXITCODE."
      }
    ${{ if eq(parameters.skiaOnly, true) }}:
      displayName: Checkout native build submodules
    ${{ else }}:
      displayName: Full checkout (submodules)
    condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
    env:
      SKIA_ONLY: ${{ parameters.skiaOnly }}
      USE_INTERNAL_SKIA_MIRROR: ${{ parameters.useInternalMirror }}
      ${{ if eq(parameters.useInternalMirror, true) }}:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
