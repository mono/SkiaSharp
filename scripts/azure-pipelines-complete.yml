trigger: none
pr: none

parameters:
  - name: enableCaching
    displayName: 'Enable build caching (skip native builds on cache hit):'
    type: boolean
    default: true
  - name: buildAgentHost
    displayName: 'The generic host build agent configuration:'
    type: object
    default:
      pool:
        name: $(DncEngPublicBuildPool)
        demands: ImageOverride -equals build.ubuntu.2204.amd64.open
        os: linux
  - name: buildAgentWindows
    displayName: 'The Windows build agent configuration:'
    type: object
    default:
      pool:
        name: $(DncEngPublicBuildPool)
        demands: ImageOverride -equals windows.vs2026.amd64.open
        os: windows
  - name: buildAgentWindowsNative
    displayName: 'The Windows build agent configuration for building the native assets:'
    type: object
    default:
      pool:
        name: $(DncEngPublicBuildPool)
        demands: ImageOverride -equals 1es-windows-2022-open
        os: windows
  - name: buildAgentMac
    displayName: 'The macOS build agent configuration:'
    type: object
    default:
      pool:
        name: AcesShared
        demands: ImageOverride -equals ACES_VM_SharedPool_Sequoia
        os: macos
  - name: buildAgentMacNative
    displayName: 'The macOS build agent configuration for building the native assets:'
    type: object
    default:
      pool:
        name: AcesShared
        demands: ImageOverride -equals ACES_VM_SharedPool_Sequoia
        os: macos
  - name: buildAgentLinux
    displayName: 'The Linux build agent configuration:'
    type: object
    default:
      pool:
        name: $(DncEngPublicBuildPool)
        demands: ImageOverride -equals build.ubuntu.2204.amd64.open
        os: linux
  - name: buildAgentLinuxNative
    displayName: 'The Linux build agent configuration for building the native assets:'
    type: object
    default:
      pool:
        name: $(DncEngPublicBuildPool)
        demands: ImageOverride -equals build.ubuntu.2204.amd64.open
        os: linux
  - name: buildAgentAndroidTests
    displayName: 'The build agent configuration for building the Android tests:'
    type: object
    default:
      pool:
        name: Azure Pipelines
        vmImage: ubuntu-24.04
        os: linux

variables:
  - template: /eng/common/templates/variables/pool-providers.yml@self
  - template: /scripts/azure-templates-variables.yml@self

jobs:
  - job: public_windows_tool_inventory
    timeoutInMinutes: 5
    pool:
      name: ${{ parameters.buildAgentWindows.pool.name }}
      demands: ${{ parameters.buildAgentWindows.pool.demands }}
    steps:
      - checkout: none
      - pwsh: |
          $tools = @('llvm-readelf.exe', 'llvm-readobj.exe', 'llvm-nm.exe', 'llvm-ar.exe', 'llvm-pdbutil.exe', 'llvm-objdump.exe')
          foreach ($tool in $tools) {
            $command = Get-Command $tool -CommandType Application -ErrorAction SilentlyContinue
            Write-Host "PATH command $tool : $($command.Source)"
          }
          foreach ($directory in @(
            'C:\Program Files\LLVM\bin',
            'C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\Llvm\x64\bin',
            'C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\Llvm\bin'
          )) {
            Write-Host "Literal directory $directory exists: $(Test-Path -LiteralPath $directory -PathType Container)"
            foreach ($tool in $tools) {
              $path = Join-Path $directory $tool
              $exists = Test-Path -LiteralPath $path -PathType Leaf
              Write-Host "$path exists: $exists"
              if ($exists) {
                & $path --version
                if ($LASTEXITCODE -ne 0) {
                  throw "$path --version failed: $LASTEXITCODE"
                }
              }
            }
          }
        displayName: Inspect only PATH and declared LLVM installation paths
