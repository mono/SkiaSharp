trigger:
  - main
  - release/*

pr:
  - main
  - release/*

parameters:
  - name: enableCaching
    displayName: 'Enable build caching (skip native builds on cache hit):'
    type: boolean
    default: true
  - name: buildAgentHost
    displayName: 'The generic host build agent configuration:'
    type: object
    default:
      pool:
        name: $(DncEngPublicBuildPool)
        demands: ImageOverride -equals build.ubuntu.2204.amd64.open
        os: linux
  - name: buildAgentWindows
    displayName: 'The Windows build agent configuration:'
    type: object
    default:
      pool:
        name: $(DncEngPublicBuildPool)
        demands: ImageOverride -equals windows.vs2026.amd64.open
        os: windows
  - name: buildAgentWindowsNative
    displayName: 'The Windows build agent configuration for building the native assets:'
    type: object
    default:
      pool:
        name: $(DncEngPublicBuildPool)
        demands: ImageOverride -equals 1es-windows-2022-open
        os: windows
  - name: buildAgentMac
    displayName: 'The macOS build agent configuration:'
    type: object
    default:
      pool:
        name: AcesShared
        demands: ImageOverride -equals ACES_VM_SharedPool_Sequoia
        os: macos
  - name: buildAgentMacNative
    displayName: 'The macOS build agent configuration for building the native assets:'
    type: object
    default:
      pool:
        name: AcesShared
        demands: ImageOverride -equals ACES_VM_SharedPool_Sequoia
        os: macos
  - name: buildAgentLinux
    displayName: 'The Linux build agent configuration:'
    type: object
    default:
      pool:
        name: $(DncEngPublicBuildPool)
        demands: ImageOverride -equals build.ubuntu.2204.amd64.open
        os: linux
  - name: buildAgentLinuxNative
    displayName: 'The Linux build agent configuration for building the native assets:'
    type: object
    default:
      pool:
        name: $(DncEngPublicBuildPool)
        demands: ImageOverride -equals build.ubuntu.2204.amd64.open
        os: linux
  - name: buildAgentAndroidTests
    displayName: 'The build agent configuration for building the Android tests:'
    type: object
    default:
      pool:
        name: Azure Pipelines
        vmImage: ubuntu-24.04
        os: linux

variables:
  - template: /eng/common/templates/variables/pool-providers.yml@self
  - template: /scripts/azure-templates-variables.yml@self

extends:
  template: /scripts/azure-template-fake-1es.yml@self
  parameters:
    pool: ${{ parameters.buildAgentHost.pool }}
    stages:
      - template: /scripts/azure-templates-stages.yml@self
        parameters:
          buildPipelineType: 'complete'
          buildAgentHost: ${{ parameters.buildAgentHost }}
          buildAgentWindows: ${{ parameters.buildAgentWindows }}
          buildAgentWindowsNative: ${{ parameters.buildAgentWindowsNative }}
          buildAgentMac: ${{ parameters.buildAgentMac }}
          buildAgentMacNative: ${{ parameters.buildAgentMacNative }}
          buildAgentLinux: ${{ parameters.buildAgentLinux }}
          buildAgentLinuxNative: ${{ parameters.buildAgentLinuxNative }}
          buildAgentAndroidTests: ${{ parameters.buildAgentAndroidTests }}
          enableCaching: ${{ parameters.enableCaching }}

      - stage: samples_macos_diagnostics
        displayName: Samples macOS environment diagnostics (temporary)
        dependsOn: []
        jobs:
          - job: docker_environment
            displayName: Inspect Docker availability on the macOS sample image
            pool: ${{ parameters.buildAgentMac.pool }}
            timeoutInMinutes: 5
            steps:
              - checkout: none
              - bash: |
                  set -eu
                  sw_vers
                  uname -m
                  echo "Initial PATH: $PATH"
                  for dockerBin in /usr/local/bin /opt/homebrew/bin /Applications/Docker.app/Contents/Resources/bin; do
                    if [ -x "$dockerBin/docker" ]; then
                      echo "Installed Docker CLI: $dockerBin/docker"
                    fi
                  done
                  if ! command -v docker >/dev/null 2>&1; then
                    for dockerBin in /usr/local/bin /opt/homebrew/bin /Applications/Docker.app/Contents/Resources/bin; do
                      if [ -x "$dockerBin/docker" ]; then
                        export PATH="$dockerBin:$PATH"
                        break
                      fi
                    done
                  fi
                  if ! command -v docker >/dev/null 2>&1; then
                    HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install docker
                  fi
                  command -v docker
                  python3 - <<'PY'
                  import subprocess

                  probes = [
                      ["docker", "--version"],
                      ["docker", "context", "show"],
                      ["docker", "version"],
                      ["docker", "info", "--format", "OS={{.OSType}} Architecture={{.Architecture}} ServerVersion={{.ServerVersion}}"],
                  ]
                  for command in probes:
                      print("Probe: " + " ".join(command), flush=True)
                      try:
                          result = subprocess.run(command, timeout=30, check=False)
                      except subprocess.TimeoutExpired:
                          print("##vso[task.logissue type=warning]Docker probe exceeded 30 seconds.", flush=True)
                          continue
                      print("Exit code: " + str(result.returncode), flush=True)
                      if result.returncode != 0:
                          print("##vso[task.logissue type=warning]Docker probe failed; see its output above.", flush=True)
                  PY
                displayName: Install Docker CLI and probe the existing daemon
