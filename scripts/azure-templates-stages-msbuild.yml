parameters:
  - name: buildPipelineType
    type: string
  - name: buildAgentWindows
    type: object
  - name: buildAgentMac
    type: object
  - name: buildAgentLinux
    type: object

stages:
  - stage: msbuild_tests
    displayName: MSBuild package tests
    ${{ if eq(parameters.buildPipelineType, 'test') }}:
      dependsOn: prepare
    ${{ else }}:
      dependsOn: package
    jobs:
      - ${{ each platform in split('windows,macos,linux', ',') }}:
        - ${{ each sdk in split('stable,preview', ',') }}:
          - template: /scripts/azure-templates-jobs-bootstrapper.yml@self
            parameters:
              name: tests_msbuild_${{ platform }}_${{ sdk }}
              ${{ if eq(platform, 'windows') }}:
                displayName: Windows (${{ sdk }})
                buildAgent: ${{ parameters.buildAgentWindows }}
              ${{ if eq(platform, 'macos') }}:
                displayName: macOS (${{ sdk }})
                buildAgent: ${{ parameters.buildAgentMac }}
              ${{ if eq(platform, 'linux') }}:
                displayName: Linux (${{ sdk }})
                buildAgent: ${{ parameters.buildAgentLinux }}
              ${{ if eq(sdk, 'stable') }}:
                installDotNetWorkloads: true
                installAndroidSdk: true
                installXcode: true
                jdkVersion: '21.0.10'
                jdkFolderVersion: '21.0.10+7'
                ${{ if eq(platform, 'windows') }}:
                  dotnetWorkloads: wasm-tools,maui-android,maui-windows
                ${{ if eq(platform, 'macos') }}:
                  dotnetWorkloads: wasm-tools,maui-android,maui-ios,maui-maccatalyst
                ${{ if eq(platform, 'linux') }}:
                  dotnetWorkloads: wasm-tools,maui-android
              ${{ else }}:
                installDotNetWorkloads: false
                installAndroidSdk: false
                installXcode: false
                installPreviewSdk: true
                previewWorkloads: wasm-tools
                additionalArgs: --wasm=true
              target: tests-msbuild
              retryCount: 0
              shouldPublish: false
              checkoutSubmodules: false
              installAndroidNdk: false
              installNode: false
              installLlvm: false
              installEmsdk: false
              installNinja: false
              requiredArtifacts:
                - name: nuget
                  dir: nugets
              postBuildSteps:
                - task: PublishTestResults@2
                  displayName: Publish MSBuild package test results
                  condition: always()
                  inputs:
                    testResultsFormat: VSTest
                    testResultsFiles: 'output/logs/testlogs/msbuild/**/*.trx'
                    testRunTitle: '${{ platform }} (${{ sdk }}) MSBuild package tests'
                    failTaskOnFailedTests: true
                    failTaskOnMissingResultsFile: true
              publishArtifacts:
                - name: testlogs_msbuild_${{ platform }}_${{ sdk }}
                  always: true
                  path: output/logs
