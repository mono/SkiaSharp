parameters:
  - name: buildPipelineType
    type: string
  - name: buildAgentWindows
    type: object
  - name: buildAgentMac
    type: object
  - name: buildAgentLinux
    type: object
  - name: sdkLanes
    type: object
    default:
      - suffix: ''
        displayName: ''
        installPreviewSdk: false
        sdkVersion: $(DOTNET_VERSION)
      - suffix: _net11
        displayName: ' .NET 11'
        installPreviewSdk: true
        sdkVersion: '11.0.100-rc.1.26425.128'

stages:
  - stage: msbuild_tests
    displayName: MSBuild package tests
    ${{ if eq(parameters.buildPipelineType, 'test') }}:
      dependsOn: prepare
    ${{ else }}:
      dependsOn: package
    jobs:
      - ${{ each lane in parameters.sdkLanes }}:
        - ${{ each platform in split('windows,macos,linux', ',') }}:
          - template: /scripts/azure-templates-jobs-bootstrapper.yml@self
            parameters:
              name: tests_msbuild_${{ platform }}${{ lane.suffix }}
              ${{ if eq(platform, 'windows') }}:
                displayName: Windows${{ lane.displayName }}
                buildAgent: ${{ parameters.buildAgentWindows }}
              ${{ if eq(platform, 'macos') }}:
                displayName: macOS${{ lane.displayName }}
                buildAgent: ${{ parameters.buildAgentMac }}
              ${{ if eq(platform, 'linux') }}:
                displayName: Linux${{ lane.displayName }}
                buildAgent: ${{ parameters.buildAgentLinux }}
              target: tests-msbuild
              retryCount: 0
              shouldPublish: false
              checkoutSubmodules: false
              installDotNetWorkloads: false
              installPreviewSdk: ${{ lane.installPreviewSdk }}
              previewSdkVersion: ${{ lane.sdkVersion }}
              previewSdkRollForward: disable
              installAndroidSdk: false
              installAndroidNdk: false
              installXcode: false
              installNode: false
              installLlvm: false
              installEmsdk: false
              installNinja: false
              requiredArtifacts:
                - name: nuget
                  dir: nugets
              postBuildSteps:
                - task: PublishTestResults@2
                  displayName: Publish MSBuild package test results
                  condition: always()
                  inputs:
                    testResultsFormat: VSTest
                    testResultsFiles: 'output/logs/testlogs/msbuild/**/*.trx'
                    testRunTitle: '${{ platform }}${{ lane.displayName }} MSBuild package tests'
                    failTaskOnFailedTests: true
                    failTaskOnMissingResultsFile: true
              publishArtifacts:
                - name: testlogs_msbuild_${{ platform }}${{ lane.suffix }}
                  always: true
                  path: output/logs
