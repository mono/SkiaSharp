parameters:
  - name: buildPipelineType
    type: string
  - name: buildAgentWindows
    type: object
  - name: buildAgentMac
    type: object
  - name: buildAgentLinux
    type: object

stages:
  - stage: msbuild_tests
    displayName: MSBuild package tests
    ${{ if eq(parameters.buildPipelineType, 'test') }}:
      dependsOn: prepare
    ${{ else }}:
      dependsOn: package
    jobs:
      - ${{ each platform in split('windows,macos,linux', ',') }}:
        - template: /scripts/azure-templates-jobs-bootstrapper.yml@self
          parameters:
            name: tests_msbuild_${{ platform }}
            ${{ if eq(platform, 'windows') }}:
              displayName: Windows
              buildAgent: ${{ parameters.buildAgentWindows }}
              dotnetWorkloads: wasm-tools,maui-android,maui-windows
            ${{ if eq(platform, 'macos') }}:
              displayName: macOS
              buildAgent: ${{ parameters.buildAgentMac }}
              dotnetWorkloads: wasm-tools,maui-android,maui-ios,maui-maccatalyst
            ${{ if eq(platform, 'linux') }}:
              displayName: Linux
              buildAgent: ${{ parameters.buildAgentLinux }}
              dotnetWorkloads: wasm-tools,maui-android
            target: tests-msbuild
            retryCount: 0
            shouldPublish: false
            checkoutSubmodules: false
            installDotNetWorkloads: true
            installAndroidSdk: true
            installAndroidNdk: false
            installXcode: true
            installNode: false
            installLlvm: false
            installEmsdk: false
            installNinja: false
            requiredArtifacts:
              - name: nuget
                dir: nugets
            preBuildSteps:
              - task: JavaToolInstaller@0
                displayName: Select JDK 21 for .NET 10 Android consumers
                inputs:
                  versionSpec: '21'
                  jdkArchitectureOption: x64
                  jdkSourceOption: PreInstalled
            postBuildSteps:
              # Install RC1 only after the stable, unfiltered desktop + WASM + MAUI run.
              # The repository SDK stays pinned to .NET 10 for Cake and the test runner.
              - task: UseDotNet@2
                displayName: Install public .NET 11 RC1 consumer SDK
                inputs:
                  packageType: sdk
                  version: '11.0.100-rc.1.26425.128'
              - pwsh: |
                  $ErrorActionPreference = 'Stop'
                  $installer = Join-Path $PWD 'scripts/infra/managed/install-dotnet-workloads.ps1'
                  $directory = Join-Path $PWD 'output/msbuild-rc1-sdk'
                  New-Item -ItemType Directory -Force $directory | Out-Null
                  @{ sdk = @{ version = '11.0.100-rc.1.26425.128'; allowPrerelease = $true; rollForward = 'disable' } } |
                    ConvertTo-Json | Set-Content (Join-Path $directory 'global.json')
                  Push-Location $directory
                  try {
                    dotnet --version
                    if ($LASTEXITCODE -ne 0) { throw 'RC1 SDK selection failed.' }
                    & $installer -Workloads 'wasm-tools' -WorkloadSetVersion '11.0.100-rc.1.26458.5' -Tizen ''
                    if ($LASTEXITCODE -ne 0) { throw 'RC1 wasm-tools installation failed.' }
                  } finally {
                    Pop-Location
                  }
                displayName: Install RC1 wasm-tools without switching the stable runner SDK
              - pwsh: |
                  dotnet cake --target=tests-msbuild --wasm=true --consumerSdkVersion=11.0.100-rc.1.26425.128 --verbosity=$(VERBOSITY) --configuration=$(CONFIGURATION)
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                displayName: Run net11 WASM-only native package regression with the net10 runner
              - task: PublishTestResults@2
                displayName: Publish MSBuild package test results
                condition: always()
                inputs:
                  testResultsFormat: VSTest
                  testResultsFiles: 'output/logs/testlogs/msbuild/**/*.trx'
                  testRunTitle: '${{ platform }} MSBuild package tests'
                  failTaskOnFailedTests: true
                  failTaskOnMissingResultsFile: true
            publishArtifacts:
              - name: testlogs_msbuild_${{ platform }}
                always: true
                path: output/logs
