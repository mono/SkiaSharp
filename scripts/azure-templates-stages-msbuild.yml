parameters:
  - name: buildPipelineType
    type: string
  - name: buildAgentWindows
    type: object
  - name: buildAgentMac
    type: object
  - name: buildAgentLinux
    type: object
  - name: builds
    type: object
    default:
      - name: stable
        parameters: {}
      - name: preview
        parameters:
          installDotNetWorkloads: false
          installPreviewSdk: true

stages:
  - stage: msbuild_tests
    displayName: MSBuild package tests
    ${{ if eq(parameters.buildPipelineType, 'test') }}:
      dependsOn: prepare
    ${{ else }}:
      dependsOn: package
    jobs:
      - ${{ each agent in parameters }}:
        - ${{ if startsWith(agent.key, 'buildAgent') }}:
          - ${{ each build in parameters.builds }}:
            - template: /scripts/azure-templates-jobs-bootstrapper.yml@self
              parameters:
                name: tests_msbuild_${{ agent.value.pool.os }}_${{ build.name }}
                displayName: ${{ agent.value.pool.os }} (${{ build.name }})
                buildAgent: ${{ agent.value }}
                ${{ insert }}: ${{ build.parameters }}
                target: tests-msbuild
                retryCount: 0
                shouldPublish: false
                checkoutSubmodules: false
                installAndroidNdk: false
                installNode: false
                installLlvm: false
                installEmsdk: false
                installNinja: false
                requiredArtifacts:
                  - name: nuget
                    dir: nugets
                postBuildSteps:
                  - task: PublishTestResults@2
                    displayName: Publish MSBuild package test results
                    condition: always()
                    inputs:
                      testResultsFormat: VSTest
                      testResultsFiles: 'output/logs/testlogs/msbuild/**/*.trx'
                      testRunTitle: '${{ agent.value.pool.os }} (${{ build.name }}) MSBuild package tests'
                      failTaskOnFailedTests: true
                      failTaskOnMissingResultsFile: true
                publishArtifacts:
                  - name: testlogs_msbuild_${{ agent.value.pool.os }}_${{ build.name }}
                    always: true
                    path: output/logs
