trigger: none

pr: none

schedules:
  - cron: "0 0 * * *"
    displayName: Daily midnight build for main
    branches:
      include:
        - main
    always: true

parameters:
  - name: buildAgentHost
    displayName: 'The generic host build agent configuration:'
    type: object
    default:
      pool:
        name: NetCore1ESPool-Internal
        demands:
          - ImageOverride -equals 1es-windows-2022
        os: windows
  - name: buildAgentWindows
    displayName: 'The Windows build agent configuration:'
    type: object
    default:
      pool:
        name: NetCore1ESPool-Internal
        demands:
          - ImageOverride -equals 1es-windows-2022
        os: windows
  - name: buildAgentMac
    displayName: 'The macOS build agent configuration:'
    type: object
    default:
      pool:
        name: Azure Pipelines
        vmImage: macos-15
        os: macos
  - name: buildAgentLinux
    displayName: 'The Linux build agent configuration:'
    type: object
    default:
      pool:
        name: NetCore1ESPool-Internal
        demands:
          - ImageOverride -equals 1es-ubuntu-2204
        os: linux
  - name: runApiScan
    displayName: 'Run API Scan'
    type: boolean
    default: false
  - name: forceRealSigning
    displayName: 'Ignore all logic and force Real signing on binaries'
    type: boolean
    default: false

variables:
  - template: /scripts/azure-templates-variables.yml@self

resources:
  repositories:
    - repository: 1ESTemplates
      type: git
      name: 1ESPipelineTemplates/MicroBuildTemplate
  pipelines:
    - pipeline: SkiaSharp
      source: skiasharp-native
      trigger: true

extends:
  template: azure-pipelines/MicroBuild.1ES.Official.yml@1ESTemplates
  parameters:
    pool: ${{ parameters.buildAgentHost.pool }}
    settings:
      networkIsolationPolicy: Permissive, CFSClean, CFSClean2
    customBuildTags:
      - ES365AIMigrationTooling
    sdl:
      binskim:
        enabled: true
        break: false
      codeInspector:
        enabled: true
      credscan:
        enabled: true
      policheck:
        enabled: true
        exclusionsFile: $(Build.SourcesDirectory)/scripts/infra/security/PoliCheckExclusions.xml
      spotBugs:
        enabled: false
      suppression:
        suppressionFile: $(Build.SourcesDirectory)/scripts/infra/security/source.gdnsuppress
      tsa:
        enabled: true
        configFile: $(Build.SourcesDirectory)/scripts/infra/security/tsaoptions-v2.json
    stages:
      - template: /scripts/azure-templates-stages.yml@self
        parameters:
          buildPipelineType: 'package'
          # Phase 2 (dnceng): signing OFF until MicroBuild-native signing is wired
          # up (the old DevDiv Xamarin.yaml-templates sign-artifacts job is dropped).
          use1ESPipelineTemplates: true
          buildAgentHost: ${{ parameters.buildAgentHost }}
          buildAgentWindows: ${{ parameters.buildAgentWindows }}
          buildAgentMac: ${{ parameters.buildAgentMac }}
          buildAgentLinux: ${{ parameters.buildAgentLinux }}
