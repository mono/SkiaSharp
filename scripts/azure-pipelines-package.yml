trigger:
  branches:
    include:
      - main
      - develop
      - release/*
  paths:
    exclude:
      - .devcontainer/**
      - .github/**
      - .vscode/**
      - documentation/docfx/releases/**
      - README.md

pr: none

schedules:
  - cron: "0 0 * * *"
    displayName: Daily midnight build for main
    branches:
      include:
        - main
    always: true

parameters:
  - name: buildAgentHost
    displayName: 'The generic host build agent configuration:'
    type: object
    default:
      pool:
        name: NetCore1ESPool-Internal
        image: 1es-windows-2022
        os: windows
  - name: buildAgentWindows
    displayName: 'The Windows build agent configuration:'
    type: object
    default:
      pool:
        name: NetCore1ESPool-Internal
        image: 1es-windows-2022
        os: windows
  - name: buildAgentWindowsNative
    displayName: 'The Windows build agent configuration for building the native assets:'
    type: object
    default:
      pool:
        name: NetCore1ESPool-Internal
        image: 1es-windows-2022
        os: windows
  - name: buildAgentMac
    displayName: 'The macOS build agent configuration:'
    type: object
    default:
      pool:
        name: GitHub-hosted Agents
        vmImage: macos-26-arm64
        os: macos
  - name: buildAgentMacNative
    displayName: 'The macOS build agent configuration for building the native assets:'
    type: object
    default:
      pool:
        name: Azure Pipelines
        vmImage: macos-14
        os: macos
  - name: buildAgentLinux
    displayName: 'The Linux build agent configuration:'
    type: object
    default:
      pool:
        name: NetCore1ESPool-Internal
        image: 1es-ubuntu-2204
        os: linux
  - name: buildAgentLinuxNative
    displayName: 'The Linux build agent configuration for building the native assets:'
    type: object
    default:
      pool:
        name: NetCore1ESPool-Internal
        image: 1es-ubuntu-2204
        os: linux
  - name: runApiScan
    displayName: 'Run API Scan for this build (scheduled main builds run automatically)'
    type: boolean
    default: false
  - name: forceRealSigning
    displayName: 'Ignore branch selection and force ESRP real signing'
    type: boolean
    default: false
  - name: registerInBar
    displayName: 'Register a forced real-sign build in BAR'
    type: boolean
    default: false

variables:
  - template: /scripts/azure-templates-variables.yml@self

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool: ${{ parameters.buildAgentHost.pool }}
    settings:
      # Temporary during migration: collect required egress without blocking
      # official builds. Switch to Enforce after mirrors/allowlisting are ready.
      networkIsolationMode: Audit
    customBuildTags:
      - ES365AIMigrationTooling
    sdl:
      armory:
        break: true
      binskim:
        enabled: true
        break: true
      codeql:
        compiled:
          enabled: true
        enabledOnNonDefaultBranches: true
      codeInspector:
        enabled: true
      credscan:
        enabled: true
        break: true
      eslint:
        break: true
      policheck:
        enabled: true
        break: true
        exclusionsFile: $(Build.SourcesDirectory)/scripts/infra/security/PoliCheckExclusions.xml
      psscriptanalyzer:
        enabled: true
        break: true
      spotBugs:
        enabled: false
      suppression:
        suppressionFile: $(Build.SourcesDirectory)/scripts/infra/security/source.gdnsuppress
      tsa:
        enabled: true
        configFile: $(Build.SourcesDirectory)/scripts/infra/security/tsaoptions-v2.json
    stages:
      - template: /scripts/azure-templates-stages.yml@self
        parameters:
          buildPipelineType: 'build'
          use1ESPipelineTemplates: true
          buildAgentHost: ${{ parameters.buildAgentHost }}
          buildAgentWindows: ${{ parameters.buildAgentWindows }}
          buildAgentWindowsNative: ${{ parameters.buildAgentWindowsNative }}
          buildAgentMac: ${{ parameters.buildAgentMac }}
          buildAgentMacNative: ${{ parameters.buildAgentMacNative }}
          buildAgentLinux: ${{ parameters.buildAgentLinux }}
          buildAgentLinuxNative: ${{ parameters.buildAgentLinuxNative }}
          forceRealSigning: ${{ parameters.forceRealSigning }}
          registerInBar: ${{ parameters.registerInBar }}
          runApiScan: ${{ parameters.runApiScan }}
