trigger: none

pr: none

schedules:
  - cron: "0 0 * * *"
    displayName: Daily midnight build for main
    branches:
      include:
        - main
    always: true

parameters:
  - name: buildAgentHost
    displayName: 'The generic host build agent configuration:'
    type: object
    default:
      pool:
        name: NetCore1ESPool-Internal
        image: 1es-windows-2022
        os: windows
  - name: buildAgentWindows
    displayName: 'The Windows build agent configuration:'
    type: object
    default:
      pool:
        name: NetCore1ESPool-Internal
        image: 1es-windows-2022
        os: windows
  - name: buildAgentMac
    displayName: 'The macOS build agent configuration:'
    type: object
    default:
      pool:
        name: Azure Pipelines
        vmImage: macos-15
        os: macos
  - name: buildAgentLinux
    displayName: 'The Linux build agent configuration:'
    type: object
    default:
      pool:
        name: NetCore1ESPool-Internal
        image: 1es-ubuntu-2204
        os: linux
  - name: runApiScan
    displayName: 'Run API Scan'
    type: boolean
    default: false
  - name: forceRealSigning
    displayName: 'Ignore branch selection and force ESRP real signing'
    type: boolean
    default: false
  - name: testsPipelineId
    displayName: 'The downstream tests pipeline ID'
    type: number
    default: 1630

variables:
  - template: /scripts/azure-templates-variables.yml@self

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
  pipelines:
    - pipeline: SkiaSharp
      source: skiasharp-native
      trigger: true

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool: ${{ parameters.buildAgentHost.pool }}
    settings:
      networkIsolationPolicy: Permissive, CFSClean, CFSClean2
    customBuildTags:
      - ES365AIMigrationTooling
    sdl:
      armory:
        break: true
      binskim:
        enabled: true
        break: true
      codeql:
        compiled:
          enabled: true
        enabledOnNonDefaultBranches: true
      codeInspector:
        enabled: true
      credscan:
        enabled: true
        break: true
      eslint:
        break: true
      policheck:
        enabled: true
        break: true
        exclusionsFile: $(Build.SourcesDirectory)/scripts/infra/security/PoliCheckExclusions.xml
      psscriptanalyzer:
        enabled: true
        break: true
      spotBugs:
        enabled: false
      suppression:
        suppressionFile: $(Build.SourcesDirectory)/scripts/infra/security/source.gdnsuppress
      tsa:
        enabled: true
        configFile: $(Build.SourcesDirectory)/scripts/infra/security/tsaoptions-v2.json
    stages:
      - template: /scripts/azure-templates-stages.yml@self
        parameters:
          buildPipelineType: 'package'
          enableSigning: ${{ and(eq(variables['System.TeamProject'], 'internal'), ne(variables['Build.Reason'], 'PullRequest')) }}
          forceRealSigning: ${{ parameters.forceRealSigning }}
          buildAgentHost: ${{ parameters.buildAgentHost }}
          buildAgentWindows: ${{ parameters.buildAgentWindows }}
          buildAgentMac: ${{ parameters.buildAgentMac }}
          buildAgentLinux: ${{ parameters.buildAgentLinux }}
      - ${{ if or(eq(parameters.runApiScan, 'true'), and(eq(variables['Build.Reason'], 'Schedule'), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')))) }}:
        - template: /scripts/azure-templates-stages-apiscan.yml@self
          parameters:
            buildAgentWindows: ${{ parameters.buildAgentWindows }}
      - stage: trigger_tests
        displayName: Trigger Tests
        dependsOn: package
        condition: and(succeeded(), eq(variables['System.TeamProject'], 'internal'), eq(variables['Build.SourceBranch'], 'refs/heads/dev/dnceng-pipelines'))
        jobs:
          - job: trigger_tests
            displayName: Trigger Tests
            timeoutInMinutes: 10
            pool: ${{ parameters.buildAgentHost.pool }}
            steps:
              - checkout: none
              - pwsh: |
                  if (-not $env:SYSTEM_ACCESSTOKEN) {
                    throw "System.AccessToken is unavailable."
                  }

                  $uri = "$(System.CollectionUri)$(System.TeamProject)/_apis/pipelines/${{ parameters.testsPipelineId }}/runs?api-version=7.1"
                  $body = @{
                    resources = @{
                      repositories = @{
                        self = @{
                          refName = "$(Build.SourceBranch)"
                          version = "$(Build.SourceVersion)"
                        }
                      }
                      pipelines = @{
                        SkiaSharp = @{
                          runId = [int]"$(Build.BuildId)"
                        }
                      }
                    }
                  } | ConvertTo-Json -Depth 6

                  $response = Invoke-RestMethod `
                    -Method Post `
                    -Uri $uri `
                    -ContentType "application/json" `
                    -Headers @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" } `
                    -Body $body

                  if (-not $response.id) {
                    throw "The tests pipeline did not return a run ID."
                  }

                  Write-Host "Queued tests run $($response.id)."
                displayName: Queue tests with current package artifacts
                env:
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)
