trigger:
  branches:
    include:
      - main
      - develop
      - release/*
  paths:
    exclude:
      - .devcontainer/**
      - .github/**
      - .vscode/**
      - documentation/docfx/releases/**
      - README.md

pr: none

schedules:
  - cron: "0 0 * * *"
    displayName: Daily midnight build for main
    branches:
      include:
        - main
    always: true

parameters:
  - name: buildAgentHost
    displayName: 'The generic host build agent configuration:'
    type: object
    default:
      pool:
        name: NetCore1ESPool-Internal
        image: 1es-windows-2022
        os: windows
  - name: buildAgentWindows
    displayName: 'The Windows build agent configuration:'
    type: object
    default:
      pool:
        name: NetCore1ESPool-Internal
        image: 1es-windows-2022
        os: windows
  - name: buildAgentWindowsNative
    displayName: 'The Windows build agent configuration for building the native assets:'
    type: object
    default:
      pool:
        name: NetCore1ESPool-Internal
        image: 1es-windows-2022
        os: windows
  - name: buildAgentMac
    displayName: 'The macOS build agent configuration:'
    type: object
    default:
      pool:
        name: Azure Pipelines
        vmImage: macos-15
        os: macos
  - name: buildAgentMacNative
    displayName: 'The macOS build agent configuration for building the native assets:'
    type: object
    default:
      pool:
        name: Azure Pipelines
        vmImage: macos-14
        os: macos
  - name: buildAgentLinux
    displayName: 'The Linux build agent configuration:'
    type: object
    default:
      pool:
        name: NetCore1ESPool-Internal
        image: 1es-ubuntu-2204
        os: linux
  - name: buildAgentLinuxNative
    displayName: 'The Linux build agent configuration for building the native assets:'
    type: object
    default:
      pool:
        name: NetCore1ESPool-Internal
        image: 1es-ubuntu-2204
        os: linux
  - name: runApiScan
    displayName: 'Run API Scan'
    type: boolean
    default: false
  - name: auditNetworkIsolation
    displayName: 'Audit network isolation for a manual feature-branch diagnostic run'
    type: boolean
    default: false
  - name: forceRealSigning
    displayName: 'Ignore branch selection and force ESRP real signing'
    type: boolean
    default: false

variables:
  - template: /scripts/azure-templates-variables.yml@self

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool: ${{ parameters.buildAgentHost.pool }}
    settings:
      ${{ if and(eq(parameters.auditNetworkIsolation, true), eq(variables['Build.Reason'], 'Manual'), startsWith(variables['Build.SourceBranch'], 'refs/heads/'), ne(variables['Build.SourceBranch'], 'refs/heads/main'), not(startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))) }}:
        networkIsolationMode: Audit
      ${{ else }}:
        networkIsolationMode: Enforce
      networkIsolationPolicy: Permissive, CFSClean, CFSClean2
    customBuildTags:
      - ES365AIMigrationTooling
    sdl:
      armory:
        break: true
      binskim:
        enabled: true
        break: true
      codeql:
        compiled:
          enabled: true
        enabledOnNonDefaultBranches: true
      codeInspector:
        enabled: true
      credscan:
        enabled: true
        break: true
      eslint:
        break: true
      policheck:
        enabled: true
        break: true
        exclusionsFile: $(Build.SourcesDirectory)/scripts/infra/security/PoliCheckExclusions.xml
      psscriptanalyzer:
        enabled: true
        break: true
      spotBugs:
        enabled: false
      suppression:
        suppressionFile: $(Build.SourcesDirectory)/scripts/infra/security/source.gdnsuppress
      tsa:
        enabled: true
        configFile: $(Build.SourcesDirectory)/scripts/infra/security/tsaoptions-v2.json
    stages:
      - template: /scripts/azure-templates-stages.yml@self
        parameters:
          buildPipelineType: 'build'
          use1ESPipelineTemplates: true
          buildAgentHost: ${{ parameters.buildAgentHost }}
          buildAgentWindows: ${{ parameters.buildAgentWindows }}
          buildAgentWindowsNative: ${{ parameters.buildAgentWindowsNative }}
          buildAgentMac: ${{ parameters.buildAgentMac }}
          buildAgentMacNative: ${{ parameters.buildAgentMacNative }}
          buildAgentLinux: ${{ parameters.buildAgentLinux }}
          buildAgentLinuxNative: ${{ parameters.buildAgentLinuxNative }}
      - ${{ if and(eq(variables['System.TeamProject'], 'internal'), ne(variables['Build.Reason'], 'PullRequest'), not(startsWith(variables['Build.SourceBranch'], 'refs/pull/'))) }}:
        - stage: signing
          displayName: Sign NuGets
          dependsOn: package
          jobs:
            - template: /scripts/azure-templates-jobs-signing.yml@self
              parameters:
                buildAgent: ${{ parameters.buildAgentWindows }}
                enablePublishing: ${{ or(eq(parameters.forceRealSigning, 'true'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')) }}
                ${{ if or(eq(parameters.forceRealSigning, 'true'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')) }}:
                  useRealSigning: true
                ${{ else }}:
                  useRealSigning: false
      - ${{ if or(eq(parameters.runApiScan, 'true'), and(eq(variables['System.TeamProject'], 'internal'), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')))) }}:
        - stage: api_scan
          displayName: API Scan
          dependsOn: package
          jobs:
            - template: /scripts/azure-templates-jobs-apiscan.yml@self
              parameters:
                buildAgentWindows: ${{ parameters.buildAgentWindows }}
      - ${{ if and(eq(variables['System.TeamProject'], 'internal'), ne(variables['Build.Reason'], 'PullRequest'), not(startsWith(variables['Build.SourceBranch'], 'refs/pull/')), or(eq(parameters.forceRealSigning, 'true'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))) }}:
        - stage: publish_build_assets
          displayName: Register signed packages in BAR
          dependsOn:
            - signing
            - ${{ if or(eq(parameters.runApiScan, 'true'), and(eq(variables['System.TeamProject'], 'internal'), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')))) }}:
              - api_scan
          jobs:
            - template: /eng/common/templates-official/job/publish-build-assets.yml@self
              parameters:
                publishingVersion: 3
                officialBuildId: $(ARCADE_OFFICIAL_BUILD_ID)
        - template: /eng/common/templates-official/post-build/post-build.yml@self
          parameters:
            publishingInfraVersion: 3
            requireDefaultChannels: true
            validateDependsOn:
              - publish_build_assets
