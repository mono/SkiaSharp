parameters:
  - name: buildAgentLinuxNative
    type: object
  - name: use1ESPipelineTemplates
    type: boolean
  - name: enableCaching
    type: boolean
    default: false

stages:

  - stage: native_wasm
    displayName: Native WASM
    dependsOn: prepare
    jobs:
      - template: /scripts/azure-templates-jobs-wasm-matrix.yml@self # Build Native WASM (Linux)
        parameters:
          enableCaching: ${{ parameters.enableCaching }}
          buildAgent: ${{ parameters.buildAgentLinuxNative }}
          use1ESPipelineTemplates: ${{ parameters.use1ESPipelineTemplates }}
          emscripten:
            # .NET 8
            - 3.1.34:
              displayName: 3.1.34
              version: 3.1.34
              features: _wasmeh,st
            - 3.1.34:
              displayName: '3.1.34_Threading'
              version: 3.1.34
              features: _wasmeh,mt
            - 3.1.34:
              displayName: '3.1.34_SIMD'
              version: 3.1.34
              features: _wasmeh,st,simd
            - 3.1.34:
              displayName: '3.1.34_SIMD_Threading'
              version: 3.1.34
              features: _wasmeh,mt,simd

            # .NET 9 and .NET 10
            - 3.1.56:
              displayName: 3.1.56
              version: 3.1.56
              features: _wasmeh,st
            - 3.1.56:
              displayName: '3.1.56_Threading'
              version: 3.1.56
              features: _wasmeh,mt
            - 3.1.56:
              displayName: '3.1.56_SIMD'
              version: 3.1.56
              features: _wasmeh,st,simd
            - 3.1.56:
              displayName: '3.1.56_SIMD_Threading'
              version: 3.1.56
              features: _wasmeh,mt,simd

            # .NET 11
            - 6.0.2:
              displayName: 6.0.2
              version: 6.0.2
              features: _wasmeh,_newexc,st
            - 6.0.2:
              displayName: '6.0.2_Threading'
              version: 6.0.2
              features: _wasmeh,_newexc,mt
            - 6.0.2:
              displayName: '6.0.2_SIMD'
              version: 6.0.2
              features: _wasmeh,_newexc,st,simd
            - 6.0.2:
              displayName: '6.0.2_SIMD_Threading'
              version: 6.0.2
              features: _wasmeh,_newexc,mt,simd
