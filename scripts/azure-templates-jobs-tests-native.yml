parameters:
  buildAgent: {}
  use1ESPipelineTemplates: false

jobs:
  - template: /scripts/azure-templates-jobs-bootstrapper.yml@self
    parameters:
      name: tests_native_linux
      displayName: Native tests (Linux)
      buildAgent: ${{ parameters.buildAgent }}
      use1ESPipelineTemplates: ${{ parameters.use1ESPipelineTemplates }}
      docker: scripts/infra/tests/docker/native
      target: tests-native
      dotnetSdks: []
      checkoutSubmodules: false
      installAndroidSdk: false
      installXcode: false
      shouldPublish: false
      retryCount: 0
      requiredArtifacts:
        - name: native
        - name: native_msvc
          dir: msvc
      postBuildSteps:
        - task: PublishTestResults@2
          displayName: Publish native test results
          condition: always()
          inputs:
            testResultsFormat: VSTest
            testResultsFiles: output/logs/testlogs/SkiaSharp.Tests.Native/**/*.trx
            testRunTitle: Native tests (Linux)
            failTaskOnFailedTests: true
            failTaskOnMissingResultsFile: true
      publishArtifacts:
        - name: testlogs_native_linux
          always: true
          path: output/logs/testlogs/SkiaSharp.Tests.Native
