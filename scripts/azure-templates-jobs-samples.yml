parameters:
  platform: ''
  buildAgent: {}
  sdk: {}

jobs:
  - ${{ each group in split('Build,Host,Docker', ',') }}:
    - ${{ if or(ne(parameters.platform, 'macos'), ne(group, 'Docker')) }}:
      - template: /scripts/azure-templates-jobs-bootstrapper.yml@self
        parameters:
          name: samples_${{ parameters.platform }}_${{ parameters.sdk.name }}_${{ lower(group) }}
          displayName: ${{ parameters.platform }} (${{ parameters.sdk.name }}, ${{ group }})
          buildAgent: ${{ parameters.buildAgent }}
          dotnetSdks:
            - sdkVersion: $(DOTNET_VERSION)
              workloadSetVersion: $(DOTNET_WORKLOAD_VERSION)
              tizenVersion: $(DOTNET_TIZEN_MANIFEST_BAND)/$(DOTNET_TIZEN_MANIFEST_VERSION)
            - ${{ parameters.sdk.additionalSdks[parameters.platform] }}
          env:
            SAMPLE_TEST_SDK_VERSION: ${{ parameters.sdk.version }}
          ${{ if eq(parameters.platform, 'macos') }}:
            variables:
              XCODE_VERSION: ${{ parameters.sdk.xcodeVersion }}
          ${{ if eq(parameters.platform, 'macos') }}:
            installNinja: true
          ${{ if eq(parameters.platform, 'linux') }}:
            packages: $(MANAGED_LINUX_PACKAGES)
            installEmsdk: true
            initScript: source ~/emsdk/emsdk_env.sh
          target: samples
          additionalArgs: --runGroup=${{ group }} --sampleRunId=${{ parameters.sdk.name }}_${{ parameters.platform }}_${{ lower(group) }}
          retryCount: 0
          shouldPublish: false
          requiredArtifacts:
            - name: native
            - name: nuget
              dir: nugets
          publishArtifacts:
            - name: sample_logs_${{ parameters.platform }}_${{ parameters.sdk.name }}_${{ lower(group) }}
              always: true
              path: output/logs
          postBuildSteps:
            - task: PublishTestResults@2
              condition: always()
              inputs:
                testResultsFormat: VSTest
                testResultsFiles: output/logs/testlogs/samples/${{ parameters.sdk.name }}_${{ parameters.platform }}_${{ lower(group) }}/**/*.trx
                testRunTitle: Samples (${{ parameters.platform }}, ${{ parameters.sdk.name }}, ${{ group }})
