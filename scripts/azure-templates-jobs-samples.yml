parameters:
  platform: ''
  buildAgent: {}

jobs:
  - ${{ each group in split('Build,Host,Docker', ',') }}:
    - ${{ if or(ne(parameters.platform, 'macos'), ne(group, 'Docker')) }}:
      - template: /scripts/azure-templates-jobs-bootstrapper.yml@self
        parameters:
          name: samples_${{ parameters.platform }}_${{ lower(group) }}
          displayName: ${{ parameters.platform }} (${{ group }})
          buildAgent: ${{ parameters.buildAgent }}
          dotnetSdks:
            - sdkVersion: $(DOTNET_VERSION)
              workloadSetVersion: $(DOTNET_WORKLOAD_VERSION)
              tizen:
                manifestBand: $(DOTNET_TIZEN_MANIFEST_BAND)
                manifestVersion: $(DOTNET_TIZEN_MANIFEST_VERSION)
          ${{ if eq(parameters.platform, 'macos') }}:
            installNinja: true
          ${{ if eq(parameters.platform, 'linux') }}:
            packages: $(MANAGED_LINUX_PACKAGES)
            installEmsdk: true
            initScript: source ~/emsdk/emsdk_env.sh
          target: samples
          additionalArgs: --runGroup=${{ group }}
          retryCount: 0
          shouldPublish: false
          requiredArtifacts:
            - name: native
            - name: nuget
              dir: nugets
          publishArtifacts:
            - name: sample_logs_${{ parameters.platform }}_${{ lower(group) }}
              always: true
              path: output/logs
          postBuildSteps:
            - pwsh: python3 scripts/infra/tests/extract-visual-goldens.py output/logs/testlogs/samples --images-out output/logs/testlogs/samples/golden-images
              displayName: Extract sample reference diagnostics
              condition: always()
            - ${{ if eq(group, 'Build') }}:
              - pwsh: |
                  python3 -m unittest discover -s scripts/infra/tests -p test_golden_images.py
                  if ($LASTEXITCODE -ne 0) { throw "Golden exporter tests failed." }
                  python3 scripts/infra/tests/extract-visual-goldens.py --check tests/Goldens/Samples
                  if ($LASTEXITCODE -ne 0) { throw "Canonical sample golden validation failed." }
                  python3 scripts/infra/tests/extract-visual-goldens.py --check tests/Goldens/Visual
                  if ($LASTEXITCODE -ne 0) { throw "Canonical visual golden validation failed." }
                displayName: Validate canonical references and export tooling
            - task: PublishTestResults@2
              condition: always()
              inputs:
                testResultsFormat: VSTest
                testResultsFiles: output/logs/testlogs/samples/**/*.trx
                testRunTitle: Samples (${{ parameters.platform }}, ${{ group }})
