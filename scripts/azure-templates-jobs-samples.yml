parameters:
  buildAgent: {}
  sdk: {}

jobs:
  - ${{ each group in split('Build,Host,Docker', ',') }}:
    - ${{ if or(ne(parameters.buildAgent.pool.os, 'macos'), ne(group, 'Docker')) }}:
      - template: /scripts/azure-templates-jobs-bootstrapper.yml@self
        parameters:
          name: samples_${{ parameters.buildAgent.pool.os }}_${{ parameters.sdk.name }}_${{ lower(group) }}
          displayName: ${{ parameters.buildAgent.pool.os }} (${{ parameters.sdk.name }}, ${{ group }})
          buildAgent: ${{ parameters.buildAgent }}
          dotnetSdks:
            - sdkVersion: $(DOTNET_VERSION)
              workloadSetVersion: $(DOTNET_WORKLOAD_VERSION)
            - ${{ parameters.sdk.additionalSdks[parameters.buildAgent.pool.os] }}
          env:
            SAMPLE_TEST_SDK_VERSION: ${{ parameters.sdk.version }}
          ${{ if eq(parameters.buildAgent.pool.os, 'macos') }}:
            variables:
              XCODE_VERSION: ${{ parameters.sdk.xcodeVersion }}
            installNinja: true
            ${{ if eq(group, 'Build') }}:
              preBuildSteps:
                - bash: xcodebuild -downloadPlatform tvOS -buildVersion "$(xcrun --sdk appletvsimulator --show-sdk-version)"
                  displayName: Install the tvOS runtime required by the selected Xcode storyboard compiler
          ${{ if eq(parameters.buildAgent.pool.os, 'linux') }}:
            packages: $(MANAGED_LINUX_PACKAGES)
            installEmsdk: true
            initScript: source ~/emsdk/emsdk_env.sh
          target: samples
          additionalArgs: --runGroup=${{ group }} --sampleRunId=${{ parameters.sdk.name }}_${{ parameters.buildAgent.pool.os }}_${{ lower(group) }}
          retryCount: 0
          shouldPublish: false
          requiredArtifacts:
            - name: native
            - name: nuget
              dir: nugets
          publishArtifacts:
            - name: sample_logs_${{ parameters.buildAgent.pool.os }}_${{ parameters.sdk.name }}_${{ lower(group) }}
              always: true
              path: output/logs
          postBuildSteps:
            - task: PublishTestResults@2
              condition: always()
              inputs:
                testResultsFormat: VSTest
                testResultsFiles: output/logs/testlogs/samples/${{ parameters.sdk.name }}_${{ parameters.buildAgent.pool.os }}_${{ lower(group) }}/**/*.trx
                testRunTitle: Samples (${{ parameters.buildAgent.pool.os }}, ${{ parameters.sdk.name }}, ${{ group }})
