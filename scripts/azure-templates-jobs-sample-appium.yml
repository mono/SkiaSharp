parameters:
  name: ''
  buildAgent: {}
  device: {}

jobs:
  - template: /scripts/azure-templates-jobs-bootstrapper.yml@self
    parameters:
      name: ${{ parameters.name }}
      displayName: Appium (iOS ${{ parameters.device.version }})
      buildAgent: ${{ parameters.buildAgent }}
      target: samples
      additionalArgs: --runGroup=Ios --sampleRunId=${{ parameters.name }} --skipExternals="all"
      env:
        SAMPLE_TEST_IOS_VERSION: ${{ parameters.device.version }}
        SAMPLE_TEST_IOS_MODEL: iPhone 16 Pro
      dotnetSdks:
        - sdkVersion: $(DOTNET_VERSION)
          workloadSetVersion: $(DOTNET_WORKLOAD_VERSION)
          tizen:
            manifestBand: $(DOTNET_TIZEN_MANIFEST_BAND)
            manifestVersion: $(DOTNET_TIZEN_MANIFEST_VERSION)
      installAndroidSdk: false
      installAndroidNdk: false
      retryCount: 0
      shouldPublish: false
      requiredArtifacts:
        - name: native
        - name: nuget
          dir: nugets
      publishArtifacts:
        - name: ${{ parameters.name }}_logs
          always: true
          path: output/logs
      preBuildSteps:
        - pwsh: ./scripts/infra/managed/install-ios-runtime.ps1 -Version '${{ parameters.device.version }}'
          displayName: Install the selected iOS simulator runtime
        - pwsh: ./scripts/infra/tests/install-appium.ps1
          displayName: Install Appium 3 and XCUITest
      postBuildSteps:
        - task: PublishTestResults@2
          condition: always()
          inputs:
            testResultsFormat: VSTest
            testResultsFiles: output/logs/testlogs/samples/${{ parameters.name }}/**/*.trx
            testRunTitle: Appium (iOS ${{ parameters.device.version }})
