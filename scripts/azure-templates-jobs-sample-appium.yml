parameters:
  name: ''
  platform: ''
  buildAgent: {}
  workloads: []
  androidApi: ''
  runGroup: ''

jobs:
  - template: /scripts/azure-templates-jobs-bootstrapper.yml@self
    parameters:
      name: ${{ parameters.name }}
      displayName: Appium (${{ parameters.platform }})
      buildAgent: ${{ parameters.buildAgent }}
      target: samples
      ${{ if eq(parameters.platform, 'Android') }}:
        additionalArgs: --runGroup=${{ parameters.runGroup }} --sampleRunId=${{ parameters.name }} --sampleTestTrait=AndroidApi=${{ parameters.androidApi }} --skipExternals="all"
      ${{ else }}:
        additionalArgs: --runGroup=${{ parameters.runGroup }} --sampleRunId=${{ parameters.name }} --sampleTestTrait=Platform=${{ parameters.platform }} --skipExternals="all"
      retryCount: 0
      shouldPublish: false
      installXcode: ${{ ne(parameters.platform, 'Android') }}
      installAndroidSdk: ${{ eq(parameters.platform, 'Android') }}
      dotnetSdks:
        - sdkVersion: $(DOTNET_VERSION)
          workloadSetVersion: $(DOTNET_WORKLOAD_VERSION)
          workloads: ${{ parameters.workloads }}
      requiredArtifacts:
        - name: native
        - name: nuget
          dir: nugets
      publishArtifacts:
        - name: ${{ parameters.name }}_logs
          always: true
          path: output/logs
      preBuildSteps:
        - ${{ if eq(parameters.platform, 'Android') }}:
          - bash: |
              set -e
              echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
              sudo udevadm control --reload-rules
              sudo udevadm trigger --name-match=kvm
              mkdir -p "$HOME/.android/avd"
              echo "##vso[task.setvariable variable=ANDROID_AVD_HOME]$HOME/.android/avd"
              echo "##vso[task.setvariable variable=ANDROID_EMULATOR_HOME]$HOME/.android"
            displayName: Reuse Android device-test KVM and AVD provisioning
        - pwsh: ./scripts/infra/tests/check-appium.ps1 -Platform '${{ parameters.platform }}' -AndroidApi '${{ parameters.androidApi }}'
          displayName: Check preinstalled Appium prerequisites (no downloads)
      postBuildSteps:
        - task: PublishTestResults@2
          condition: always()
          inputs:
            testResultsFormat: VSTest
            testResultsFiles: output/logs/testlogs/samples/${{ parameters.name }}/**/*.trx
            testRunTitle: Appium samples (${{ parameters.platform }})
