parameters:
  name: ''
  platform: ''
  buildAgent: {}
  sdk: {}
  device: {}
  runGroup: ''

jobs:
  - template: /scripts/azure-templates-jobs-bootstrapper.yml@self
    parameters:
      name: ${{ parameters.name }}
      displayName: Appium (${{ parameters.platform }})
      buildAgent: ${{ parameters.buildAgent }}
      target: samples
      additionalArgs: --runGroup=${{ parameters.runGroup }} --sampleRunId=${{ parameters.name }} --skipExternals="all"
      env:
        SAMPLE_TEST_SDK_VERSION: ${{ parameters.sdk.version }}
        ${{ if eq(parameters.platform, 'Android') }}:
          SAMPLE_TEST_ANDROID_VERSION: ${{ parameters.device.version }}
          SAMPLE_TEST_ANDROID_MODEL: ${{ parameters.device.model }}
          SAMPLE_TEST_ANDROID_IMAGE: ${{ parameters.device.image }}
        ${{ if eq(parameters.platform, 'iOS') }}:
          SAMPLE_TEST_IOS_VERSION: ${{ parameters.device.version }}
          SAMPLE_TEST_IOS_MODEL: ${{ parameters.device.model }}
        ${{ if eq(parameters.buildAgent.pool.os, 'macos') }}:
          DEVELOPER_DIR: /Applications/Xcode_${{ parameters.sdk.xcodeVersion }}.app/Contents/Developer
      retryCount: 0
      shouldPublish: false
      installXcode: false
      installAndroidSdk: ${{ eq(parameters.platform, 'Android') }}
      installAndroidNdk: false
      installNode: false
      provisioningSteps:
        - pwsh: New-Item -ItemType Directory -Path output/logs -Force | Out-Null
          displayName: Prepare Appium diagnostic artifacts
          condition: always()
      dotnetSdks:
        - sdkVersion: ${{ parameters.sdk.version }}
          workloadSetVersion: ${{ parameters.sdk.workloadVersion }}
          tizenVersion: $(DOTNET_TIZEN_MANIFEST_BAND)/$(DOTNET_TIZEN_MANIFEST_VERSION)
      requiredArtifacts:
        - name: native
        - name: nuget
          dir: nugets
      publishArtifacts:
        - name: ${{ parameters.name }}_logs
          always: true
          path: output/logs
      preBuildSteps:
        - task: UseNode@1
          displayName: Install Node.js 22 for Appium 3
          inputs:
            version: '22.x'
            checkLatest: true
        - ${{ if eq(parameters.platform, 'Android') }}:
          - ${{ if eq(parameters.buildAgent.pool.os, 'linux') }}:
            - bash: |
                set -e
                echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                sudo udevadm control --reload-rules
                sudo udevadm trigger --name-match=kvm
              displayName: Enable KVM for the selected Android host
          - bash: |
              set -e
              mkdir -p "$HOME/.android/avd"
              echo "##vso[task.setvariable variable=ANDROID_AVD_HOME]$HOME/.android/avd"
              echo "##vso[task.setvariable variable=ANDROID_EMULATOR_HOME]$HOME/.android"
            displayName: Set Android AVD home
          - pwsh: |
              $ErrorActionPreference = 'Stop'
              ./scripts/infra/managed/install-android-package.ps1 -Package emulator
              if ($LASTEXITCODE -ne 0) { throw 'Android emulator installation failed.' }
              $abi = switch ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()) {
                  'Arm64' { 'arm64-v8a' }
                  'X64' { 'x86_64' }
                  default { throw 'Android sample jobs require an arm64 or x64 host.' }
              }
              ./scripts/infra/managed/install-android-package.ps1 -Package "system-images;${{ parameters.device.image }};$abi"
              if ($LASTEXITCODE -ne 0) { throw 'Selected Android emulator image installation failed.' }
            displayName: Install the exact selected Android emulator image
        - ${{ if eq(parameters.platform, 'iOS') }}:
          - pwsh: |
              $ErrorActionPreference = 'Stop'
              & xcodebuild -downloadPlatform iOS -buildVersion '${{ parameters.device.version }}'
              if ($LASTEXITCODE -ne 0) { throw 'Selected iOS simulator runtime installation failed.' }
              $json = & xcrun simctl list runtimes --json
              if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the installed simulator runtimes.' }
              $runtimes = ($json | ConvertFrom-Json).runtimes
              if (!($runtimes | Where-Object { $_.name.StartsWith('iOS ') -and $_.version -eq '${{ parameters.device.version }}' -and $_.isAvailable })) {
                  throw 'The exact selected iOS simulator runtime is not available after installation.'
              }
            displayName: Install the exact selected iOS simulator runtime
            env:
              DEVELOPER_DIR: /Applications/Xcode_${{ parameters.sdk.xcodeVersion }}.app/Contents/Developer
        - pwsh: ./scripts/infra/tests/install-appium.ps1 -Platform '${{ parameters.platform }}'
          displayName: Install isolated Appium and selected driver
          env:
            ${{ if or(eq(parameters.platform, 'iOS'), eq(parameters.platform, 'Mac')) }}:
              DEVELOPER_DIR: /Applications/Xcode_${{ parameters.sdk.xcodeVersion }}.app/Contents/Developer
      postBuildSteps:
        - task: PublishTestResults@2
          condition: always()
          inputs:
            testResultsFormat: VSTest
            testResultsFiles: output/logs/testlogs/samples/${{ parameters.name }}/**/*.trx
            testRunTitle: Appium samples (${{ parameters.platform }})
