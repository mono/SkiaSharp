parameters:
  name: ''
  displayName: ''
  buildAgent: {}
  additionalArgs: ''
  env: {}
  preBuildSteps: []
  phase: run
  platform: ''
  dependsOn: []

jobs:
  - template: /scripts/azure-templates-jobs-bootstrapper.yml@self
    parameters:
      name: ${{ parameters.name }}
      displayName: ${{ parameters.displayName }}
      buildAgent: ${{ parameters.buildAgent }}
      dependsOn: ${{ parameters.dependsOn }}
      target: samples
      additionalArgs: --appiumMode=${{ parameters.phase }} ${{ parameters.additionalArgs }}
      env: ${{ parameters.env }}
      dotnetSdks:
        - sdkVersion: $(DOTNET_VERSION)
          ${{ if eq(parameters.phase, 'build') }}:
            workloadSetVersion: $(DOTNET_WORKLOAD_VERSION)
            workloads: [android, ios, maccatalyst, maui]
      installAndroidSdk: false
      installAndroidNdk: false
      retryCount: 0
      shouldPublish: false
      requiredArtifacts:
        - ${{ if eq(parameters.phase, 'build') }}:
          - name: native
        - name: nuget
          dir: nugets
        - ${{ if eq(parameters.phase, 'run') }}:
          - name: samples_appium_build_${{ parameters.platform }}_apps
            dir: appium-apps/${{ parameters.platform }}
            currentRun: true
          - name: samples_appium_build_${{ parameters.platform }}_runner
            dir: appium-runner/${{ parameters.platform }}
            currentRun: true
      publishArtifacts:
        - ${{ if eq(parameters.phase, 'build') }}:
          - name: ${{ parameters.name }}_apps
            path: output/appium-apps/${{ parameters.platform }}
          - name: ${{ parameters.name }}_runner
            path: output/appium-runner/${{ parameters.platform }}
        - name: ${{ parameters.name }}_logs
          always: true
          path: output/logs
      preBuildSteps: ${{ parameters.preBuildSteps }}
      postBuildSteps:
        - pwsh: python3 scripts/infra/tests/extract-visual-goldens.py output/logs/testlogs/samples --images-out output/logs/testlogs/samples/golden-images
          displayName: Extract device reference diagnostics
          condition: always()
        - task: PublishTestResults@2
          condition: always()
          inputs:
            testResultsFormat: VSTest
            testResultsFiles: output/logs/testlogs/samples/**/*.trx
            testRunTitle: ${{ parameters.displayName }}
