parameters:
  - name: buildPipelineType
    type: string
  - name: buildAgentWindows
    type: object
  - name: buildAgentMac
    type: object
  - name: buildAgentLinux
    type: object

stages:

    - stage: samples
      displayName: Samples
      ${{ if eq(parameters.buildPipelineType, 'test') }}:
        dependsOn: prepare
      ${{ else }}:
        dependsOn: package
      jobs:
        - template: /scripts/azure-templates-jobs-samples.yml@self
          parameters:
            platform: windows
            buildAgent: ${{ parameters.buildAgentWindows}}

        - template: /scripts/azure-templates-jobs-samples.yml@self
          parameters:
            platform: macos
            buildAgent: ${{ parameters.buildAgentMac }}

        - template: /scripts/azure-templates-jobs-samples.yml@self
          parameters:
            platform: linux
            buildAgent: ${{ parameters.buildAgentLinux }}

        - template: /scripts/azure-templates-jobs-sample-appium.yml@self
          parameters:
            name: samples_appium_ios18_6
            buildAgent: ${{ parameters.buildAgentMac }}
            device:
              version: '18.6'
              buildVersion: '22G86'

        - template: /scripts/azure-templates-jobs-sample-appium.yml@self
          parameters:
            name: samples_appium_ios26_5
            buildAgent: ${{ parameters.buildAgentMac }}
            device:
              version: '26.5'
              buildVersion: '23F77'
