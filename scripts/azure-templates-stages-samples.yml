parameters:
  - name: buildPipelineType
    type: string
  - name: buildAgentWindows
    type: object
  - name: buildAgentMac
    type: object
  - name: buildAgentLinux
    type: object

stages:

    - stage: samples
      displayName: Samples
      ${{ if eq(parameters.buildPipelineType, 'test') }}:
        dependsOn: prepare
      ${{ else }}:
        dependsOn: package
      jobs:
        - template: /scripts/azure-templates-jobs-samples.yml@self
          parameters:
            platform: windows
            buildAgent: ${{ parameters.buildAgentWindows}}

        - template: /scripts/azure-templates-jobs-samples.yml@self
          parameters:
            platform: macos
            buildAgent: ${{ parameters.buildAgentMac }}

        - template: /scripts/azure-templates-jobs-samples.yml@self
          parameters:
            platform: linux
            buildAgent: ${{ parameters.buildAgentLinux }}

        - template: /scripts/azure-templates-jobs-sample-appium.yml@self
          parameters:
            name: samples_appium_ios18_6
            displayName: Appium (iOS 18.6)
            buildAgent: ${{ parameters.buildAgentMac }}
            additionalArgs: --runGroup=Ios --sampleRunId=samples_appium_ios18_6 --iosVersion=18.6 --iosSimulatorModel="iPhone 16 Pro" --skipExternals="all"
            preBuildSteps:
              - pwsh: ./scripts/infra/managed/install-ios-runtime.ps1 -Version '18.6'
                displayName: Install the selected iOS simulator runtime
              - pwsh: ./scripts/infra/tests/install-appium.ps1
                displayName: Install Appium 3 and XCUITest

        - template: /scripts/azure-templates-jobs-sample-appium.yml@self
          parameters:
            name: samples_appium_ios_latest
            displayName: Appium (iOS latest installed)
            buildAgent: ${{ parameters.buildAgentMac }}
            additionalArgs: --runGroup=Ios --sampleRunId=samples_appium_ios_latest --iosVersion=latest --iosSimulatorModel="iPhone 16 Pro" --skipExternals="all"
            preBuildSteps:
              - pwsh: ./scripts/infra/tests/install-appium.ps1
                displayName: Install Appium 3 and XCUITest
