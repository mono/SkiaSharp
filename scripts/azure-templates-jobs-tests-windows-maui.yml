parameters:
  buildAgent: {}
  retryCount: 3
  nativeBuildId: ''

jobs:
  - template: /scripts/azure-templates-jobs-tests-device.yml@self
    parameters:
      name: tests_windows_windows
      displayName: Windows (MAUI)
      buildAgent: ${{ parameters.buildAgent }}
      target: tests-windows
      additionalArgs: --skipExternals="all" --coverage=$(ENABLE_CODE_COVERAGE)
      installXcode: false
      dotnetSdks:
        - sdkVersion: $(DOTNET_VERSION)
          workloadSetVersion: $(DOTNET_WORKLOAD_VERSION)
          workloads: [maui-windows]
      resultLabel: Windows MAUI
      logArtifact: testlogs_windows
      retryCount: ${{ parameters.retryCount }}
      nativeBuildId: '${{ parameters.nativeBuildId }}'
      preBuildSteps:
        - pwsh: .\scripts\infra\tests\windows\install-mesa-gl.ps1
          displayName: Provision software OpenGL (Mesa) for the GL tests
        - pwsh: .\scripts\infra\tests\windows\install-vulkan-icd.ps1
          displayName: Provision software Vulkan (SwiftShader) for visual tests
        - pwsh: |
            $ErrorActionPreference = 'Stop'
            $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
            New-Item -Path $key -Force | Out-Null
            New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null
          displayName: Enable Windows Developer Mode for MSIX registration
