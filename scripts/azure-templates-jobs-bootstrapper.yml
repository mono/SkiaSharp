parameters:
  name: ''                                      # in the form type_platform_host
  displayName: ''                               # the human name
  buildAgent: ''                                # the configuration for the build agent
  packages: ''                                  # any additional packages
  target: ''                                    # the bootstrapper target
  cacheJob: ''                                  # the job name in repo-deps.config.json for caching (empty = no caching)
  enableCaching: false                          # whether to use build caching (opt-in)
  dependsOn: []                                 # the dependiencies
  variables: []                                 # the job variables
  requiredArtifacts: []                         # the artifacts that this build needs to download
  preBuildSteps: []                             # any steps to run before the build
  provisioningSteps: []                         # any steps to run to provision the machine
  postBuildSteps: []                            # any additional steps to run after the build
  env: {}                                       # environment variables to set for the bootstrapper (also forwarded into Docker)
  initScript: ''                                # any scripts to run before starting the bootstrapper
  additionalArgs: ''                            # any additional arguments to pass to the bootstrapper
  retryCount: 3                                 # the number of times to retry the bootstrapper
  condition: succeeded()                        # whether or not to run this template
  shouldPublish: true                           # whether or not to publish the artifacts
  configuration: $(CONFIGURATION)               # the build configuration
  verbosity: $(VERBOSITY)                       # the level of verbosity to use when building
  docker: ''                                    # the Docker image to build and use
  dockerArgs: ''                                # any additional arguments to pass to docker build
  installAndroidNdk: true                       # whether or not to install the Android NDK
  installAndroidSdk: true                       # whether or not to install the Android SDK
  installWindowsSdk: false                      # whether or not to install the Windows SDK
  installDotNet: true                           # whether or not to install the dotnet SDK
  installDotNetWorkloads: true                  # whether or not to install the .NET workloads
  installLlvm: true                             # whether or not to install the LLVM compiler
  installEmsdk: false                           # whether or not to install the Emscripten SDK
  installNinja: false                           # whether or not to install the ninja build system
  installNode: true                             # whether or not to install Node.js
  installPreviewSdk: false                      # whether to install the preview .NET SDK ($(DOTNET_VERSION_PREVIEW)) and pin global.json to it
  previewWorkloads: ''                           # workloads to install under the preview .NET SDK (comma-separated, e.g. 'wasm-tools,android')
  installXcode: true                            # whether or not to install Xcode
  publishArtifacts: []                          # the additional artifacts to publish
  tools: []                                     # any additional .net global tools
  dotnetWorkloads: ''                           # override the default workloads to install (comma-separated, e.g. 'android,maui-android')
  skipInstall: false                            # whether or not to install any tools
  skipSteps: false                              # whether or not to run any steps
  use1ESPipelineTemplates: false                # whether or not we are building using the internal 1ES Pipeline Templates
  continueOnError: false                        # whether or not to continue on error

jobs:
  - job: ${{ parameters.name }}
    displayName: ${{ parameters.displayName }}
    timeoutInMinutes: 180
    pool: ${{ parameters.buildAgent.pool }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    continueOnError: ${{ parameters.continueOnError }}
    variables:
      DOTNET_NOLOGO: true
      ${{ if ne(parameters.buildAgent.variables, '') }}:
        ${{ parameters.buildAgent.variables }}
      ${{ if ne(length(parameters.variables), 0) }}:
        ${{ parameters.variables }}
    templateContext:
      outputParentDirectory: 'output'
      outputs:
        - ${{ if eq(parameters.shouldPublish, 'true') }}:
          - output: pipelineArtifact
            displayName: 'Publish the ${{ parameters.name }} artifacts'
            artifactName: ${{ parameters.name }}
            targetPath: 'output'
        - output: pipelineArtifact
          displayName: 'Publish the failed ${{ parameters.name }} artifacts'
          condition: failed()
          artifactName: ${{ parameters.name }}_failed_$(System.JobAttempt)
          targetPath: 'output'
        - ${{ each additionalArtifact in parameters.publishArtifacts }}:
          - output: pipelineArtifact
            displayName: 'Publish the ${{ additionalArtifact.name }} artifacts'
            artifactName: ${{ additionalArtifact.name }}
            targetPath: ${{ additionalArtifact.path }}
          - ${{ if eq(additionalArtifact.always, 'true') }}:
            - output: pipelineArtifact
              displayName: 'Publish the failed ${{ additionalArtifact.name }} artifacts'
              condition: failed()
              artifactName: ${{ additionalArtifact.name }}_failed_$(System.JobAttempt)
              targetPath: ${{ additionalArtifact.path }}

    steps:
      - pwsh: if ($IsLinux -or $IsMacOS) { df -h } else { Get-Volume }
        displayName: Get the volume information before the run
        condition: always()

      - task: UsePythonVersion@0
        displayName: Switch to the correct Python version
        retryCountOnTaskFailure: 3
        inputs:
          versionSpec: '3.x'
          architecture: 'x64'

      # prepare - checkout strategy depends on caching
      - ${{ if and(ne(parameters.cacheJob, ''), eq(parameters.enableCaching, true)) }}:
        - checkout: self
          submodules: false
          fetchDepth: 1
        - pwsh: ./scripts/infra/native/shared/set-build-variables.ps1
          displayName: Configure build variables
        - pwsh: |
            python3 scripts/infra/caching/repo-deps.py cache-key `
              --name '${{ parameters.name }}' `
              --job '${{ parameters.cacheJob }}' `
              --docker '${{ parameters.docker }}'
          displayName: Compute cache key
        - task: Cache@2
          inputs:
            key: '"$(CACHE_KEY)"'
            path: 'output'
            cacheHitVar: CACHE_HIT
          displayName: Build cache
        - pwsh: |
            $cacheHit = '$(CACHE_HIT)'
            if ($cacheHit -eq 'true') {
                Write-Host "##[section]Cache HIT - skipping build for ${{ parameters.name }}"
                Write-Host "##vso[task.setvariable variable=CACHE_SKIP]true"
            } else {
                Write-Host "##[section]Cache MISS - full build required"
            }
          displayName: Evaluate cache decision
        - pwsh: git submodule update --init --recursive
          displayName: Full checkout (submodules)
          condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))

      - ${{ else }}:
        - checkout: self
          submodules: recursive

      - pwsh: ./scripts/infra/native/shared/set-build-variables.ps1
        displayName: Configure build variables

      - pwsh: .\scripts\infra\native\shared\get-free-space.ps1
        displayName: Get the volume information after the checkout
        condition: always()

      # free disk space on hosted agents - skip on cache hit (not building)
      - ${{ if eq(parameters.buildAgent.pool.name, 'Azure Pipelines') }}:
        - pwsh: ./scripts/infra/native/shared/free-disk-space.ps1
          displayName: Free disk space
          condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))

      - pwsh: .\scripts\infra\native\shared\get-free-space.ps1
        displayName: Get the volume information before the provisioning
        condition: always()

      # provisioning steps
      - ${{ if ne(parameters.buildAgent.provisioningSteps, '') }}:
        - ${{ parameters.buildAgent.provisioningSteps }}
      - ${{ if ne(length(parameters.provisioningSteps), 0) }}:
        - ${{ parameters.provisioningSteps }}

      # install any packages on linux
      - ${{ if and(eq(parameters.docker, ''), eq(parameters.buildAgent.pool.os, 'linux'), ne(parameters.skipInstall, 'true')) }}:
        - bash: |
            sudo apt update
            sudo apt install -y ${{ parameters.packages }}
          displayName: Install additional package dependencies
          retryCountOnTaskFailure: 3
          condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'), ne('${{ parameters.packages }}', ''))

      # install extra bits for the native builds
      - ${{ if and(startsWith(parameters.name, 'native_'), ne(parameters.skipInstall, 'true')) }}:
        # install ninja
        - pwsh: .\scripts\infra\native\shared\install-ninja.ps1
          displayName: Install Ninja
          retryCountOnTaskFailure: 3
          condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
        - ${{ if not(contains(parameters.name, '_checks_')) }}:
          # install android ndk
          - ${{ if and(eq(parameters.installAndroidNdk, 'true'), contains(parameters.name, '_android_')) }}:
            - pwsh: .\scripts\infra\native\android\install-android-ndk.ps1
              displayName: Install the Android NDK
              retryCountOnTaskFailure: 3
              condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
          # install llvm
          - ${{ if and(eq(parameters.installLlvm, 'true'), contains(parameters.name, '_win32_')) }}:
            - pwsh: .\scripts\infra\native\windows\install-7zip.ps1
              displayName: Install 7-zip
              retryCountOnTaskFailure: 3
              condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
            - pwsh: .\scripts\infra\native\windows\install-llvm.ps1
              displayName: Install LLVM
              retryCountOnTaskFailure: 3
              condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))

      # install the bits needed for .NET
      - ${{ if and(eq(parameters.installDotNet, 'true'), ne(parameters.skipInstall, 'true')) }}:
        - task: UseDotNet@2
          condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
          inputs:
            packageType: 'sdk'
            version: $(DOTNET_VERSION)
          retryCountOnTaskFailure: 3
          displayName: Install .NET $(DOTNET_VERSION)
        - ${{ if eq(parameters.buildAgent.pool.os, 'linux') }}:
          - pwsh: .\scripts\infra\native\shared\patch-dotnet.ps1 -InstallDir "$env:AGENT_TOOLSDIRECTORY/dotnet"
            displayName: Fix the Microsoft.WinFX.* file
            condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
        # display dotnet info
        - pwsh: dotnet --info
          displayName: Display all the .NET information
          condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))

      # install extra bits for the managed builds
      - ${{ if and(not(startsWith(parameters.name, 'native_')), ne(parameters.skipInstall, 'true')) }}:
        - ${{ if and(eq(parameters.installNode, 'true'), eq(parameters.buildAgent.pool.os, 'windows')) }}:
          - task: UseNode@1
            displayName: Install Node.js
            retryCountOnTaskFailure: 3
            condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
            inputs:
              version: 20.x
        # install ninja
        - ${{ if eq(parameters.installNinja, 'true') }}:
          - pwsh: .\scripts\infra\native\shared\install-ninja.ps1
            displayName: Install Ninja
            retryCountOnTaskFailure: 3
            condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
        # install the bits needed for Android
        - ${{ if eq(parameters.installAndroidSdk, 'true') }}:
          # install the correct version of the JDK
          - pwsh: .\scripts\infra\managed\install-openjdk.ps1
            displayName: Install OpenJDK
            retryCountOnTaskFailure: 3
            condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
          # install the correct version of the Android SDK
          - pwsh: .\scripts\infra\managed\install-android-sdk.ps1
            displayName: Install Android SDK
            retryCountOnTaskFailure: 3
            condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
          - pwsh: .\scripts\infra\managed\install-android-package.ps1 -Package "platform-tools"
            displayName: Install Android platform tools
            retryCountOnTaskFailure: 3
            condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
          - pwsh: .\scripts\infra\managed\install-android-package.ps1 -Package "build-tools;35.0.0"
            displayName: Install Android 35 build tools
            retryCountOnTaskFailure: 3
            condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
          - pwsh: .\scripts\infra\managed\install-android-package.ps1 -Package "build-tools;36.0.0"
            displayName: Install Android 36 build tools
            retryCountOnTaskFailure: 3
            condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
          # install the required version of the Android Platforms
          - pwsh: .\scripts\infra\managed\install-android-platform.ps1 -API "$(ANDROID_PLATFORM_VERSIONS)"
            displayName: Install Android APIs
            retryCountOnTaskFailure: 3
            condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
        # install workloads
        - ${{ if and(eq(parameters.installDotNet, 'true'), eq(parameters.installDotNetWorkloads, 'true')) }}:
          - pwsh: .\scripts\infra\managed\install-dotnet-workloads.ps1 -Tizen "$env:DOTNET_WORKLOAD_TIZEN" -Workloads "${{ parameters.dotnetWorkloads }}" -WorkloadSetVersion "$env:DOTNET_WORKLOAD_VERSION"
            condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
            retryCountOnTaskFailure: 3
            displayName: Install the .NET workloads
        # install and select the preview .NET SDK (opt-in; for jobs that run against a preview runtime)
        - ${{ if eq(parameters.installPreviewSdk, 'true') }}:
          - task: UseDotNet@2
            displayName: Install .NET $(DOTNET_VERSION_PREVIEW) (preview)
            retryCountOnTaskFailure: 3
            condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
            inputs:
              packageType: sdk
              version: $(DOTNET_VERSION_PREVIEW)
          - pwsh: |
              $globalJson = @{ sdk = @{ version = "$(DOTNET_VERSION_PREVIEW)"; allowPrerelease = $true; rollForward = "latestFeature" } } | ConvertTo-Json
              Set-Content -Path global.json -Value $globalJson
              Get-Content global.json
              dotnet --version
            displayName: Pin global.json to the preview .NET SDK
            condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
          - ${{ if ne(parameters.previewWorkloads, '') }}:
            # Reuse the shared workload install script, pinned to the exact preview workload set.
            # WASM tests still restore the platform TFMs (e.g. -android) of referenced projects, so
            # those workloads must be installed too — same as the non-preview test jobs.
            - pwsh: .\scripts\infra\managed\install-dotnet-workloads.ps1 -Workloads "${{ parameters.previewWorkloads }}" -WorkloadSetVersion "$(DOTNET_WORKLOAD_VERSION_PREVIEW)" -Tizen ""
              displayName: Install the preview .NET workloads (${{ parameters.previewWorkloads }})
              retryCountOnTaskFailure: 3
              condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))

      # install the mac tools
      - ${{ if and(eq(parameters.installXcode, 'true'), ne(parameters.buildAgent.parameters.installXcode, 'false'), eq(parameters.buildAgent.pool.os, 'macos'), ne(parameters.skipInstall, 'true')) }}:
        - ${{ if not(startsWith(parameters.name, 'native_')) }}:
          - bash: sudo ./scripts/infra/native/apple/select-xcode.sh $(XCODE_VERSION)
            displayName: Switch to the latest Xcode
            condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
        - ${{ if startsWith(parameters.name, 'native_') }}:
          - bash: sudo ./scripts/infra/native/apple/select-xcode.sh $(XCODE_VERSION_NATIVE)
            displayName: Switch to the latest Xcode
            condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))

      # install the linux tools
      - ${{ if and(eq(parameters.installEmsdk, 'true'), eq(parameters.buildAgent.pool.os, 'linux'), ne(parameters.skipInstall, 'true')) }}:
        - bash: ./scripts/infra/native/wasm/install-emsdk.sh $(EMSCRIPTEN_VERSION)
          displayName: Install the Emscripten SDK
          retryCountOnTaskFailure: 3
          condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))

      # install the Windows tools
      - ${{ if and(eq(parameters.buildAgent.pool.os, 'windows'), ne(parameters.skipInstall, 'true')) }}:
        # select the correct/latest version of Visual Studio
        - pwsh: .\scripts\infra\native\windows\select-vs.ps1
          displayName: Select Visual Studio
          condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
        - ${{ if not(contains(parameters.name, '_checks_')) }}:
          # install the older Windows SDKs
          - ${{ if eq(parameters.installWindowsSdk, 'true') }}:
            - pwsh: .\scripts\infra\native\windows\install-winsdk.ps1 -LinkId 619296  -Version 10.0.10240.0
              displayName: Install the Windows 10 SDK 10.0.10240
              retryCountOnTaskFailure: 3
              condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
            - pwsh: .\scripts\infra\native\windows\install-winsdk.ps1 -LinkId 864422  -Version 10.0.16299.0
              displayName: Install the Windows 10 SDK 10.0.16299
              retryCountOnTaskFailure: 3
              condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
            - pwsh: .\scripts\infra\native\windows\install-winsdk.ps1 -LinkId 2083338 -Version 10.0.18362.0
              displayName: Install the Windows 10 SDK 10.0.18362
              retryCountOnTaskFailure: 3
              condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
            - pwsh: .\scripts\infra\native\windows\install-winsdk.ps1 -LinkId 2120843 -Version 10.0.19041.0
              displayName: Install the Windows 10 SDK 10.0.19041
              retryCountOnTaskFailure: 3
              condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
      # install any .NET global tools
      - ${{ if ne(parameters.skipInstall, 'true') }}:
        - ${{ each tool in parameters.tools }}:
          - pwsh: dotnet tool install -g ${{ tool }}
            displayName: Install ${{ tool }}
            retryCountOnTaskFailure: 3
            condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))

      - pwsh: .\scripts\infra\native\shared\get-free-space.ps1
        displayName: Get the volume information before downloading artifacts
        condition: always()

      # download artifacts from other jobs in this pipeline run
      - template: /scripts/azure-templates-steps-download-artifacts.yml@self
        parameters:
          condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
          artifacts: ${{ parameters.requiredArtifacts }}

      - pwsh: .\scripts\infra\native\shared\get-free-space.ps1
        displayName: Get the volume information after downloading artifacts
        condition: always()

      # pre-build steps
      - ${{ if ne(parameters.buildAgent.preBuildSteps, '') }}:
        - ${{ parameters.buildAgent.preBuildSteps }}
      - ${{ if ne(length(parameters.preBuildSteps), 0) }}:
        - ${{ parameters.preBuildSteps }}

      - pwsh: .\scripts\infra\native\shared\get-free-space.ps1
        displayName: Get the volume information before the build
        condition: always()

      # actual build
      - ${{ if ne(parameters.skipSteps, 'true') }}:
        - ${{ if eq(parameters.docker, '') }}:
          - pwsh: dotnet --info
            displayName: Display all the .NET information
            condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
          - pwsh: dotnet tool restore
            displayName: Restore the .NET tools
            condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
          - ${{ if eq(parameters.buildAgent.pool.os, 'windows') }}:
            - pwsh: |
                Get-Content $PSCommandPath
                ${{ parameters.initScript }}
                dotnet cake --target=${{ parameters.target }} --verbosity=${{ parameters.verbosity }} --configuration=${{ coalesce(parameters.configuration, 'Release') }} ${{ parameters.additionalArgs }}

              env:
                AndroidSdkDirectory: $(AndroidSdkDirectory)
                JavaSdkDirectory: $(JAVA_HOME)
                LLVM_HOME: $(LLVM_HOME)
                VS_INSTALL: $(VS_INSTALL)
                # There seems to be a bug in some verions of mspdbcmf.exe. This looks to be fixed in a VS preview.
                AppxSymbolPackageEnabled: false
                ${{ each pair in parameters.env }}:
                  ${{ pair.key }}: ${{ pair.value }}
              displayName: Run the bootstrapper for ${{ parameters.target }}
              retryCountOnTaskFailure: ${{ parameters.retryCount }}
              condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
          - ${{ if ne(parameters.buildAgent.pool.os, 'windows') }}:
            - bash: |
                cat ${BASH_SOURCE[0]}
                ${{ parameters.initScript }}
                dotnet cake --target=${{ parameters.target }} --verbosity=${{ parameters.verbosity }} --configuration=${{ coalesce(parameters.configuration, 'Release') }} ${{ parameters.additionalArgs }}

              env:
                AndroidSdkDirectory: $(AndroidSdkDirectory)
                JavaSdkDirectory: $(JAVA_HOME)
                ${{ each pair in parameters.env }}:
                  ${{ pair.key }}: ${{ pair.value }}
              displayName: Run the bootstrapper for ${{ parameters.target }}
              retryCountOnTaskFailure: ${{ parameters.retryCount }}
              condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
        - ${{ if ne(parameters.docker, '') }}:
          - ${{ if eq(parameters.use1ESPipelineTemplates, 'true') }}:
            - task: 1ES.BuildContainerImage@1
              displayName: Build the Docker image for ${{ parameters.docker }}
              condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
              inputs:
                dockerfile: ${{ parameters.docker }}/Dockerfile
                context: ${{ parameters.docker }}
                image: skiasharp:skiasharp
                buildArguments: --tag skiasharp ${{ parameters.dockerArgs }}
                enableNetwork: true
          - ${{ if ne(parameters.use1ESPipelineTemplates, 'true') }}:
            - task: Docker@2
              displayName: Build the Docker image for ${{ parameters.docker }}
              condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
              inputs:
                command: build
                buildContext: ${{ parameters.docker }}
                dockerfile: ${{ parameters.docker }}/Dockerfile
                arguments: --tag skiasharp ${{ parameters.dockerArgs }}
          # Run the target inside the image against the mounted repo. Linux and Windows containers
          # differ in shell and mount path, so the run step is branched by agent OS.
          #
          # The container inherits nothing from the agent, so `env` is materialised into an env-file
          # and handed to `docker run --env-file`. The file is always created (empty when no `env`
          # is declared) so the run command stays uniform.
          - ${{ if ne(parameters.buildAgent.pool.os, 'windows') }}:
            - bash: |
                echo dotnet tool restore > cmd.sh
                echo dotnet cake --target=${{ parameters.target }} --verbosity=${{ parameters.verbosity }} --configuration=${{ coalesce(parameters.configuration, 'Release') }} ${{ parameters.additionalArgs }} >> cmd.sh
                sed -i 's/--gnArgs=\" \"//' cmd.sh
                cat cmd.sh
                : > docker.env
              displayName: Generate the script for the Docker image
              condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
            - ${{ each pair in parameters.env }}:
              # The value travels in the step's own environment rather than being
              # pasted into the script, so a quote in it cannot break out.
              - bash: |
                  printf '%s=%s\n' "$PAIR_KEY" "$PAIR_VALUE" >> docker.env
                env:
                  PAIR_KEY: ${{ pair.key }}
                  PAIR_VALUE: ${{ pair.value }}
                displayName: Forward ${{ pair.key }} into the Docker image
                condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
            - bash: |
                docker run --rm --name skiasharp --env-file docker.env --volume $(pwd):/work skiasharp /bin/sh /work/cmd.sh
              displayName: Run the bootstrapper for ${{ parameters.target }} using the Docker image
              retryCountOnTaskFailure: ${{ parameters.retryCount }}
              condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
            - bash: rm -f docker.env
              displayName: Remove the Docker env-file
              condition: always()
          - ${{ if eq(parameters.buildAgent.pool.os, 'windows') }}:
            - pwsh: |
                'dotnet tool restore' | Set-Content cmd.cmd -Encoding ascii
                'dotnet cake --target=${{ parameters.target }} --verbosity=${{ parameters.verbosity }} --configuration=${{ coalesce(parameters.configuration, 'Release') }} ${{ parameters.additionalArgs }}' | Add-Content cmd.cmd -Encoding ascii
                Get-Content cmd.cmd
                # Docker's env-file parser keeps a trailing CR as part of the value, so write LF only.
                [IO.File]::WriteAllText("$PWD/docker.env", "")
              displayName: Generate the script for the Docker image
              condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
            - ${{ each pair in parameters.env }}:
              # As above: the value is read from the environment, never interpolated
              # into the script, so quotes and $ in it stay literal.
              - pwsh: |
                  [IO.File]::AppendAllText("$PWD/docker.env", "${env:PAIR_KEY}=${env:PAIR_VALUE}`n")
                env:
                  PAIR_KEY: ${{ pair.key }}
                  PAIR_VALUE: ${{ pair.value }}
                displayName: Forward ${{ pair.key }} into the Docker image
                condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
            - pwsh: |
                docker run --rm --name skiasharp --env-file docker.env --volume "$(Build.SourcesDirectory):C:\work" -w C:\work skiasharp cmd /c C:\work\cmd.cmd
              displayName: Run the bootstrapper for ${{ parameters.target }} using the Docker image
              retryCountOnTaskFailure: ${{ parameters.retryCount }}
              condition: and(succeeded(), ne(variables['CACHE_SKIP'], 'true'))
            - pwsh: Remove-Item docker.env -Force -ErrorAction SilentlyContinue
              displayName: Remove the Docker env-file
              condition: always()

      - pwsh: .\scripts\infra\native\shared\get-free-space.ps1
        displayName: Get the volume information after the build
        condition: always()

      # post-build steps
      - ${{ parameters.postBuildSteps }}

      - pwsh: .\scripts\infra\native\shared\get-free-space.ps1
        displayName: Get the volume information after the entire run
        condition: always()
