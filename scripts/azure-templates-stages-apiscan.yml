parameters:
  - name: buildAgentWindows
    type: object

stages:
  - stage: api_scan
    displayName: API Scan
    dependsOn: package
    jobs:
      - job: api_scan
        displayName: API Scan
        timeoutInMinutes: 480
        pool: ${{ parameters.buildAgentWindows.pool }}
        workspace:
          clean: all
        templateContext:
          outputs:
            - output: pipelineArtifact
              displayName: Publish API Scan source dependency report
              artifactName: source_dependencies_api_scan_$(System.JobAttempt)
              targetPath: output/source-dependencies/api_scan
              condition: always()
              isProduction: false
        steps:
          - template: /scripts/azure-templates-steps-source-dependencies.yml@self
            parameters:
              mode: start
          - checkout: self
            submodules: false
            fetchDepth: 1

          - task: DownloadPipelineArtifact@2
            displayName: Download NuGet packages
            inputs:
              buildType: current
              artifactName: nuget
              targetPath: $(Agent.TempDirectory)\APIScan\packages\nuget

          - task: DownloadPipelineArtifact@2
            displayName: Download MSVC native artifacts
            inputs:
              buildType: current
              artifactName: native_msvc
              targetPath: $(Agent.TempDirectory)\APIScan\native_msvc

          - pwsh: >
              ./scripts/infra/security/prepare-apiscan-inputs.ps1
              -ScanRoot "$(Agent.TempDirectory)\APIScan"
              -SurrogateSource "$(Build.SourcesDirectory)\scripts\infra\security\APIScanSurrogates.in.xml"
            displayName: Prepare API Scan inputs

          - task: AzureCLI@2
            displayName: Login to API Scan identity
            inputs:
              azureSubscription: dotnet-apiscan
              scriptType: pscore
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                Write-Host "##vso[task.setvariable variable=ARM_CLIENT_ID;issecret=true]$env:servicePrincipalId"
                Write-Host "##vso[task.setvariable variable=ARM_ID_TOKEN;issecret=true]$env:idToken"
                Write-Host "##vso[task.setvariable variable=ARM_TENANT_ID;issecret=true]$env:tenantId"

          - pwsh: |
              az login `
                --service-principal `
                --username "$(ARM_CLIENT_ID)" `
                --tenant "$(ARM_TENANT_ID)" `
                --allow-no-subscriptions `
                --federated-token "$(ARM_ID_TOKEN)"
            displayName: Activate API Scan WIF identity

          - task: APIScan@2
            displayName: Run API Scan
            inputs:
              softwareFolder: $(Agent.TempDirectory)\APIScan
              symbolsFolder: SRV*https://symweb;$(Agent.TempDirectory)\APIScan\symbols-extracted;$(Agent.TempDirectory)\APIScan\native_msvc
              softwareName: SkiaSharp
              softwareVersionNum: 3
              softwareBuildNum: $(Build.BuildId)
              surrogateConfigurationFolder: $(Agent.TempDirectory)\APIScan\surrogates
              isLargeApp: true
              modeType: release
              toolVersion: Latest
              verbosityLevel: standard
              preserveLogsFolder: true
            env:
              AzureServicesAuthConnectionString: RunAs=Developer;DeveloperTool=AzureCli
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

          - task: SdtReport@2
            displayName: Create API Scan security report
            condition: succeededOrFailed()
            inputs:
              GdnExportVstsConsole: true
              GdnExportSarifFile: true
              GdnExportHtmlFile: true
              GdnExportAllTools: true
              GdnExportGdnToolApiScan: true
              GdnExportGdnToolApiScanSeverity: Note
              GdnExportPolicy: Microsoft
              GdnExportPolicyMinSev: Note
              GdnExportSuppressionFiles: $(Build.SourcesDirectory)\scripts\infra\security\source.gdnsuppress
              GdnExportSuppressionSets: default

          - task: TSAUpload@2
            displayName: Create bugs for API Scan results
            condition: succeededOrFailed()
            inputs:
              GdnPublishTsaOnboard: true
              GdnPublishTsaConfigFile: $(Build.SourcesDirectory)\scripts\infra\security\tsaoptions-v2.json
              GdnPublishTsaExportedResultsPublishable: true
              GdnPublishTsaPolicy: Microsoft
              GdnPublishTsaPolicyMinimumSeverity: Note
              GdnPublishTsaSuppressionFiles: $(Build.SourcesDirectory)\scripts\infra\security\source.gdnsuppress
              GdnPublishTsaSuppressionSets: default
              GdnPublishTsaAllTools: true
              GdnPublishTsaGdnToolApiScan: true
              GdnPublishTsaGdnToolApiScanSeverity: Note

          - task: PublishSecurityAnalysisLogs@3
            displayName: Publish API Scan analysis artifacts
            condition: succeededOrFailed()
            inputs:
              ArtifactName: CodeAnalysisLogs - API Scan
              ArtifactType: Container
              AllTools: true
              ApiScan: true
              ToolLogsNotFoundAction: Standard

          - task: PostAnalysis@2
            displayName: Fail on API Scan issues
            condition: succeededOrFailed()
            inputs:
              GdnBreakAllTools: true
              GdnBreakGdnToolApiScan: true
              GdnBreakGdnToolApiScanSeverity: Note
              GdnBreakPolicyMinSev: Note
              GdnBreakSuppressionFiles: $(Build.SourcesDirectory)\scripts\infra\security\source.gdnsuppress
              GdnBreakSuppressionSets: default

          - template: /scripts/azure-templates-steps-source-dependencies.yml@self
            parameters:
              mode: finish
