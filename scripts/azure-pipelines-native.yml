trigger:
  branches:
    include:
      - main
      - release/*
      - dev/dnceng-pipelines
  paths:
    exclude:
      - .devcontainer/**
      - .github/**
      - .vscode/**
      - documentation/docfx/releases/**
      - README.md

pr: none

schedules:
  - cron: "0 0 * * *"
    displayName: Daily midnight build for main
    branches:
      include:
        - main
    always: true

parameters:
  - name: buildAgentHost
    displayName: 'The generic host build agent configuration:'
    type: object
    default:
      pool:
        name: NetCore1ESPool-Internal
        demands:
          - ImageOverride -equals 1es-windows-2022
        os: windows
  - name: buildAgentWindowsNative
    displayName: 'The Windows build agent configuration for building the native assets:'
    type: object
    default:
      pool:
        name: NetCore1ESPool-Internal
        demands:
          - ImageOverride -equals 1es-windows-2022
        os: windows
  - name: buildAgentMacNative
    displayName: 'The macOS build agent configuration for building the native assets:'
    type: object
    default:
      pool:
        name: Azure Pipelines
        vmImage: macos-14
        os: macos
  - name: buildAgentLinuxNative
    displayName: 'The Linux build agent configuration for building the native assets:'
    type: object
    default:
      pool:
        name: NetCore1ESPool-Internal
        demands:
          - ImageOverride -equals 1es-ubuntu-2204
        os: linux

variables:
  - template: /scripts/azure-templates-variables.yml@self

resources:
  repositories:
    - repository: 1ESTemplates
      type: git
      name: 1ESPipelineTemplates/MicroBuildTemplate

extends:
  template: azure-pipelines/MicroBuild.1ES.Official.yml@1ESTemplates
  parameters:
    pool: ${{ parameters.buildAgentHost.pool }}
    # dnceng 1ES internal pools are network-isolated; SkiaSharp's native build
    # clones external submodules (chromium depot_tools + skia), so allow clean
    # source endpoints used by the .NET internal pipelines.
    settings:
      networkIsolationPolicy: Permissive, CFSClean, CFSClean2
    customBuildTags:
      - ES365AIMigrationTooling
    sdl:
      armory:
        break: true
      binskim:
        enabled: true
        break: true
      codeql:
        compiled:
          enabled: true
        enabledOnNonDefaultBranches: true
      codeInspector:
        enabled: true
      credscan:
        enabled: true
        break: true
      eslint:
        break: true
      policheck:
        enabled: true
        break: true
        exclusionsFile: $(Build.SourcesDirectory)/scripts/infra/security/PoliCheckExclusions.xml
      psscriptanalyzer:
        enabled: true
        break: true
      spotBugs:
        enabled: false
      suppression:
        suppressionFile: $(Build.SourcesDirectory)/scripts/infra/security/source.gdnsuppress
      tsa:
        enabled: true
        configFile: $(Build.SourcesDirectory)/scripts/infra/security/tsaoptions-v2.json
    stages:
      - template: /scripts/azure-templates-stages.yml@self
        parameters:
          buildPipelineType: 'native'
          use1ESPipelineTemplates: true
          buildAgentHost: ${{ parameters.buildAgentHost }}
          buildAgentWindowsNative: ${{ parameters.buildAgentWindowsNative }}
          buildAgentMacNative: ${{ parameters.buildAgentMacNative }}
          buildAgentLinuxNative: ${{ parameters.buildAgentLinuxNative }}
