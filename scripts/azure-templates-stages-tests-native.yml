parameters:
  - name: buildPipelineType
    type: string
  - name: buildAgentLinux
    type: object
  - name: buildAgentWindows
    type: object
  - name: use1ESPipelineTemplates
    type: boolean
    default: false

stages:
  - stage: native_tests
    displayName: Native Tests
    ${{ if eq(parameters.buildPipelineType, 'test') }}:
      dependsOn: prepare
    ${{ else }}:
      dependsOn: native
    jobs:
      - template: /scripts/azure-templates-jobs-tests-native.yml@self
        parameters:
          buildAgent: ${{ parameters.buildAgentLinux }}
          use1ESPipelineTemplates: ${{ parameters.use1ESPipelineTemplates }}
          platform: linux
      - template: /scripts/azure-templates-jobs-tests-native.yml@self
        parameters:
          buildAgent: ${{ parameters.buildAgentWindows }}
          use1ESPipelineTemplates: ${{ parameters.use1ESPipelineTemplates }}
          platform: windows
