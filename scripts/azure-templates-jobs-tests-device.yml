parameters:
  name: ''
  displayName: ''
  buildAgent: {}
  target: ''
  additionalArgs: ''
  packages: ''
  env: {}
  preBuildSteps: []
  installAndroidSdk: false
  installXcode: true
  installEmsdk: false
  initScript: ''
  jobSdkVersion: ''
  dotnetSdks:
    - sdkVersion: $(DOTNET_VERSION)
      workloadSetVersion: $(DOTNET_WORKLOAD_VERSION)
      tizen:
        manifestBand: $(DOTNET_TIZEN_MANIFEST_BAND)
        manifestVersion: $(DOTNET_TIZEN_MANIFEST_VERSION)
  resultLabel: ''
  logArtifact: ''
  extractVisualImages: true

jobs:
  - template: /scripts/azure-templates-jobs-bootstrapper.yml@self
    parameters:
      name: ${{ parameters.name }}
      displayName: ${{ parameters.displayName }}
      buildAgent: ${{ parameters.buildAgent }}
      target: ${{ parameters.target }}
      additionalArgs: ${{ parameters.additionalArgs }}
      packages: ${{ parameters.packages }}
      env: ${{ parameters.env }}
      preBuildSteps: ${{ parameters.preBuildSteps }}
      installAndroidSdk: ${{ parameters.installAndroidSdk }}
      installXcode: ${{ parameters.installXcode }}
      installEmsdk: ${{ parameters.installEmsdk }}
      initScript: ${{ parameters.initScript }}
      jobSdkVersion: ${{ parameters.jobSdkVersion }}
      dotnetSdks: ${{ parameters.dotnetSdks }}
      shouldPublish: false
      requiredArtifacts:
        - name: native
      postBuildSteps:
        - ${{ if eq(parameters.extractVisualImages, true) }}:
          - pwsh: '& "$(PYTHON_EXE)" scripts/infra/tests/extract-visual-goldens.py output/logs/testlogs --images-out output/logs/testlogs/visual-images'
            displayName: Extract visual-regression images for triage
            condition: always()
        - task: PublishTestResults@2
          displayName: Publish the ${{ coalesce(parameters.resultLabel, parameters.displayName) }} test results
          condition: always()
          inputs:
            testResultsFormat: VSTest
            testResultsFiles: 'output/logs/testlogs/**/*.trx'
            testRunTitle: ${{ parameters.displayName }} Tests
      publishArtifacts:
        - name: ${{ parameters.logArtifact }}
          always: true
          path: 'output/logs/testlogs'
