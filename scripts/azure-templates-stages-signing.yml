parameters:
  - name: buildAgent
    type: object
  - name: useRealSigning
    type: boolean
    default: false

stages:
  - stage: signing
    displayName: Sign NuGets
    dependsOn: package
    jobs:
      - template: /eng/common/templates-official/job/job.yml@self
        parameters:
          name: sign_nugets
          displayName: Sign already-built NuGets
          pool: ${{ parameters.buildAgent.pool }}
          timeoutInMinutes: 180
          workspace:
            clean: all
          runAsPublic: false
          enableMicrobuild: true
          enableMicrobuildForMacAndLinux: false
          microbuildUseESRP: ${{ parameters.useRealSigning }}
          variables:
            - name: _TeamName
              value: '.NET MAUI'
            - name: TeamName
              value: '.NET MAUI'
            - name: _BuildConfig
              value: Release
            - name: _SignType
              ${{ if eq(parameters.useRealSigning, true) }}:
                value: real
              ${{ else }}:
                value: test
          artifacts:
            publish:
              logs:
                name: nuget_signing_logs
          templateContext:
            outputs:
              - output: pipelineArtifact
                displayName: Publish signed NuGets
                artifactName: nuget_signed
                targetPath: '$(Build.SourcesDirectory)\artifacts\packages\Release\Shipping'
                condition: succeeded()
          preSteps:
            - checkout: self
              clean: true
              fetchDepth: 1
              fetchTags: false
              submodules: false
          steps:
            - pwsh: ./scripts/infra/native/shared/set-build-variables.ps1
              displayName: Configure package version identity

            - task: DownloadPipelineArtifact@2
              displayName: Download unsigned NuGets
              inputs:
                artifactName: nuget
                targetPath: '$(Agent.TempDirectory)\unsigned-nugets'

            - pwsh: |
                $source = '$(Agent.TempDirectory)\unsigned-nugets'
                $destination = '$(Build.SourcesDirectory)\artifacts\packages\Release\Shipping'
                Remove-Item $destination -Recurse -Force -ErrorAction Ignore
                New-Item $destination -ItemType Directory -Force | Out-Null

                $packages = @(Get-ChildItem $source -Filter '*.nupkg' -File -Recurse)
                if ($packages.Count -eq 0) {
                  throw "No unsigned NuGet packages were downloaded from artifact 'nuget'."
                }

                Copy-Item $packages.FullName $destination
                Write-Host "Staged $($packages.Count) NuGet package(s) for signing."
              displayName: Stage packages for signing

            - powershell: >
                eng\common\build.ps1
                -configuration Release
                -restore
                -prepareMachine
                -sign
                -ci
                /p:DotNetSignType=$(_SignType)
                "/p:TeamName=$(_TeamName)"
                /p:OfficialBuildId=$(ARCADE_OFFICIAL_BUILD_ID)
                /p:DotNetFinalVersionKind=$(DOTNET_FINAL_VERSION_KIND)
                /p:PostBuildSign=false
              displayName: Sign staged NuGets with Arcade
              env:
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)
