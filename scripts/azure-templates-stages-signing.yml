parameters:
  - name: buildAgent
    type: object
  - name: useRealSigning
    type: boolean
    default: false
  - name: dependsOn
    type: object
    default:
      - package
  - name: sourceBuildId
    type: number
    default: 0
  - name: validationOnly
    type: boolean
    default: false

stages:
  - stage: signing
    displayName: Sign NuGets
    dependsOn: ${{ parameters.dependsOn }}
    jobs:
      - template: /eng/common/templates-official/job/job.yml@self
        parameters:
          name: sign_nugets
          displayName: Sign already-built NuGets
          pool: ${{ parameters.buildAgent.pool }}
          timeoutInMinutes: 180
          workspace:
            clean: all
          runAsPublic: false
          enableMicrobuild: true
          enableMicrobuildForMacAndLinux: false
          microbuildUseESRP: ${{ parameters.useRealSigning }}
          variables:
            - name: _TeamName
              value: '.NET MAUI'
            - name: TeamName
              value: '.NET MAUI'
            - name: _BuildConfig
              value: Release
            - name: _SignType
              ${{ if eq(parameters.useRealSigning, true) }}:
                value: real
              ${{ else }}:
                value: test
          artifacts:
            publish:
              logs:
                name: nuget_signing_logs
          templateContext:
            outputs:
              - ${{ if ne(parameters.validationOnly, true) }}:
                - output: pipelineArtifact
                  displayName: Publish signed NuGets
                  artifactName: nuget_signed
                  targetPath: '$(Build.SourcesDirectory)\artifacts\packages\Release\Shipping'
                  condition: succeeded()
                - output: pipelineArtifact
                  displayName: Publish signed preview NuGets
                  artifactName: nuget_preview_signed
                  targetPath: '$(Build.SourcesDirectory)\artifacts\packages\Release\Preview'
                  condition: succeeded()
                - output: pipelineArtifact
                  displayName: Publish signing verification
                  artifactName: nuget_signing_verification
                  targetPath: '$(Build.SourcesDirectory)\artifacts\signing-verification'
                  condition: succeeded()
          preSteps:
            - checkout: self
              clean: true
              fetchDepth: 1
              fetchTags: false
              submodules: false
          steps:
            - ${{ if eq(parameters.sourceBuildId, 0) }}:
              - task: DownloadPipelineArtifact@2
                displayName: Download unsigned NuGets
                inputs:
                  artifactName: nuget
                  targetPath: '$(Agent.TempDirectory)\unsigned-nugets'

            - ${{ if ne(parameters.sourceBuildId, 0) }}:
              - pwsh: |
                  $uri = "$(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/${{ parameters.sourceBuildId }}?api-version=7.1"
                  $build = Invoke-RestMethod `
                    -Method Get `
                    -Uri $uri `
                    -Headers @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" }

                  if ([int]$build.definition.id -ne [int]"$(System.DefinitionId)") {
                    throw "Build ${{ parameters.sourceBuildId }} belongs to definition $($build.definition.id), not $(System.DefinitionId)."
                  }
                  if ($build.repository.id -ne "$(Build.Repository.ID)") {
                    throw "Build ${{ parameters.sourceBuildId }} belongs to repository '$($build.repository.id)', not '$(Build.Repository.ID)'."
                  }
                  if ($build.result -ne 'succeeded') {
                    throw "Build ${{ parameters.sourceBuildId }} did not succeed (result: '$($build.result)')."
                  }
                  if ('${{ parameters.validationOnly }}' -eq 'True' -and
                      '${{ parameters.useRealSigning }}' -ne 'True') {
                    throw 'Validation-only signing requires realSigning to be enabled.'
                  }
                  if ('${{ parameters.useRealSigning }}' -eq 'True' -and
                      '${{ parameters.validationOnly }}' -ne 'True') {
                    $trustedSource =
                      $build.sourceBranch -eq 'refs/heads/main' -or
                      $build.sourceBranch.StartsWith('refs/heads/release/')
                    $trustedPipeline =
                      $env:BUILD_SOURCEBRANCH -eq 'refs/heads/main' -or
                      $env:BUILD_SOURCEBRANCH.StartsWith('refs/heads/release/')
                    if (-not $trustedSource -or -not $trustedPipeline) {
                      throw "Publishing real-signed artifacts requires trusted pipeline and source-build branches."
                    }
                  }

                  Write-Host "Validated source build $($build.id) at $($build.sourceVersion) from $($build.sourceBranch)."
                displayName: Validate source build provenance
                env:
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)

              - task: DownloadPipelineArtifact@2
                displayName: Download unsigned NuGets from build ${{ parameters.sourceBuildId }}
                inputs:
                  buildType: specific
                  project: '$(System.TeamProjectId)'
                  pipeline: '$(System.DefinitionId)'
                  buildVersionToDownload: specific
                  buildId: ${{ parameters.sourceBuildId }}
                  artifactName: nuget
                  targetPath: '$(Agent.TempDirectory)\unsigned-nugets'

            - pwsh: |
                $source = '$(Agent.TempDirectory)\unsigned-nugets'
                $destination = '$(Build.SourcesDirectory)\artifacts\packages\Release\Shipping'
                Remove-Item $destination -Recurse -Force -ErrorAction Ignore
                New-Item $destination -ItemType Directory -Force | Out-Null

                $packages = @(Get-ChildItem $source -Filter '*.nupkg' -File -Recurse)
                if ($packages.Count -eq 0) {
                  throw "No unsigned NuGet packages were downloaded from artifact 'nuget'."
                }

                Copy-Item $packages.FullName $destination
                Write-Host "Staged $($packages.Count) NuGet package(s) for signing."
              displayName: Stage packages in Arcade layout

            - pwsh: |
                ./scripts/infra/signing/validate-signing-policy.ps1 `
                  -PackageDirectory '$(Build.SourcesDirectory)\artifacts\packages\Release\Shipping' `
                  -SigningPropsPath '$(Build.SourcesDirectory)\eng\Signing.props' `
                  -OutputPath '$(Build.SourcesDirectory)\artifacts\signing-verification\unsigned-manifest.json'
              displayName: Validate signing policy

            - powershell: >
                eng\common\build.ps1
                -configuration Release
                -restore
                -prepareMachine
                -sign
                -ci
                /p:DotNetSignType=$(_SignType)
                "/p:TeamName=$(_TeamName)"
                /p:OfficialBuildId=$(ARCADE_OFFICIAL_BUILD_ID)
                /p:PostBuildSign=false
              displayName: Sign staged NuGets with Arcade
              env:
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)

            - pwsh: |
                ./scripts/infra/signing/verify-signed-packages.ps1 `
                  -OriginalDirectory '$(Agent.TempDirectory)\unsigned-nugets' `
                  -SignedDirectory '$(Build.SourcesDirectory)\artifacts\packages\Release\Shipping' `
                  -SigningPropsPath '$(Build.SourcesDirectory)\eng\Signing.props' `
                  -OutputPath '$(Build.SourcesDirectory)\artifacts\signing-verification\payload-verification.json' `
                  -SignType '$(_SignType)' `
                  -RequireSignatures
              displayName: Verify signed NuGet payload fidelity

            - ${{ if eq(parameters.useRealSigning, true) }}:
              - powershell: >
                  eng\common\sdk-task.ps1
                  -task SigningValidation
                  -restore
                  -msbuildEngine dotnet
                  "/p:PackageBasePath=$(Build.SourcesDirectory)\artifacts\packages\Release\Shipping"
                displayName: Validate trusted signatures with Arcade

              - pwsh: |
                  Get-ChildItem '$(Build.SourcesDirectory)\artifacts\packages\Release\Shipping' -Filter '*.nupkg' -File |
                    ForEach-Object {
                      & dotnet nuget verify $_.FullName --all
                      if ($LASTEXITCODE -ne 0) {
                        throw "NuGet signature verification failed for '$($_.Name)'."
                      }
                    }
                displayName: Verify real NuGet author signatures

            - pwsh: |
                $source = '$(Build.SourcesDirectory)\artifacts\packages\Release\Shipping'
                $destination = '$(Build.SourcesDirectory)\artifacts\packages\Release\Preview'
                Remove-Item $destination -Recurse -Force -ErrorAction Ignore
                New-Item $destination -ItemType Directory -Force | Out-Null

                Get-ChildItem $source -Filter '*-*.nupkg' -File |
                  Copy-Item -Destination $destination
              displayName: Create signed preview package view

            - ${{ if and(eq(parameters.validationOnly, true), eq(parameters.useRealSigning, true)) }}:
              - pwsh: |
                  $priorStatus = $env:AGENT_JOBSTATUS
                  $evidence = '$(Build.SourcesDirectory)\artifacts\signing-verification'
                  $logEvidence = '$(Build.SourcesDirectory)\artifacts\log\Release\signing-validation'
                  try {
                    New-Item $logEvidence -ItemType Directory -Force | Out-Null
                    if (Test-Path $evidence) {
                      Copy-Item "$evidence\*" $logEvidence -Recurse -Force -ErrorAction Continue
                    }
                  } finally {
                    @(
                      '$(Build.SourcesDirectory)\artifacts\packages\Release\Shipping',
                      '$(Build.SourcesDirectory)\artifacts\packages\Release\Preview',
                      $evidence
                    ) | ForEach-Object {
                      Remove-Item $_ -Recurse -Force -ErrorAction Continue
                    }
                  }

                  if ($priorStatus -eq 'Succeeded') {
                    throw 'Real signing validation succeeded; signed artifact publication was intentionally blocked.'
                  }
                  throw "Signed outputs were removed after an earlier validation failure (Agent.JobStatus: '$priorStatus')."
                displayName: Block validation-only signed artifact publication
                condition: always()
