parameters:
  - name: buildAgent
    type: object
  - name: useRealSigning
    type: boolean
    default: false
  - name: publishAssets
    type: boolean
    default: false

stages:
  - stage: signing
    displayName: Sign NuGets
    dependsOn: package
    jobs:
      - template: /eng/common/templates-official/job/job.yml@self
        parameters:
          name: sign_nugets
          displayName: Sign already-built NuGets
          pool: ${{ parameters.buildAgent.pool }}
          timeoutInMinutes: 180
          workspace:
            clean: all
          runAsPublic: false
          enableMicrobuild: true
          enableMicrobuildForMacAndLinux: false
          microbuildUseESRP: ${{ parameters.useRealSigning }}
          variables:
            - name: _TeamName
              value: '.NET MAUI'
            - name: TeamName
              value: '.NET MAUI'
            - name: _BuildConfig
              value: Release
            - name: _SignType
              ${{ if eq(parameters.useRealSigning, true) }}:
                value: real
              ${{ else }}:
                value: test
          artifacts:
            publish:
              logs:
                name: nuget_signing_logs
          templateContext:
            outputs:
              - output: pipelineArtifact
                displayName: Publish signed Arcade Shipping assets
                artifactName: arcade_shipping_signed
                targetPath: '$(Build.SourcesDirectory)\artifacts\packages\Release\Shipping'
                condition: succeeded()
          preSteps:
            - checkout: self
              clean: true
              fetchDepth: 1
              fetchTags: false
              submodules: false
          steps:
            - pwsh: ./scripts/infra/native/shared/set-build-variables.ps1
              displayName: Configure package version identity

            - task: DownloadPipelineArtifact@2
              displayName: Download prepared Arcade Shipping assets
              inputs:
                artifactName: arcade_shipping
                targetPath: '$(Build.SourcesDirectory)\artifacts\packages\Release\Shipping'

            - powershell: >
                eng\common\build.ps1
                -configuration Release
                -restore
                -prepareMachine
                -sign
                -ci
                /p:DotNetSignType=$(_SignType)
                "/p:TeamName=$(_TeamName)"
                /p:OfficialBuildId=$(ARCADE_OFFICIAL_BUILD_ID)
                /p:DotNetFinalVersionKind=$(DOTNET_FINAL_VERSION_KIND)
                /p:PostBuildSign=false
              displayName: Sign staged NuGets with Arcade
              env:
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - ${{ if eq(parameters.publishAssets, true) }}:
    - stage: publish_assets
      displayName: Register Arcade assets
      dependsOn: signing
      jobs:
        - template: /eng/common/templates-official/job/job.yml@self
          parameters:
            name: generate_arcade_manifest
            displayName: Generate Arcade asset manifest
            pool: ${{ parameters.buildAgent.pool }}
            timeoutInMinutes: 180
            workspace:
              clean: all
            runAsPublic: false
            artifacts:
              publish:
                logs:
                  name: arcade_publish_logs
            preSteps:
              - checkout: self
                clean: true
                fetchDepth: 1
                fetchTags: false
                submodules: false
            steps:
              - pwsh: ./scripts/infra/native/shared/set-build-variables.ps1
                displayName: Configure package version identity

              - task: DownloadPipelineArtifact@2
                displayName: Download signed Arcade Shipping assets
                inputs:
                  artifactName: arcade_shipping_signed
                  targetPath: '$(Build.SourcesDirectory)\artifacts\packages\Release\Shipping'

              - task: DownloadPipelineArtifact@2
                displayName: Download prepared Arcade NonShipping assets
                inputs:
                  artifactName: arcade_nonshipping
                  targetPath: '$(Build.SourcesDirectory)\artifacts\packages\Release\NonShipping'

              - powershell: >
                  eng\common\build.ps1
                  -configuration Release
                  -restore
                  -publish
                  -ci
                  /p:OfficialBuildId=$(ARCADE_OFFICIAL_BUILD_ID)
                  /p:DotNetFinalVersionKind=$(DOTNET_FINAL_VERSION_KIND)
                  /p:DotNetPublishUsingPipelines=true
                displayName: Generate Arcade V3 asset manifest
                env:
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)

        - template: /eng/common/templates-official/job/publish-build-assets.yml@self
          parameters:
            dependsOn: generate_arcade_manifest
            publishingVersion: 3
            officialBuildId: $(ARCADE_OFFICIAL_BUILD_ID)

    - template: /eng/common/templates-official/post-build/post-build.yml@self
      parameters:
        publishingInfraVersion: 3
        publishAssetsImmediately: false
        requireDefaultChannels: true
        validateDependsOn:
          - publish_assets
